                if(String(key)===failSetPropertyKey){
                  failSetPropertyKey='';
                  throw new Error('fixture setProperty failure:'+String(key));
                }
                props.set(String(key),String(value));
              },
              deleteProperty:key=>{
                props.delete(String(key));
              }
            })
          };

          let triggers=[];
          let nextId=1;
          const makeTrigger=(handler,id)=>({
            getHandlerFunction:()=>handler,
            getUniqueId:()=>id,
            getEventType:()=>ScriptApp.EventType.CLOCK,
            getTriggerSource:()=>ScriptApp.TriggerSource.CLOCK
          });
          let requireScopeCalls=0;
          let failProjectTriggerReadWhenPresent=false;
          global.ScriptApp = {
            AuthMode:{FULL:'FULL'},
            EventType:{CLOCK:'CLOCK'},
            TriggerSource:{CLOCK:'CLOCK'},
            requireScopes:(mode,scopes)=>{
              requireScopeCalls++;
              if(mode!=='FULL') throw new Error('unexpected auth mode');
              if(!scopes.includes(
                'https://www.googleapis.com/auth/script.scriptapp'
              )){
                throw new Error('script.scriptapp scope missing');
              }
            },
            getProjectTriggers:()=>{
              if(
                failProjectTriggerReadWhenPresent &&
                triggers.length===1
              ){
                failProjectTriggerReadWhenPresent=false;
                throw new Error('fixture post-create trigger read failure');
              }
              return triggers.slice();
            },
            newTrigger:handler=>({
              timeBased:()=>({
                everyHours:hours=>({
                  create:()=>{
                    if(hours!==1) throw new Error('cadence drift');
                    const t=makeTrigger(
                      handler,'TRIG-'+String(nextId++)
                    );
                    triggers.push(t);
                    return t;
                  }
                })
              })
            }),
            deleteTrigger:trigger=>{
              triggers=triggers.filter(x=>x!==trigger);
            }
          };

          global.LockService = {
            getScriptLock:()=>({
              tryLock:()=>true,
              releaseLock:()=>{}
            })
          };
          global.MailApp = {
            sendEmail:()=>{
              throw new Error('H lifecycle must not send mail');
            }
          };

          vm.runInThisContext(
            fs.readFileSync('WebAppFamilyScheduler.js','utf8')
          );

          function assert(ok,msg) {
            if (!ok) throw new Error(msg);
          }

          h3MonitoringObserverPreview=()=>({
            schema:'H3_MONITOR_OBSERVER_SNAPSHOT_V1',
            level:'3級',
            last_checked_at:'2026-09-25T00:00:00.000Z',
            status:'HEALTHY',
            health:{
              source_count:3,
              ok_count:3,
              warning_count:0,
              error_count:0,
              action_required_count:0
            },
            sources:[],
            action_required_events:[],
            write_performed:false,
            snapshot_sha256:'fixture'
          });

          let status=h3MonitoringProductionTriggerStatus();
          assert(
            status.status==='ABSENT' &&
            status.matching_trigger_count===0 &&
            status.write_performed===false,
            'H initial trigger state must be ABSENT'
          );

          let preflight=h3MonitoringProductionPreflight();
          assert(
            preflight.status==='READY' &&
            preflight.email_config_status==='READY' &&
            preflight.observer_status==='HEALTHY' &&
            preflight.action_required_count===0 &&
            preflight.trigger_status==='ABSENT',
            'H initial preflight mismatch'
          );
          assert(
            requireScopeCalls===0,
            'P10 read-only status/preflight must not require scopes'
          );

          failSetPropertyKey=H3_MONITOR_PRODUCTION_TRIGGER_CADENCE_KEY_;
          let metadataWriteBlocked=false;
          try {
            h3MonitoringProductionTriggerEnsure();
          } catch(err) {
            metadataWriteBlocked=String(err.message||err).includes(
              'fixture setProperty failure'
            );
          }
          status=h3MonitoringProductionTriggerStatus();
          assert(
            metadataWriteBlocked &&
            triggers.length===0 &&
            status.status==='ABSENT' &&
            status.metadata_present===false &&
            requireScopeCalls===1,
            'P10 metadata exception did not clean trigger and metadata'
          );

          failProjectTriggerReadWhenPresent=true;
          let readbackBlocked=false;
          try {
            h3MonitoringProductionTriggerEnsure();
          } catch(err) {
            readbackBlocked=String(err.message||err).includes(
              'fixture post-create trigger read failure'
            );
          }
          status=h3MonitoringProductionTriggerStatus();
          assert(
            readbackBlocked &&
            triggers.length===0 &&
            status.status==='ABSENT' &&
            status.metadata_present===false &&
            requireScopeCalls===2,
            'P10 readback exception did not clean trigger and metadata'
          );

          let ensured=h3MonitoringProductionTriggerEnsure();
          assert(
            ensured.status==='READY' &&
            ensured.created===true &&
            ensured.write_performed===true &&
            triggers.length===1 &&
