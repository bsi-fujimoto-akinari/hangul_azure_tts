          vm.runInContext("validateListeningAudioPlan_(JSON.stringify(__k3),'K3')",ctx);
          vm.runInContext("validateListeningOfficialParityPlan_(__k3,'K3')",ctx);

          ctx.__j={section:'K3',plan:k3};
          ctx.__state={
            voice:'JiMin',
            audioVersion:vm.runInContext('HQ_LISTENING_AUDIO_VERSION',ctx)
          };
          const k3spec=vm.runInContext('listeningAudioSpec_(__j,__state)',ctx);

          if (
