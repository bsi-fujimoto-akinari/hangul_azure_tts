            webapp.includes(
              'h3ReviewCompletionFailureResult_'
            ),
            'Review completion wrapper does not return typed failures.'
          );

          const clientJs = client
            .replace(/^<script>\s*/, '')
            .replace(/\s*<\/script>\s*$/, '')
            .replace(
              /\}\)\(\);\s*$/,
              [
                'globalThis.__reviewCompletionTest = {',
                '  app: app,',
                '  reviewCompletionRequest_: reviewCompletionRequest_,',
                '  attemptReviewCompletion_: attemptReviewCompletion_,',
                '  reviewCompletionProviderKind_: reviewCompletionProviderKind_',
                '};',
                '})();'
