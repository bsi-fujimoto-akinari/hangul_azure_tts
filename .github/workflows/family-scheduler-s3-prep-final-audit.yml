name: Family Scheduler S3 PREP Final Audit

on:
  pull_request:
    paths:
      - WebAppFamilySchedulerPrepFinal.js
      - WebAppFamilyScheduler.js
      - WebAppFamilySchedulerPreparation.js
      - H3_FAMILY_SCHEDULER_PREP_FINAL_CONTRACT.md
      - .github/workflows/family-scheduler-s3-prep-final-audit.yml
  push:
    branches:
      - main
    paths:
      - WebAppFamilySchedulerPrepFinal.js
      - WebAppFamilyScheduler.js
      - WebAppFamilySchedulerPreparation.js
      - H3_FAMILY_SCHEDULER_PREP_FINAL_CONTRACT.md
      - .github/workflows/family-scheduler-s3-prep-final-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-prep-final-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check WebAppFamilySchedulerPrepFinal.js

      - name: S3 PREP final static contract
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path(
              "WebAppFamilySchedulerPrepFinal.js"
          ).read_text(encoding="utf-8")
          scheduler = Path(
              "WebAppFamilyScheduler.js"
          ).read_text(encoding="utf-8")
          preparation = Path(
              "WebAppFamilySchedulerPreparation.js"
          ).read_text(encoding="utf-8")
          contract = Path(
              "H3_FAMILY_SCHEDULER_PREP_FINAL_CONTRACT.md"
          ).read_text(encoding="utf-8")

          required_module = [
              "H3_FAMILY_SCHEDULER_PREP_FINAL_V1",
              "H3-FAMILY-SCHEDULER-PREP-FINAL-20260924-V1",
              "function h3FsPrepFinalClassify_(",
              "function h3FsPrepFinalListeningIdentity_(",
              "function h3FsPrepFinalReadingIdentity_(",
              "function h3FsPrepFinalTranslationBindings_(",
              "function h3FsPrepFinalTranslationIdentity_(",
              "function h3FsPrepFinalSourceIdentity_(",
              "function h3FsPrepFinalPreviewCore_(",
              "function h3FamilySchedulerPrepFinalPreview()",
              "write_performed:false",
              "state:'READY'",
              "state:'PREPARE_REQUIRED'",
              "state:'AUTHORING_REQUIRED'",
              "state:'BLOCKED'",
          ]
          for token in required_module:
              if token not in module:
                  raise SystemExit(
                      f"missing S3 PREP final token: {token}"
                  )

          forbidden_module = [
              "appendRow(",
              ".setValue(",
              ".setValues(",
              "deleteRow(",
              "deleteRows(",
              "h3FsPrepareReading_(",
              "h3FsPrepareTranslation_(",
              "prepareListeningBackendSet(",
              "h3FsAuthoringUpsert_(",
              "h3FamilySchedulerAuthoringReconciliationEnsure(",
              "h3FsIssuePreparedFamily_(",
              "h3FsIssueWritten_(",
              "h3FsIssueReading_(",
              "h3FsIssueTranslation_(",
              "h3FsIssueListening_(",
              "h3WrittenSubmit_(",
              "h3ReadingSubmit_(",
              "h3TranslationV2Submit_(",
              "h3FamilySchedulerObserveAfterCommit_(",
          ]
          for token in forbidden_module:
              if token in module:
                  raise SystemExit(
                      "S3 PREP final preview must remain read-only: "
                      + token
                  )

          required_existing = [
              "function h3FsReadiness_(ss)",
              "function h3FsAuthoringPreparationPreview_(ss,family)",
              "function h3FsBuildListeningPrepare_(ss)",
              "function h3FsReadyListeningPrestage_(ss,nextSetNo)",
          ]
          for token in required_existing:
              if token not in scheduler:
                  raise SystemExit(
                      f"missing scheduler dependency: {token}"
                  )

          required_preparation = [
              "function h3FsPrepareWritten_(ss)",
              "function h3FsPrepareReading_(ss)",
              "function h3FsPrepareTranslation_(ss)",
              "function h3FsTranslationSelection_(ss)",
              "function h3FsTranslationSourceForObligation_(",
          ]
          for token in required_preparation:
              if token not in preparation:
                  raise SystemExit(
                      f"missing preparation dependency: {token}"
                  )

          preview_start = scheduler.index(
              "function h3FsAuthoringPreparationPreview_(ss,family)"
          )
          preview_end = scheduler.index(
              "function h3FsAuthoringQueueMatch_",
              preview_start,
          )
          preview = scheduler[preview_start:preview_end]
          for token in [
              "appendRow(",
              ".setValue(",
              ".setValues(",
              "h3FsPrepareReading_(",
              "h3FsPrepareTranslation_(",
              "h3FsIssuePreparedFamily_(",
              "Submit_(",
          ]:
              if token in preview:
                  raise SystemExit(
                      "existing authoring preparation preview "
                      "materializes state: " + token
                  )

          for token in [
              "| L |",
              "| W |",
              "| R |",
              "| T |",
              "`READY`",
              "`PREPARE_REQUIRED`",
              "`AUTHORING_REQUIRED`",
              "`BLOCKED`",
              "NO_OFFICIAL_PROVENANCE_CLAIM",
          ]:
              if token not in contract:
                  raise SystemExit(
                      f"S3 truth-table documentation missing: {token}"
                  )

          print("S3 PREP final static contract PASS")
          PY

      - name: S3 PREP final truth-table fixture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          global.H3_FS_FAMILIES_ = ['L','W','R','T'];
          vm.runInThisContext(
            fs.readFileSync(
              'WebAppFamilySchedulerPrepFinal.js',
              'utf8'
            )
          );

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          function assertStateMap(result, expected) {
            for (const family of H3_FS_FAMILIES_) {
              assert(
                result.families[family].state === expected[family],
                family + ': expected ' + expected[family] +
                  ', got ' + result.families[family].state
              );
            }
            assert(
              result.write_performed === false,
              'preview must report write_performed=false'
            );
          }

          for (const family of H3_FS_FAMILIES_) {
            const ready = h3FsPrepFinalClassify_(
              'READY', true, ''
            );
            assert(
              ready.state === 'READY',
              family + ': READY classifier failed'
            );
            const prepare = h3FsPrepFinalClassify_(
              'PREPARE_REQUIRED',
              true,
              'PREPARE_REQUIRED'
            );
            assert(
              prepare.state === 'PREPARE_REQUIRED',
              family + ': PREPARE_REQUIRED classifier failed'
            );
            const author = h3FsPrepFinalClassify_(
              'PREPARE_REQUIRED',
              true,
              'AUTHORING_REQUIRED'
            );
            assert(
              author.state === 'AUTHORING_REQUIRED',
              family + ': AUTHORING_REQUIRED classifier failed'
            );
          }

          h3FsPrepFinalSourceIdentity_ = (_, family) => ({
            kind:'FIXTURE_SOURCE',
            family
          });

          h3FsReadiness_ = () => ({
            L:{state:'PREPARE_REQUIRED',eligible:true,reason:''},
            W:{state:'READY',eligible:true,reason:''},
            R:{state:'PREPARE_REQUIRED',eligible:true,reason:''},
            T:{state:'PREPARE_REQUIRED',eligible:true,reason:''}
          });
          h3FsAuthoringPreparationPreview_ = (_, family) => ({
            L:{status:'READY_TO_PREPARE',family:'L'},
            R:{status:'PREPARE_REQUIRED',family:'R'},
            T:{status:'PREPARE_REQUIRED',family:'T'}
          })[family];

          const currentLike =
            h3FsPrepFinalPreviewCore_({},'3級');
          assertStateMap(currentLike,{
            L:'PREPARE_REQUIRED',
            W:'READY',
            R:'PREPARE_REQUIRED',
            T:'PREPARE_REQUIRED'
          });

          h3FsReadiness_ = () =>
            Object.fromEntries(
              H3_FS_FAMILIES_.map(f => [
                f,
                {state:'PREPARE_REQUIRED',eligible:true,reason:''}
              ])
            );
          h3FsAuthoringPreparationPreview_ = (_, family) => ({
            status:'AUTHORING_REQUIRED',
            family,
            authoring_target:'FIXTURE:'+family
          });
          const allAuthoring =
            h3FsPrepFinalPreviewCore_({},'3級');
          assertStateMap(allAuthoring,{
            L:'AUTHORING_REQUIRED',
            W:'AUTHORING_REQUIRED',
            R:'AUTHORING_REQUIRED',
            T:'AUTHORING_REQUIRED'
          });

          let prepCalls = 0;
          h3FsReadiness_ = () =>
            Object.fromEntries(
              H3_FS_FAMILIES_.map(f => [
                f,
                {state:'READY',eligible:true,reason:''}
              ])
            );
          h3FsAuthoringPreparationPreview_ = () => {
            prepCalls++;
            throw new Error('READY must not request preparation preview');
          };
          const allReady =
            h3FsPrepFinalPreviewCore_({},'3級');
          assertStateMap(allReady,{
            L:'READY',
            W:'READY',
            R:'READY',
            T:'READY'
          });
          assert(prepCalls===0,'READY path called preparation preview');

          h3FsReadiness_ = () => ({
            L:{
              state:'BLOCKED',
              eligible:false,
              reason:'LISTENING_RUNTIME_GATE'
            },
            W:{state:'READY',eligible:true,reason:''},
            R:{state:'READY',eligible:true,reason:''},
            T:{state:'READY',eligible:true,reason:''}
          });
          const blocked =
            h3FsPrepFinalPreviewCore_({},'3級');
          assert(
            blocked.families.L.state === 'BLOCKED',
            'blocked gate classification failed'
          );
          assert(
            blocked.families.L.source_identity.kind ===
              'BLOCKED_GATE',
            'blocked path must not resolve source identity'
          );

          console.log(
            'S3 PREP final truth-table fixture PASS'
          );
          NODE
