<style>
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    color: #171717;
    background: #f5f5f5;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #f5f5f5; }
  button, input, audio { font: inherit; }

  .shell {
    width: min(760px, 100%);
    margin: 0 auto;
    padding: 20px 14px 48px;
  }
  .page-header { margin-bottom: 14px; }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
  }
  h1 { margin: 0; font-size: 24px; }
  .set-id {
    margin: 5px 0 0;
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .notice, .panel, .question-card, .reading-passage-card, .review-panel {
    background: #fff;
    border: 1px solid #d8d8d8;
    border-radius: 12px;
  }
  .notice {
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .panel { padding: 14px; margin-top: 12px; }
  .questions { display: grid; gap: 12px; }
  .question-card, .reading-passage-card { padding: 14px; }
  .reading-passage-card { width: 100%; }
  .question-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
  }
  .question-title {
    margin: 0;
    font-size: 17px;
    align-self: center;
  }
  .written-question .question-head {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .question-prompt {
    white-space: pre-wrap;
    line-height: 1.65;
    margin: 2px 0 12px;
    font-size: 16px;
    overflow-wrap: anywhere;
  }
  .question-head > .compact-audio-wrap,
  .review-section-head > .compact-audio-wrap {
    align-self: center;
    display: flex;
    align-items: center;
  }
  .question-head > .uncertain {
    align-self: center;
  }

  .audio-wrap {
    margin: 2px 0 12px;
  }
  .audio-label {
    margin: 0 0 5px;
    font-size: 13px;
    font-weight: 700;
  }
  .audio-engine {
    display: none;
  }

  .inline-seek-audio-wrap {
    width: 100%;
    max-width: 100%;
  }
  .audio-seek-controls {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 100%;
    min-height: 34px;
    border: 1px solid #bdbdbd;
    border-radius: 9px;
    background: #f7f7f7;
    overflow: hidden;
  }
  .inline-seek-audio-wrap .audio-toggle {
    flex: 0 0 40px;
    width: 40px;
    min-width: 40px;
    height: 34px;
    min-height: 34px;
    border: 0;
    border-right: 1px solid #bdbdbd;
    border-radius: 0;
    background: #555;
    color: #fff;
    padding: 0;
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .inline-seek-audio-wrap .audio-toggle:disabled {
    opacity: .45;
  }

  .audio-seek {
    --seek-fill: 0%;
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    margin: 0 12px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
  }
  .audio-seek::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background:
      linear-gradient(
        to right,
        #555 0%,
        #555 var(--seek-fill),
        #cfcfcf var(--seek-fill),
        #cfcfcf 100%
      );
  }
  .audio-seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    margin-top: -6px;
    border: 0;
    border-radius: 50%;
    background: #555;
  }
  .audio-seek::-moz-range-track {
    height: 4px;
    border: 0;
    border-radius: 999px;
    background: #cfcfcf;
  }
  .audio-seek::-moz-range-progress {
    height: 4px;
    border-radius: 999px;
    background: #555;
  }
  .audio-seek::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border: 0;
    border-radius: 50%;
    background: #555;
  }
  .audio-seek:disabled {
    opacity: .45;
    cursor: default;
  }

  .compact-audio-wrap {
    margin: 2px 0 12px;
    min-width: 0;
  }
  .compact-audio-wrap .audio-status {
    margin-top: 4px;
    font-size: 10px;
  }
  .compact-audio-wrap .media-fallback {
    margin-top: 3px;
    font-size: 10px;
  }

  .media-fallback {
    display: inline-block;
    margin-top: 5px;
    font-size: 12px;
  }

  .k1-image {
    display: block;
    width: 100%;
    height: auto;
    max-height: 420px;
    object-fit: contain;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin: 4px 0 12px;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .choice {
    width: 100%;
    min-height: 46px;
    text-align: left;
    border: 1px solid #b9b9b9;
    border-radius: 10px;
    background: #fff;
    padding: 11px 12px;
    cursor: pointer;
  }
  .choice.selected {
    border: 2px solid #171717;
    font-weight: 700;
  }
  .choice:disabled,
  .uncertain:disabled,
  .secondary:disabled,
  .primary:disabled {
    cursor: default;
    opacity: .55;
  }

  .uncertain {
    min-width: 44px;
    border: 1px solid #b9b9b9;
    border-radius: 10px;
    background: #fff;
    padding: 7px 11px;
    font-weight: 700;
  }
  .uncertain.active {
    border: 2px solid #171717;
    background: #f2f2f2;
  }

  .control-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .secondary, .primary, .copy-button {

  .secondary { border: 1px solid #aaa; background: #fff; }

  .live-summary {

  }
  .score {

    font-weight: 800;
    margin: 0 0 10px;
  }

  table { width: 100%; border-collapse: collapse; margin: 10px 0; }

  }
  pre {

    overflow-wrap: anywhere;

    padding: 10px;
    border-radius: 8px;
    user-select: text;
  }

  .error { border-color: #a33; }

  .review-panel {
    margin-top: 16px;
    overflow: clip;
  }
  .review-head {
    padding: 12px 14px 0;
  }
  .review-head h2 {
    margin: 0 0 3px;
    font-size: 18px;

  .review-head p {

    font-size: 13px;

  .review-player-sticky {

    z-index: 8;

    border-bottom: 1px solid #ddd;

  .review-script {

    border-radius: 0;
    background: #fff;
    padding: 14px;
    font-size: 16px;
    line-height: 1.75;

    background: #fff;

    font-weight: 700;

    .live-summary {
      font-size: 13px;

    .result {
      padding: 11px;

    .score { font-size: 19px; }
    table { font-size: 14px; }

    .review-panel {
      margin-top: 12px;

    .review-head {
      padding: 11px 11px 0;
    }
    .review-player-sticky {
      top: 0;
      padding: 9px 11px 10px;
    }
    .review-script {
      padding: 12px;
      font-size: 16px;
      line-height: 1.8;
    }
  }

    margin: 0 0 6px;

  .home {
    display: grid;
    gap: 12px;
  }

  .home-hero,
  .home-card,
  .persistent-review-card,
  .review-technical {
    background: #fff;
    border: 1px solid #d8d8d8;
    border-radius: 12px;
  }

  .home-hero {
    padding: 16px;
  }

  .home-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .home-title-row h2 {
    margin: 0;
    font-size: 28px;
    line-height: 1.1;
  }

  .home-subtitle {
    border: 1px solid #d4d4d4;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
  }

  .home-current-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #ececec;
  }

  .home-current-meta {
    display: grid;
    gap: 2px;
  }

  .home-current-label {
    font-size: 12px;
    color: #666;
  }

  .home-current-meta strong {
    font-size: 15px;
  }

  .home-current-action {
    min-width: 74px;
  }

  .home-card {
    padding: 14px;
  }

  .home-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .home-section-title {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .home-section-title h3 {
    margin: 0;
  }

  .home-history-count {
    display: inline-grid;
    place-items: center;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    border-radius: 999px;
    background: #f1f1f1;
    font-size: 12px;
    font-weight: 800;
  }

  .review-controls-sticky {
    position: sticky;
    top: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 10px -2px 0;
    padding: 8px 2px;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(8px);
  }

  .review-history-filters,
  .review-history-sorts {
    display: flex;
    align-items: stretch;
  }

  .review-segmented {
    overflow: hidden;
    border: 1px solid #b8b8b8;
    border-radius: 12px;
    background: #fff;
  }

  .review-filter-button,
  .review-sort-button {
    min-height: 38px;
    border: 0;
    border-radius: 0;
    background: #fff;
    padding: 7px 12px;
    color: #6f6f6f;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .01em;
    line-height: 1;
  }

  .review-filter-button + .review-filter-button,
  .review-sort-button + .review-sort-button {
    border-left: 1px solid #d8d8d8;
  }

  .review-filter-button.active,
  .review-sort-button.active {

    color: #fff;
