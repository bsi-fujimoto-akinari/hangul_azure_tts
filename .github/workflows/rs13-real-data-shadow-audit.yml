name: RS13 Real Data Shadow Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    name: rs13-real-data-shadow-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RS-13 real-data shadow observation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          const capture = fs.readFileSync('WebAppMultiSkillEvidence.js','utf8');
          const shadow = fs.readFileSync('WebAppMultiSkillShadow.js','utf8');

          const context = {console,JSON,Number,String,Object,Array,Math,Date};
          context.SpreadsheetApp = {flush() {}};
          context.globalThis = context;
          vm.createContext(context);
          vm.runInContext(capture, context);
          vm.runInContext(shadow, context);

          assert.strictEqual(
            context.H3_MULTI_SKILL_SHADOW_CONTRACT_ID_,
            'H3-RS13-REAL-DATA-SHADOW-20260922-V1'
          );

          const eh=context.H3_MULTI_SKILL_HEADERS_;
          const ch=context.H3_MULTI_SKILL_CONCEPT_HEADERS_;
          const sh=context.H3_MULTI_SKILL_SHADOW_HEADERS_;

          function row(headers,obj) {
            return headers.map(k =>
              Object.prototype.hasOwnProperty.call(obj,k) ? obj[k] : ''
            );
          }

          const concepts=[
            ch,
            row(ch,{
              CONCEPT_ID:'GRAM:-ㄹ_틈이_없다',
              LEVEL:'3級',
              CONCEPT_DOMAIN:'GRAMMAR',
              CONCEPT_LABEL:'-ㄹ 틈이 없다',
              SKILL_ID:'H3-P11-SK013',
              FAMILY:'TRANSLATION',
              SECTION_KEY:'H3-P11',
              APPLICATION_LABEL:'-ㄹ 틈이 없다',
              MAPPING_ROLE:'APPLICATION_SKILL',
              MATCH_TYPE:'EXACT_GRAMMAR_CONCEPT',
              CONFIDENCE:'HIGH',
              DIRECT_REUSE:'NO',
              STATE_TRANSFER:'NO',
              RETEST_CLOSURE:'NO',
              STABILITY_TRANSFER:'NO',
              SCHEDULER_USE:'DIAGNOSTIC_SELECTION_ONLY',
              STATUS:'ACTIVE_PILOT'
            })
          ];

          function evidence(overrides) {
            return row(eh,Object.assign({
              LINK_ID:'MSL|MSE|WRITTEN|H3TX-TEST|Q1|CONTRIBUTORY|H3-P11-SK013|GRAM:-ㄹ_틈이_없다',
              EVIDENCE_EVENT_ID:'MSE|WRITTEN|H3TX-TEST|Q1',
              LEVEL:'3級',
              EVENT_SCOPE:'COMMITTED_LEARNING',
              SOURCE_EVENT_REF:'WRITTEN|H3TX-TEST|Q1',
              SOURCE_SET_ID:'H3-TEST',
              SOURCE_TXN_ID:'H3TX-TEST',
              SOURCE_Q_NO:'1',
              SOURCE_SURFACE_KEY:'WRITTEN|TEST|Q1',
              SOURCE_RESULT:'×',
              SOURCE_FAMILY:'WRITTEN',
              DIRECT_SKILL_ID:'H3-P3-SK035',
              LINK_ROLE:'CONTRIBUTORY',
              TARGET_SKILL_ID:'H3-P11-SK013',
              CONCEPT_ID:'GRAM:-ㄹ_틈이_없다',
              CONFIDENCE:'HIGH',
              PROVENANCE_KIND:'AUTHOR_VERIFIED_EXACT',
              PROVENANCE_REF:'H3-RS12-PROSPECTIVE-CAPTURE-20260922-V1:H3-RS12-AUTHOR-VERIFIED-EXACT-V1',
              DIRECT_STATE_AUTHORITY:'NO',
              STATE_TRANSFER:'NO',
              RETEST_CLOSURE_TRANSFER:'NO',
              STABILITY_TRANSFER:'NO',
              SCHEDULER_USE:'DIAGNOSTIC_ONLY',
              STATUS:'ACTIVE_COMMITTED',
              CREATED_AT:'2026-09-22T10:45:00+09:00'
            },overrides||{}));
          }

          const built=context.h3MultiSkillShadowBuildRowsFromValues_(
            [eh,evidence()],
            concepts
          );
          assert.strictEqual(built.length,1);
          assert.strictEqual(built[0][14],'CONTRIBUTORY_X');
          assert.strictEqual(built[0][15],'FALSE');
          assert.strictEqual(built[0][16],'TRUE');
          assert.strictEqual(built[0][18],'PASS_SHADOW_OBSERVED');

          const ignored=context.h3MultiSkillShadowBuildRowsFromValues_(
            [eh,evidence({
              EVENT_SCOPE:'SYSTEM_TEST_SHADOW',
              STATUS:'PASS_SHADOW',
              PROVENANCE_KIND:'SYSTEM_TEST_SHADOW_AUTHORED'
            })],
            concepts
          );
          assert.strictEqual(ignored.length,0);

          const direct=context.h3MultiSkillShadowBuildRowsFromValues_(
            [eh,evidence({LINK_ROLE:'DIRECT'})],
            concepts
          );
          assert.strictEqual(direct.length,0);

          assert.throws(
            () => context.h3MultiSkillShadowBuildRowsFromValues_(
              [eh,evidence({STATE_TRANSFER:'YES'})],
              concepts
            ),
            /TRANSFER_OR_AUTHORITY_VIOLATION/
          );

          assert.throws(
            () => context.h3MultiSkillShadowBuildRowsFromValues_(
              [eh,evidence({SOURCE_FAMILY:'TRANSLATION'})],
              concepts
            ),
            /CROSS_FAMILY_INVALID/
          );

          const metrics=context.h3MultiSkillShadowMetricsFromValues_([
            sh,
            built[0]
          ]);
          assert.strictEqual(metrics.total,1);
          assert.strictEqual(metrics.distinct_event_count,1);
          assert.strictEqual(metrics.scheduler_applied_true,0);
          assert.strictEqual(metrics.unsafe_rows,0);

          class FakeSheet {
            constructor(data) { this.data=data.map(r=>r.slice()); }
            getLastRow() { return this.data.length; }
            getRange(r,c,rows,cols) {
              const self=this;
              return {
                getDisplayValues() {
                  const out=[];
                  for(let i=0;i<rows;i++) {
                    const src=self.data[r-1+i] || [];
                    out.push(Array.from({length:cols},(_,j)=>String(src[c-1+j] ?? '')));
                  }
                  return out;
                },
                setValues(values) {
                  for(let i=0;i<values.length;i++) {
                    const idx=r-1+i;
                    while(self.data.length<=idx) self.data.push([]);
                    const target=self.data[idx];
                    for(let j=0;j<values[i].length;j++) target[c-1+j]=values[i][j];
                  }
                }
              };
            }
          }
          class FakeSpreadsheet {
            constructor() {
              this.sheets={
                skill_concept_map_v1:new FakeSheet(concepts),
                multi_skill_shadow_observation_v1:new FakeSheet([sh])
              };
            }
            getSheetByName(name) { return this.sheets[name] || null; }
          }

          context.h3MultiSkillReadValues_=function(spreadsheet,sheetName,headers,label) {
            const sheet=spreadsheet.getSheetByName(sheetName);
            if(!sheet) throw new Error(label+'_SHEET_MISSING');
            return sheet.getRange(
              1,1,Math.max(1,sheet.getLastRow()),headers.length
            ).getDisplayValues();
          };

          const ss=new FakeSpreadsheet();
          const first=context.h3MultiSkillShadowPersistEvidenceValues_(
            ss,[eh,evidence()]
          );
          assert.strictEqual(first.status,'PASS');
          assert.strictEqual(first.written,1);

          const second=context.h3MultiSkillShadowPersistEvidenceValues_(
            ss,[eh,evidence()]
          );
          assert.strictEqual(second.status,'NO_OP');
          assert.strictEqual(second.no_op,1);

          assert.throws(
            () => context.h3MultiSkillShadowPersistEvidenceValues_(
              ss,[eh,evidence({SOURCE_RESULT:'△'})]
            ),
            /OBSERVATION_ID_CONFLICT/
          );

          assert(
            capture.includes('h3MultiSkillShadowObserveRows_'),
            'RS-12 capture is not connected to RS-13 observer.'
          );
          assert(
            capture.includes("status:'RECOVERY_REQUIRED'"),
            'RS-13 shadow failure is not represented as fail-soft recovery.'
          );

          console.log('RS-13 real-data shadow audit passed.');
          NODE
