name: Apps Script auto-sync

on:
  workflow_run:
    workflows: ["Repository audit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-auto-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout audited main source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 2

      - name: Verify checked-out source is main lineage
        shell: bash
        run: |
          git fetch origin main --depth=2
          if ! git merge-base --is-ancestor HEAD origin/main &&              ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Checked-out source is not on main lineage."
            exit 1
          fi

      - name: Detect Apps Script-impacting change
        id: impact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              *.js|*.gs|*.html|appsscript.json)
                changed=true
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r HEAD)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check clasp credential availability
        if: steps.impact.outputs.changed == 'true'
        id: auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON is not configured. Apps Script sync is skipped safely."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize clasp credentials
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ.get('CLASPRC_JSON', '')
          if not value.strip():
              raise SystemExit('CLASPRC_JSON is empty')

          path = Path.home() / '.clasprc.json'
          path.write_text(value, encoding='utf-8')
          path.chmod(0o600)
          PY


      - name: Verify exact Apps Script target
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          data = json.loads(Path('.clasp.json').read_text(encoding='utf-8'))
          actual = data.get('scriptId')
          if actual != expected:
              raise SystemExit(f'Apps Script target mismatch: {actual!r}')
          PY

      - name: Show Apps Script file status
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 show-file-status --json

      - name: Push audited main to Apps Script HEAD
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          output="$(npx -y @google/clasp@3.4.0 push --force 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Skipping push'; then
            echo "::error::clasp skipped the push."
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Eq '^Pushed (one|[0-9]+) file|^Pushed no files|^Script is already up to date[.]$'; then
            echo "::error::clasp did not report a completed push."
            exit 1
          fi

      - name: Read deployment inventory
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 list-deployments


      - name: S4-R4-H production cutover and readback
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true' && github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail

          preflight="$RUNNER_TEMP/s4-r4-h-preflight.json"
          ensure="$RUNNER_TEMP/s4-r4-h-ensure.json"
          trigger="$RUNNER_TEMP/s4-r4-h-trigger.json"
          wrapper="$RUNNER_TEMP/s4-r4-h-wrapper.json"
          home="$RUNNER_TEMP/s4-r4-h-home.json"
          notification="$RUNNER_TEMP/s4-r4-h-notification.json"
          rollback="$RUNNER_TEMP/s4-r4-h-rollback.json"
          armed=false

          rollback_on_error() {
            rc=$?
            if [ "$armed" = true ]; then
              echo "::warning::S4-R4-H cutover failed after trigger ensure; removing verified production trigger."
              npx -y @google/clasp@3.4.0 \
                run-function h3MonitoringProductionTriggerRemove --json \
                > "$rollback" || true
            fi
            exit "$rc"
          }
          trap rollback_on_error ERR

          npx -y @google/clasp@3.4.0 \
            run-function h3MonitoringProductionPreflight --json \
            > "$preflight"

          python3 - "$preflight" <<'PY'
          import json
          import sys
          from pathlib import Path

          def parse_json(path):
              raw=Path(path).read_text(encoding='utf-8').strip()
              try:
                  return json.loads(raw)
              except Exception:
                  for line in reversed(raw.splitlines()):
                      line=line.strip()
                      if not line:
                          continue
                      try:
                          return json.loads(line)
                      except Exception:
                          pass
              raise SystemExit('S4-R4-H preflight returned no parseable JSON')

          def find_schema(value,schema):
              if isinstance(value,str):
                  text=value.strip()
                  if text.startswith(('{','[')):
                      try:
                          return find_schema(json.loads(text),schema)
                      except Exception:
                          return None
              if isinstance(value,dict):
                  if value.get('schema')==schema:
                      return value
                  for child in value.values():
                      found=find_schema(child,schema)
                      if found is not None:
                          return found
              if isinstance(value,list):
                  for child in value:
                      found=find_schema(child,schema)
                      if found is not None:
                          return found
              return None

          out=find_schema(
              parse_json(sys.argv[1]),
              'H3_MONITOR_PRODUCTION_PREFLIGHT_V1'
          )
          if out is None:
              raise SystemExit('S4-R4-H preflight schema missing')
          expected={
              'status':'READY',
              'email_config_status':'READY',
              'observer_status':'HEALTHY',
              'observer_error_count':0,
              'action_required_count':0,
              'write_performed':False,
          }
          for key,value in expected.items():
              if out.get(key)!=value:
                  raise SystemExit(
                      'S4-R4-H preflight mismatch: '+key
                  )
          if out.get('trigger_status') not in ('ABSENT','READY'):
              raise SystemExit('S4-R4-H trigger preflight not safe')
          print(
              'S4-R4-H preflight PASS: HEALTHY action_required_count=0 '
              'recipient=READY trigger_status='+str(out.get('trigger_status'))
          )
          PY

          npx -y @google/clasp@3.4.0 \
            run-function h3MonitoringProductionTriggerEnsure --json \
            > "$ensure"
          armed=true

          npx -y @google/clasp@3.4.0 \
            run-function h3MonitoringProductionTriggerStatus --json \
            > "$trigger"

          npx -y @google/clasp@3.4.0 \
            run-function h3MonitoringObserverEmailRun --json \
            > "$wrapper"

          npx -y @google/clasp@3.4.0 \
            run-function h3MonitoringHomeReadModel --json \
            > "$home"

          npx -y @google/clasp@3.4.0 \
            run-function h3MonitoringNotificationCurrent --json \
            > "$notification"

          python3 - "$ensure" "$trigger" "$wrapper" "$home" "$notification" <<'PY'
          import json
          import sys
          from pathlib import Path

          def parse_json(path):
              raw=Path(path).read_text(encoding='utf-8').strip()
              try:
                  return json.loads(raw)
              except Exception:
                  for line in reversed(raw.splitlines()):
                      line=line.strip()
                      if not line:
                          continue
                      try:
                          return json.loads(line)
                      except Exception:
                          pass
              raise SystemExit('S4-R4-H cutover returned no parseable JSON')

          def find_schema(value,schema):
              if isinstance(value,str):
                  text=value.strip()
                  if text.startswith(('{','[')):
                      try:
                          return find_schema(json.loads(text),schema)
                      except Exception:
                          return None
              if isinstance(value,dict):
                  if value.get('schema')==schema:
                      return value
                  for child in value.values():
                      found=find_schema(child,schema)
                      if found is not None:
                          return found
              if isinstance(value,list):
                  for child in value:
                      found=find_schema(child,schema)
                      if found is not None:
                          return found
              return None

          ensure=find_schema(
              parse_json(sys.argv[1]),
              'H3_MONITOR_PRODUCTION_TRIGGER_V1'
          )
          trigger=find_schema(
              parse_json(sys.argv[2]),
              'H3_MONITOR_PRODUCTION_TRIGGER_V1'
          )
          wrapper=find_schema(
              parse_json(sys.argv[3]),
              'H3_MONITOR_OBSERVER_EMAIL_RUN_V1'
          )
          home=find_schema(
              parse_json(sys.argv[4]),
              'H3_MONITOR_HOME_READ_MODEL_V1'
          )
          notification=find_schema(
              parse_json(sys.argv[5]),
              'H3_MONITOR_NOTIFICATION_V1'
          )
          if None in (ensure,trigger,wrapper,home,notification):
              raise SystemExit('S4-R4-H cutover schema missing')

          ensured_trigger=ensure.get('trigger') or {}
          if (
              ensure.get('status')!='READY' or
              ensured_trigger.get('matching_trigger_count')!=1
          ):
              raise SystemExit('S4-R4-H ensure readback mismatch')

          expected_trigger={
              'status':'READY',
              'trigger_handler':'h3MonitoringObserverEmailRun',
              'configured_cadence_hours':1,
              'matching_trigger_count':1,
              'event_type':'CLOCK',
              'trigger_source':'CLOCK',
              'metadata_present':True,
              'metadata_match':True,
              'duplicate_trigger':False,
              'write_performed':False,
          }
          for key,value in expected_trigger.items():
              if trigger.get(key)!=value:
                  raise SystemExit(
                      'S4-R4-H trigger status mismatch: '+key
                  )

          n=wrapper.get('notification') or {}
          if (
              wrapper.get('status')!='NO_EMAIL' or
              n.get('status')!='NO_EMAIL' or
              n.get('email_sent') is not False or
              wrapper.get('semantic_authoring_performed') is not False or
              wrapper.get('rs13_close_performed') is not False or
              wrapper.get('rs14_activation_performed') is not False
          ):
              raise SystemExit('S4-R4-H production wrapper mismatch')

          health=home.get('observer_health') or {}
          email=home.get('email_notifications') or {}
          if (
              home.get('status')!='HEALTHY' or
              health.get('error_count')!=0 or
              health.get('action_required_count')!=0 or
              email.get('status')!='READY' or
              email.get('active_count')!=0
          ):
              raise SystemExit('S4-R4-H HOME readback mismatch')

          if (
              notification.get('status')!='READY' or
              notification.get('config_status')!='READY' or
              notification.get('active_count')!=0 or
              notification.get('read_only') is not True or
              notification.get('write_performed') is not False
          ):
              raise SystemExit('S4-R4-H notification readback mismatch')

          print(
              'S4-R4-H production cutover PASS: trigger_count=1 '
              'handler=h3MonitoringObserverEmailRun cadence_hours=1 '
              'observer=HEALTHY action_required_count=0 '
              'notification=READY active_notification_count=0 '
              'real_mail=0 protected_action=false'
          )
          PY

          armed=false

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apps Script auto-sync"
            echo ""
            echo "- source: $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "- Apps Script-impacting change: ${{ steps.impact.outputs.changed || 'unknown' }}"
            echo "- clasp credential ready: ${{ steps.auth.outputs.ready || 'not-needed' }}"
            echo "- target script ID: 1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-"
            echo '- manifest overwrite mode: audited CI only (clasp push --force)'
            echo '- versioned /exec deployment: not changed by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"

