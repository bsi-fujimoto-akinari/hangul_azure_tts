                role:'choice_number'+(i+1),
                text:numberTexts[i],
                repeat:1,
                pause_ms_after:900
              });
              out.push({
                role:'choice'+(i+1),
                text:choice,
                repeat:1,
                pause_ms_after:3200
              });
              out.push({
                role:'choice'+(i+1),
                text:choice,
                repeat:1,
                pause_ms_after:3200
              });
            });
            return out;
