          for needle in required_review:
              if needle not in review:
                  raise SystemExit(f'Legacy Review runtime invariant missing: {needle}')

          for removed in [
              "function validateLegacyPersistentReviewBinding_(",
              "function h3LegacyReviewPhase2Preview_(",
          ]:
              if removed in review:
                  raise SystemExit(f'One-shot migration helper still active: {removed}')

          for needle in [
