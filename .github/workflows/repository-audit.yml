              if forbidden in g:
                  raise SystemExit(f'Review replay contains learner WRITE surface: {forbidden}')

          if '## 26. Legacy pre-Web Review compatibility' not in arch:
              raise SystemExit('Slim legacy architecture contract missing.')
          if '## 27. Legacy pre-Web Review runtime' not in ops:
