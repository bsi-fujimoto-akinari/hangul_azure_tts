                provider_kind: 'WRITTEN',
                kind: 'WRITTEN',
                surface_family: '5W',
                set_id: 'H3-W',
                sections: [{}, {}, {}, {}, {}]
              },
              kind: 'WRITTEN',
              source: 'H3-W'
            },
            {
              label: '2R',
              review: {
