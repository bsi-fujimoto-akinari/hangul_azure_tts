              if needle not in client:
                  raise SystemExit(f'Legacy Review client invariant missing: {needle}')

          grade = re.search(
              r"function gradeReviewReplay_\((?P<body>.*?)\n\}\n",
              review,
              re.S,
          )
          if not grade:
              raise SystemExit('Could not isolate gradeReviewReplay_.')
          g = grade.group('body')
          for forbidden in [
              'appendRow(',
              'setValue(',
              'setValues(',
              'h3ProdSubmit_(',
