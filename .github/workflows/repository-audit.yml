          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const crypto = require('crypto');

          const source = fs.readFileSync('Code.js', 'utf8');
          const ctx = vm.createContext({
            console,
            Utilities: {
              DigestAlgorithm: { SHA_256: 'SHA_256' },
              Charset: { UTF_8: 'UTF_8' },
              computeDigest: (_algorithm, text) =>
                Array.from(
                  crypto.createHash('sha256')
                    .update(String(text), 'utf8')
                    .digest()
                )
            }
          });
          vm.runInContext(source, ctx, {filename:'Code.js'});

          const numberTexts =
            ['マルイチ','マルニ','マルサン','マルヨン'];

          function numberedPlan(prompt, choices, promptSecondPause) {
            const out = [
              {role:'prompt',text:prompt,repeat:1,pause_ms_after:3200},
              {role:'prompt',text:prompt,repeat:1,pause_ms_after:promptSecondPause}
            ];
            choices.forEach((choice,i) => {
              out.push({
                role:'choice_number'+(i+1),
                text:numberTexts[i],
                repeat:1,
                pause_ms_after:900
              });
              out.push({
                role:'choice'+(i+1),
                text:choice,
                repeat:1,
                pause_ms_after:3200
              });
              out.push({
                role:'choice'+(i+1),
                text:choice,
                repeat:1,
                pause_ms_after:3200
              });
            });
            return out;
          }

          const choices = ['하나예요.','둘이에요.','셋이에요.','넷이에요.'];
          const k2 = numberedPlan('질문입니다.', choices, 3200);
          const k3 = numberedPlan('걱정돼요.', choices, 5200);

