<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <?!= include_('Stylesheet'); ?>
    <style>
      .family-scheduler-launcher {
        padding: 10px;
      }

      .family-scheduler-actions {
        display: grid;
        grid-template-columns:
          minmax(0, 1.05fr)
          minmax(0, 4fr);
        gap: 12px;
        width: 100%;
        min-width: 0;
        align-items: stretch;
      }

      .family-scheduler-next-wrap,
      .family-scheduler-family-group {
        min-width: 0;
      }

      .family-scheduler-family-group {
        display: grid;
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .family-scheduler-button {
        min-width: 0;
        min-height: 44px;
        border: 1px solid #c9c9c9;
        border-radius: 10px;
        background: #fff;
        padding: 9px 4px;
        color: #4b5563;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .02em;
        line-height: 1;
        opacity: 1;
        cursor: default;
      }

      .family-scheduler-button:disabled {
        opacity: 1;
        color: #4b5563;
        -webkit-text-fill-color: currentColor;
      }

      .family-scheduler-button.family-scheduler-next,
      .family-scheduler-button.family-scheduler-next:disabled {
        width: 100%;
        height: 100%;
        border: 2px solid #7b8798;
        background: #eef2f6;
        color: #334155;
        -webkit-text-fill-color: #334155;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.75);
        display: grid;
        place-items: center;
        align-content: center;
        gap: 3px;
      }

      .family-scheduler-next-caption {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .09em;
        line-height: 1;
        opacity: .72;
      }

      .family-scheduler-next-family {
        font-size: 18px;
        font-weight: 900;
        line-height: 1;
      }

      body.mobile-device .review-filter-button,
      body.mobile-device .review-sort-button {
        min-width: 0;
        padding-left: 5px;
        padding-right: 5px;
        font-size: 11px;
        letter-spacing: 0;
      }

      @media (max-width: 619px) {
        .family-scheduler-launcher {
          padding: 9px;
        }

        .family-scheduler-actions {
          grid-template-columns:
            minmax(0, 1fr)
            minmax(0, 4fr);
          gap: 10px;
        }

        .family-scheduler-family-group {
          gap: 5px;
        }

        .family-scheduler-button {
          min-height: 42px;
          padding-left: 2px;
          padding-right: 2px;
          font-size: 12px;
        }

        .family-scheduler-next-family {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1 class="sr-only">H3</h1>

      <nav id="mobile-progress" class="mobile-progress hidden" aria-label="問題進捗"></nav>

      <section id="loading" class="status compact-status">読み込み中…</section>
      <section id="error" class="panel error hidden" role="alert"></section>
      <section id="home" class="home hidden"></section>
      <section id="questions" class="questions hidden"></section>

      <section id="result" class="panel result hidden" aria-live="polite"></section>

    </main>

    <script>
      window.H3_BOOT = <?!= bootJson ?>;
    </script>
    <?!= include_('Client'); ?>
    <script>
      (function () {
        var home =
          document.getElementById(
            'home'
          );
        if (!home) {
          return;
        }

        function injectFamilySchedulerPreview() {
          if (
            home.querySelector(
              '.family-scheduler-launcher'
            )
          ) {
            return;
          }

          var review =
            home.querySelector(
              '.review-library'
            );
          if (!review) {
            return;
          }

          var launcher =
            document.createElement(
              'section'
            );
          launcher.className =
            'home-card family-scheduler-launcher';
          launcher.setAttribute(
            'aria-label',
            '学習メニュー'
          );

          var actions =
            document.createElement(
              'div'
            );
          actions.className =
            'family-scheduler-actions';

          var nextWrap =
            document.createElement(
              'div'
            );
          nextWrap.className =
            'family-scheduler-next-wrap';

          var nextButton =
            document.createElement(
              'button'
            );
          nextButton.type = 'button';
          nextButton.className =
            'family-scheduler-button family-scheduler-next';
          nextButton.disabled = true;
          nextButton.setAttribute(
            'aria-disabled',
            'true'
          );
          nextButton.setAttribute(
            'aria-label',
            '次の問題のfamilyを確認中'
          );

          var nextCaption =
            document.createElement(
              'span'
            );
          nextCaption.className =
            'family-scheduler-next-caption';
          nextCaption.textContent =
            'NEXT';

          var nextFamily =
            document.createElement(
              'span'
            );
          nextFamily.className =
            'family-scheduler-next-family';
          nextFamily.textContent =
            '—';
          nextFamily.setAttribute(
            'aria-live',
            'polite'
          );

          nextButton.appendChild(
            nextCaption
          );
          nextButton.appendChild(
            nextFamily
          );
          nextWrap.appendChild(
            nextButton
          );

          var familyGroup =
            document.createElement(
              'div'
            );
          familyGroup.className =
            'family-scheduler-family-group';

          [
            'L',
            'W',
            'R',
            'T'
          ].forEach(
            function (label) {
              var button =
                document.createElement(
                  'button'
                );
              button.type = 'button';
              button.className =
                'family-scheduler-button';
              button.textContent =
                label;
              button.disabled = true;
              button.setAttribute(
                'aria-disabled',
                'true'
              );
              button.dataset.family =
                label;
              familyGroup.appendChild(
                button
              );
            }
          );

          actions.appendChild(
            nextWrap
          );
          actions.appendChild(
            familyGroup
          );
          launcher.appendChild(
            actions
          );

          google.script.run
            .withSuccessHandler(
              function (preview) {
                if (
                  !home.contains(
                    nextButton
                  )
                ) {
                  return;
                }

                var family =
                  preview &&
                  preview.next_action ===
                    'RECOMMEND_FAMILY' &&
                  [
                    'L',
                    'W',
                    'R',
                    'T'
                  ].indexOf(
                    String(
                      preview.recommended_family ||
                      ''
                    )
                  ) >= 0
                    ? String(
                        preview.recommended_family
                      )
                    : '—';

                nextFamily.textContent =
                  family;
                nextButton.dataset.family =
                  family;
                nextButton.setAttribute(
                  'aria-label',
                  family === '—'
                    ? '次の問題のfamilyは未確定'
                    : '次の問題のfamily: ' +
                      family
                );
              }
            )
            .withFailureHandler(
              function () {
                if (
                  home.contains(
                    nextButton
                  )
                ) {
                  nextFamily.textContent =
                    '—';
                  nextButton.setAttribute(
                    'aria-label',
                    '次の問題のfamilyを取得できませんでした'
                  );
                }
              }
            )
            .h3FamilySchedulerShadowPreview();
          home.insertBefore(
            launcher,
            review
          );
        }

        injectFamilySchedulerPreview();

        new MutationObserver(
          injectFamilySchedulerPreview
        ).observe(
          home,
          {
            childList: true
          }
        );
      }());
    </script>
  </body>
</html>
