            status.event_type==='CLOCK' &&
            status.trigger_source==='CLOCK' &&
            status.configured_cadence_hours===1 &&
            status.metadata_present===true &&
            status.metadata_match===true &&
            requireScopeCalls===3,
            'H READY trigger readback mismatch'
          );

          ensured=h3MonitoringProductionTriggerEnsure();
          assert(
            ensured.status==='READY' &&
            ensured.created===false &&
            ensured.write_performed===false &&
            triggers.length===1 &&
            requireScopeCalls===4,
            'H repeated ensure created a duplicate'
          );

          triggers.push(
            makeTrigger(
              H3_MONITOR_PRODUCTION_TRIGGER_HANDLER_,
              'MANUAL-DUPLICATE'
            )
          );
          status=h3MonitoringProductionTriggerStatus();
          assert(
            status.status==='ERROR' &&
            status.duplicate_trigger===true &&
            status.matching_trigger_count===2,
