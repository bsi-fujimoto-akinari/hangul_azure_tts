            {section:'K3',skill_id:'H3-K3-SK001',set_no:2,surface_hash:'k3b',result:'×'},
            {section:'K4',skill_id:'H3-K4-SK001',set_no:2,surface_hash:'k4b',result:'○'},
            {section:'K5',skill_id:'H3-K5-SK001',set_no:2,surface_hash:'k5b',result:'△'}
          ];

          const plan = context.h3ProdBuildOverloadPlan_(
            history,
            3,
            {
              SUPPLEMENTAL_MAX:'1',
              ACTIVE_WRONG_CAP:'3',
              LISTENING_RETEST_PER_SET_CAP:'1',
              OVERLOAD_RETEST_PER_SET_CAP:'2'
            }
          );

          const expectedOrder = 'K4,K1,K3,K2,K5';
          if (plan.schema !== 'H3_LISTENING_OVERLOAD_PLAN_V3') {
            throw new Error('R3-10B planner schema mismatch');
          }
          if (plan.next_set_no !== 3) {
            throw new Error('R3-10B next_set_no mismatch');
          }
          if (plan.active_wrong_count !== 5) {
            throw new Error('R3-10B active count mismatch');
          }
          if (plan.normal_retest_per_set_cap !== 2) {
            throw new Error('R3-10B overload retest cap mismatch');
          }
          if (plan.ordered_due.join(',') !== expectedOrder) {
            throw new Error(
              'R3-10B EDF order mismatch: ' +
              plan.ordered_due.join(',')
            );
          }

          const scheduled = plan.normal_retests
            .map(x => x.set_no + ':' + x.section)
