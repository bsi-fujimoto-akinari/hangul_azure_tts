            PAYLOAD_KEY: logicalKey + '::' + reconstructionSha,
            SET_ID: record.set_id,
            SOURCE_QUEUE_ROW: '19',
            SOURCE_MODE: record.source_mode,
            MATERIALIZED_AT: materializedAt,
            STATUS: 'LOCKED',
            RECONSTRUCTION_SCHEMA: record.schema,
            RECONSTRUCTION_JSON: JSON.stringify(record),
            RECONSTRUCTION_SHA256: reconstructionSha,
            REVIEW_CONTRACT_ID: contractId,
            LOCKED_AT: materializedAt
          };

          const bindingModel = {
