<script>
(function () {
  'use strict';

  var sections = ['K1', 'K2', 'K3', 'K4', 'K5'];
  var questionKeys = ['K1', 'K2', 'K3', 'K4', 'K5'];
  var circled = ['①', '②', '③', '④'];
  var mobileQuery = window.matchMedia('(max-width: 619px)');

  var app = {
    payload: null,
    answers: {},
    uncertain: {},
    locked: false,
    submitting: false,
    activeIndex: 0,
    surfaceFamily: null,
    mediaCache: {},
    mediaTrimMs: {},
    mediaLoading: {},
    reviewKindFilter: 'ALL',
    reviewSort: 'REVIEW_LEVEL',
    reviewVisited: {},
    reviewCompletionPending: false,
    reviewCompletionRefreshPending: false
  };

  document.addEventListener('DOMContentLoaded', function () {
    applyDeviceProfile();

    if (mobileQuery.addEventListener) {
      mobileQuery.addEventListener('change', syncResponsiveState);
    } else if (mobileQuery.addListener) {
      mobileQuery.addListener(syncResponsiveState);
    }

    loadSet();
  });

  function applyDeviceProfile() {
    var ua = navigator.userAgent || '';
    var screenWidth = Math.min(
      Number(window.screen && window.screen.width || 9999),
      Number(window.screen && window.screen.height || 9999)
    );
    var touch = Number(navigator.maxTouchPoints || 0) > 0;
    var iphoneLike =
      /iPhone|iPod/i.test(ua) ||
      (touch && screenWidth <= 500);

    if (!iphoneLike) return;

    document.body.classList.add('mobile-device');

    var layoutWidth = Number(window.innerWidth || 0);
    if (layoutWidth > 0 && screenWidth > 0 && layoutWidth > screenWidth * 1.35) {
      var zoom = Math.min(layoutWidth / screenWidth, 3);
      document.documentElement.style.setProperty('--h3-mobile-target-width', screenWidth + 'px');
      document.documentElement.style.setProperty('--h3-mobile-zoom', String(zoom));
      document.body.classList.add('mobile-viewport-emulated');
    }
  }

  function isMobileMode() {
    return document.body.classList.contains('mobile-device') || mobileQuery.matches;
  }

  function resetForPayload() {
    pauseOtherAudio(null);

    app.answers = {};
    app.uncertain = {};
    app.locked = false;
    app.submitting = false;
    app.activeIndex = 0;
    app.surfaceFamily = null;
    questionKeys = [];
    app.mediaCache = {};
    app.mediaTrimMs = {};
    app.mediaLoading = {};
    app.mediaRetryCount = {};
    app.reviewKindFilter = 'ALL';
    app.reviewSort = 'REVIEW_LEVEL';
    app.reviewVisited = {};
    app.reviewCompletionPending = false;

    document.body.classList.remove(
      'graded'
    );

    ['home', 'questions', 'result']
      .forEach(function (id) {
        var node =
          document.getElementById(id);
        node.textContent = '';
        node.classList.add('hidden');
      });

    document
      .getElementById(
        'mobile-progress'
      )
      .classList.add('hidden');

    var error =
      document.getElementById(
        'error'
      );
    error.textContent = '';
    error.classList.add('hidden');
  }

  function resolveLearningSurfaceFamily_(payload) {
    var declared =
      String(
        payload &&
        payload.surface_family ||
        ''
      );

    if (declared) {
      return declared;
    }

    var mode =
      String(
        payload &&
        payload.mode ||
        ''
      );

    if (mode === 'LISTENING') {
      return '5L';
    }
    if (mode === 'WRITTEN') {
      return '5W';
    }
    if (mode === 'SYSTEM_TEST') {
      return 'SYSTEM_TEST';
    }

    return '';
  }

  function questionKeyFor_(
    question,
    index
  ) {
    var explicit =
      String(
        question &&
        (
          question.question_key ||
          question.item_id
        ) ||
        ''
      ).trim();

    if (explicit) {
      return explicit;
    }

    var section =
      String(
        question &&
        question.section ||
        ''
      ).trim();

    if (section) {
      return section;
    }

    return 'Q' + String(index + 1);
  }

  function validateReadingPayload_(
    payload
  ) {
    if (
      !Array.isArray(payload.passages) ||
      payload.passages.length !== 1
    ) {
      throw new Error(
        'READING_PASSAGE_PAYLOAD_INVALID'
      );
    }

    var passage =
      payload.passages[0];
    var passageId =
      String(
        passage &&
        passage.passage_id ||
        ''
      );
    var passageSha =
      String(
        passage &&
        passage.passage_sha256 ||
        ''
      );

    if (
      !passageId ||
      !passageSha ||
      !String(
        passage.text_ko || ''
      ).trim()
    ) {
      throw new Error(
        'READING_PASSAGE_IDENTITY_INVALID'
      );
    }

    var seen = {};
    payload.questions.forEach(
      function (question, index) {
        var key =
          questionKeyFor_(
            question,
            index
          );

        if (
          !question.item_id ||
          !question.question_key ||
          seen[key]
        ) {
          throw new Error(
            'READING_QUESTION_IDENTITY_INVALID'
          );
        }
        seen[key] = true;

        if (
          String(
            question.passage_id || ''
          ) !== passageId ||
          String(
            question.passage_sha256 || ''
          ) !== passageSha
        ) {
          throw new Error(
            'READING_PASSAGE_BINDING_INVALID'
          );
        }
      }
    );
  }

  function validateTranslationPayload_(
    payload
  ) {
    var direction =
      String(
        payload.translation_direction ||
        ''
      );
    var profile =
      String(
        payload.translation_profile ||
        ''
      );
    var answerType =
      String(
        payload.answer_type || ''
      );
    var sourceLanguage =
      String(
        payload.source_language || ''
      );
    var choiceLanguage =
      String(
        payload.choice_language || ''
      );
    var isV2 = !!profile;

    if (
      answerType !== 'MULTIPLE_CHOICE' ||
      (
        isV2 &&
        [
          'MIXED_1_1',
          'EDF_KR_TO_JP_2',
          'EDF_JP_TO_KR_2'
        ].indexOf(profile) < 0
      ) ||
      (
        !isV2 &&
        ['KR_TO_JP', 'JP_TO_KR']
          .indexOf(direction) < 0
      )
    ) {
      throw new Error(
        'TRANSLATION_PAYLOAD_METADATA_INVALID'
      );
    }

    if (
      !isV2 &&
      (
        (
          direction === 'KR_TO_JP' &&
          (
            sourceLanguage !== 'KO' ||
            choiceLanguage !== 'JA'
          )
        ) ||
        (
          direction === 'JP_TO_KR' &&
          (
            sourceLanguage !== 'JA' ||
            choiceLanguage !== 'KO'
          )
        )
      )
    ) {
      throw new Error(
        'TRANSLATION_PAYLOAD_LANGUAGE_INVALID'
      );
    }

    var seen = {};
    var krToJp = 0;
    var jpToKr = 0;

    payload.questions.forEach(
      function (question, index) {
        var key =
          questionKeyFor_(
            question,
            index
          );
        var choiceIds =
          question &&
          question.choice_ids;
        var choices =
          question &&
          question.visible_choices;
        var itemDirection =
          String(
            question &&
            question.translation_direction ||
            ''
          );
        var itemSourceLanguage =
          String(
            question &&
            question.source_language ||
            ''
          );
        var itemChoiceLanguage =
          String(
            question &&
            question.choice_language ||
            ''
          );
        var itemSection =
          String(
            question &&
            (
              question.section_key ||
              question.section
            ) ||
            ''
          );

        if (
          !question ||
          !question.item_id ||
          !question.question_key ||
          seen[key] ||
          ['KR_TO_JP', 'JP_TO_KR']
            .indexOf(itemDirection) < 0 ||
          (
            !isV2 &&
            itemDirection !== direction
          ) ||
          String(
            question.answer_type || ''
          ) !== answerType ||
          !String(
            question.target_segment ||
            ''
          ).trim() ||
          String(
            question.question_text ||
            ''
          ).indexOf(
            String(
              question.target_segment ||
              ''
            )
          ) < 0 ||
          !Array.isArray(choiceIds) ||
          choiceIds.length !== 4 ||
          choiceIds.some(
            function (value, choiceIndex) {
              return (
                Number(value) !==
                choiceIndex + 1
              );
            }
          ) ||
          !Array.isArray(choices) ||
          choices.length !== 4
        ) {
          throw new Error(
            'TRANSLATION_QUESTION_IDENTITY_INVALID'
          );
        }

        if (
          isV2 &&
          (
            (
              itemDirection === 'KR_TO_JP' &&
              (
                itemSourceLanguage !== 'KO' ||
                itemChoiceLanguage !== 'JA' ||
                itemSection !== 'H3-P11'
              )
            ) ||
            (
              itemDirection === 'JP_TO_KR' &&
              (
                itemSourceLanguage !== 'JA' ||
                itemChoiceLanguage !== 'KO' ||
                itemSection !== 'H3-P12'
              )
            )
          )
        ) {
          throw new Error(
            'TRANSLATION_V2_ITEM_METADATA_INVALID'
          );
        }

        if (isV2) {
          if (itemDirection === 'KR_TO_JP') {
            krToJp += 1;
          } else {
            jpToKr += 1;
          }
        }

        seen[key] = true;
      }
    );

    if (
      isV2 &&
      (
        (
          profile === 'MIXED_1_1' &&
          !(
            krToJp === 1 &&
            jpToKr === 1
          )
        ) ||
        (
          profile === 'EDF_KR_TO_JP_2' &&
          !(
            krToJp === 2 &&
            jpToKr === 0
          )
        ) ||
        (
          profile === 'EDF_JP_TO_KR_2' &&
          !(
            krToJp === 0 &&
            jpToKr === 2
          )
        )
      )
    ) {
      throw new Error(
        'TRANSLATION_V2_PROFILE_CARDINALITY_INVALID'
      );
    }
  }

  function validateLearningPayloadShape_(payload) {
    var questions =
      payload && payload.questions;
    if (!Array.isArray(questions)) {
      throw new Error(
        'QUESTION_PAYLOAD_SHAPE_INVALID'
      );
    }

    var family =
      resolveLearningSurfaceFamily_(
        payload
      );
    var rawCount =
      payload.item_count;
    var itemCount =
      rawCount === undefined ||
      rawCount === null ||
      rawCount === ''
        ? questions.length
        : Number(rawCount);

    if (
      !Number.isInteger(itemCount) ||
      itemCount < 1 ||
      itemCount !== questions.length
    ) {
      throw new Error(
        'QUESTION_PAYLOAD_COUNT_INVALID'
      );
    }

    var providerKind =
      String(
        payload.provider_kind || ''
      );
    var level =
      String(payload.level || '');

    if (
      level &&
      ['3級', '準2級'].indexOf(
        level
      ) < 0
    ) {
      throw new Error(
        'QUESTION_PAYLOAD_LEVEL_INVALID'
      );
    }

    var expectedSections = null;
    if (family === '5L') {
      if (
        providerKind &&
        providerKind !== 'LISTENING'
      ) {
        throw new Error(
          'QUESTION_PAYLOAD_PROVIDER_INVALID'
        );
      }
      expectedSections = [
        'K1', 'K2', 'K3', 'K4', 'K5'
      ];
    } else if (family === '5W') {
      if (
        providerKind &&
        providerKind !== 'WRITTEN'
      ) {
        throw new Error(
          'QUESTION_PAYLOAD_PROVIDER_INVALID'
        );
      }
      expectedSections = [
        'D2', 'D3', 'D4', 'D5', 'D6'
      ];
    } else if (
      family === 'READING' ||
      family === 'TRANSLATION'
    ) {
      if (providerKind !== 'WRITTEN') {
        throw new Error(
          'QUESTION_PAYLOAD_PROVIDER_INVALID'
        );
      }

      if (family === 'READING') {
        validateReadingPayload_(
          payload
        );
      } else {
        validateTranslationPayload_(
          payload
        );
      }

      return family;
    } else if (
      family === 'SYSTEM_TEST'
    ) {
      if (itemCount !== 5) {
        throw new Error(
          'QUESTION_PAYLOAD_SYSTEM_TEST_COUNT_INVALID'
        );
      }
      return family;
    } else {
      throw new Error(
        'QUESTION_PAYLOAD_FAMILY_INVALID'
      );
    }

    if (itemCount !== 5) {
      throw new Error(
        'QUESTION_PAYLOAD_FIXED_COUNT_INVALID'
      );
    }

    questions.forEach(
      function (question, index) {
        if (
          !question ||
          String(
            question.section || ''
          ) !== expectedSections[index]
        ) {
          throw new Error(
            'QUESTION_PAYLOAD_SECTION_ORDER_INVALID'
          );
        }
      }
    );

    return family;
  }

  function surfaceLearnerLabel_(family) {
    var normalized =
      String(family || '');

    if (normalized === 'READING') {
      return '2R / Reading';
    }
    if (normalized === 'TRANSLATION') {
      return '2T / Translation';
    }
    return '';
  }


  function questionDisplayLabel_(
    display,
    family,
    section
  ) {
    var normalized =
      String(display || '')
        .trim()
        .replace(/／/g, '/');

    if (
      String(family || '') ===
        'TRANSLATION'
    ) {
      var sectionKey =
        String(section || '')
          .replace(/^H3-/, '');

      if (sectionKey === 'P11') {
        return '筆11/翻訳';
      }
      if (sectionKey === 'P12') {
        return '筆12/翻訳';
      }
    }

    if (normalized) {
      return normalized;
    }

    return surfaceLearnerLabel_(
      family
    );
  }


  function appendSafeUnderlineMarkup_(
    node,
    text
  ) {
    var source =
      String(text || '');
    var pattern =
      /<u>([\s\S]*?)<\/u>/gi;
    var cursor = 0;
    var match;

    while (
      (match = pattern.exec(source))
    ) {
      node.appendChild(
        document.createTextNode(
          source.slice(
            cursor,
            match.index
          )
        )
      );

      var underline =
        document.createElement('u');
      underline.textContent =
        match[1] || '';
      node.appendChild(
        underline
      );

      cursor =
        match.index +
        match[0].length;
    }

    node.appendChild(
      document.createTextNode(
        source.slice(cursor)
      )
    );
  }


  function readingPassageDisplayText_(text) {
    var source =
      String(text || '');
    var hasExplicitFootnoteBody =
      /[＊*]\s*[）)]/.test(source);

    if (hasExplicitFootnoteBody) {
      return source
        .replace(/＊\s*[）)]\s*/g, '* ')
        .replace(/\*\s*[）)]\s*/g, '* ')
        .replace(
          '* 매장：売り',
          '* 매장：売場'
        );
    }

    return source
      .replace(/＊/g, '')
      .replace(/([가-힣])\*/g, '$1');
  }


  function readingPassageTranslationDisplayText_(
    text
  ) {
    return String(text || '')
      .replace(
        /\(×[^)\n]*\)/g,
        '(　　　　　　　　　　)'
      );
  }


  function renderReadingSurface_(
    payload
  ) {
    renderQuestions(
      payload.questions
    );

    var root =
      document.getElementById(
        'questions'
      );
    var passage =
      payload.passages[0];
    var block =
      el(
        'section',
        'reading-passage-card reading-passage'
      );
    block.dataset.passageId =
      passage.passage_id;

    var title =
      el(
        'h2',
        'question-title'
      );
    title.textContent =
      '本文';
    block.appendChild(title);

    var textBlock =
      el(
        'div',
        'question-prompt reading-passage-text'
      );
    textBlock.textContent =
      readingPassageDisplayText_(
        passage.text_ko
      );
    block.appendChild(textBlock);

    root.insertBefore(
      block,
      root.firstChild
    );
  }

  function renderTranslationSurface_(
    payload
  ) {
    renderQuestions(
      payload.questions
    );

    var root =
      document.getElementById(
        'questions'
      );
    payload.questions.forEach(
      function (question, index) {
        var card =
          root.querySelector(
            '.question-card[data-index="' +
            String(index) +
            '"]'
          );
        var prompt =
          card &&
          card.querySelector(
            '.question-prompt'
          );
        var fullText =
          String(
            question.question_text ||
            ''
          );
        var target =
          String(
            question.target_segment ||
            ''
          );
        var targetIndex =
          fullText.indexOf(target);

        if (
          !prompt ||
          !target ||
          targetIndex < 0
        ) {
          throw new Error(
            'TRANSLATION_TARGET_SEGMENT_MISMATCH'
          );
        }

        prompt.textContent = '';
        prompt.appendChild(
          document.createTextNode(
            fullText.slice(
              0,
              targetIndex
            )
          )
        );

        var underline =
          document.createElement('u');
        underline.textContent =
          target;
        prompt.appendChild(
          underline
        );

        prompt.appendChild(
          document.createTextNode(
            fullText.slice(
              targetIndex +
              target.length
            )
          )
        );
      }
    );

  }

  function renderLearningSurface_(
    payload,
    family
  ) {
    if (
      ['5L', '5W', 'SYSTEM_TEST']
        .indexOf(family) >= 0
    ) {
      renderQuestions(
        payload.questions
      );
      return;
    }

    if (family === 'READING') {
      renderReadingSurface_(
        payload
      );
      return;
    }

    if (family === 'TRANSLATION') {
      renderTranslationSurface_(
        payload
      );
      return;
    }

    throw new Error(
      'SURFACE_FAMILY_RENDERER_NOT_ACTIVE:' +
        family
    );
  }

  function loadSet(request) {
    setLoading(true);
    resetForPayload();

    var webRequest =
      request ||
      window.H3_BOOT;

    google.script.run
      .withSuccessHandler(function (payload) {
        setLoading(false);
        app.payload = payload;

        if (payload.mode === 'HOME') {
          app.locked = true;
          renderHome(payload);
          return;
        }

        if (payload.mode === 'REVIEW') {
          app.locked = true;
          renderPersistentReview(
            payload
          );
          return;
        }

        var surfaceFamily =
          validateLearningPayloadShape_(
            payload
          );
        app.surfaceFamily =
          surfaceFamily;

        sections =
          payload.questions.map(
            function (question) {
              return String(
                question.section || ''
              );
            }
          );
        questionKeys =
          payload.questions.map(
            function (question, index) {
              return questionKeyFor_(
                question,
                index
              );
            }
          );

        renderLearningSurface_(
          payload,
          surfaceFamily
        );
        buildMobileProgress(
          payload.questions.length
        );

        document
          .getElementById(
            'questions'
          )
          .classList.remove('hidden');
        document
          .getElementById(
            'mobile-progress'
          )
          .classList.remove('hidden');

        app.activeIndex = 0;
        updateMobilePager();
        updateLiveSummary();
        scheduleInitialAudioPrefetch();
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        showError(
          errorText(err)
        );
      })
      .getListeningWebSet(
        webRequest
      );
  }

  function loadHome() {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'HOME',
      set_id: null,
      txn_id: null
    });
  }

  function loadReviewTxn(txnId) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'REVIEW',
      set_id: null,
      txn_id:
        String(txnId),
      legacy_review_id: null
    });
  }

  function loadLegacyReview(
    legacyReviewId
  ) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'REVIEW',
      set_id: null,
      txn_id: null,
      legacy_review_id:
        String(legacyReviewId)
    });
  }

  function loadWrittenReview(
    setId,
    surfaceFamily
  ) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'REVIEW',
      review_kind:
        'WRITTEN',
      surface_family:
        String(
          surfaceFamily || '5W'
        ),
      set_id:
        String(setId),
      txn_id: null,
      legacy_review_id: null
    });
  }

  function loadReplayTxn(txnId) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode:
        'REVIEW_REPLAY',
      set_id: null,
      txn_id:
        String(txnId),
      legacy_review_id: null
    });
  }

  function loadLegacyReplay(
    legacyReviewId
  ) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode:
        'REVIEW_REPLAY',
      set_id: null,
      txn_id: null,
      legacy_review_id:
        String(legacyReviewId)
    });
  }

  function loadLearningSet(
    setId,
    mode
  ) {
    var targetMode =
      String(
        mode || 'LISTENING'
      );

    if (
      [
        'LISTENING',
        'WRITTEN'
      ].indexOf(targetMode) < 0
    ) {
      showError(
        '学習モードを確認できません。'
      );
      return;
    }

    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode:
        targetMode,
      set_id:
        String(setId),
      txn_id: null
    });
  }

  function openReviewHistoryEntry_(
    entry
  ) {
    if (
      entry.review_kind ===
        'WRITTEN'
    ) {
      loadWrittenReview(
        entry.set_id,
        entry.surface_family
      );
      return;
    }

    if (entry.legacy_review_id) {
      loadLegacyReview(
        entry.legacy_review_id
      );
      return;
    }

    loadReviewTxn(
      entry.txn_id
    );
  }


  function applyReviewHistoryView_(
    history
  ) {
    var nodes =
      Array.prototype.slice.call(
        history.querySelectorAll(
          '.review-history-item'
        )
      );

    nodes.sort(function (a, b) {
      if (
        app.reviewSort ===
          'REVIEW_LEVEL'
      ) {
        var levelDiff =
          Number(
            b.dataset.reviewLevel || 0
          ) -
          Number(
            a.dataset.reviewLevel || 0
          );
        if (levelDiff) {
          return levelDiff;
        }
      }

      var at =
        String(
          a.dataset.answeredAt || ''
        );
      var bt =
        String(
          b.dataset.answeredAt || ''
        );

      if (at !== bt) {
        return at < bt ? 1 : -1;
      }

      return (
        Number(
          a.dataset.originalIndex || 0
        ) -
        Number(
          b.dataset.originalIndex || 0
        )
      );
    });

    var shown = 0;
    nodes.forEach(function (node) {
      var kind =
        String(
          node.dataset.reviewKind ||
          'LISTENING'
        );
      var visible =
        app.reviewKindFilter ===
          'ALL' ||
        kind ===
          app.reviewKindFilter;

      node.classList.toggle(
        'hidden',
        !visible
      );
      if (visible) {
        shown += 1;
      }
      history.appendChild(node);
    });

    var empty =
      history.querySelector(
        '.review-filter-empty'
      );
    if (empty) {
      empty.classList.toggle(
        'hidden',
        shown !== 0

  function formatHistoryDate(value) {

      String(value || '');
    if (!text) return '';

    return text
      .replace('T', ' ')
      .replace(
        /:\d{2}\+09:00$/,
        ''
      )
      .replace(/-/g, '/');
  }

  function audioKeyForIndex_(

      !app.payload ||
      !Array.isArray(
        app.payload.questions
      ) ||
      !app.payload.questions[
        index
      ]
    ) {
      return null;
    }

    return (
      app.payload.questions[
        index
      ].audio_asset_key ||
      null
    );
  }

      var choices = el('div', 'choices' + (q.visible_choices ? '' : ' textless'));

      q.choice_ids.forEach(function (choiceId, choiceIndex) {

        button.type = 'button';
        button.dataset.answer = String(choiceId);
        button.textContent =
          circled[choiceIndex] +
          (q.visible_choices ? ' ' + q.visible_choices[choiceIndex] : '');

        button.addEventListener('click', function () {
          if (app.locked) return;

          app.answers[questionKey] =
            choiceId;
          Array.prototype.forEach.call(
            choices.querySelectorAll('.choice'),
            function (node) {
              node.classList.toggle('selected', node === button);
            }
          );

          updateLiveSummary();

          if (!app.payload) return;

          if (allAnswered()) {
            window.setTimeout(function () {
              submitAnswers();
            }, 80);
            return;
          }

          if (
            index <
              app.payload.questions.length -
                1
          ) {
            var nextIndex =
              index + 1;
            setActiveIndex(nextIndex, true);
            playAudioAssetNow(
              audioKeyForIndex_(
                nextIndex
              ),
              true
            );
            return;
          }

          var firstMissing =
            questionKeys.findIndex(
              function (key) {
                return (
                  typeof app.answers[
                    key
                  ] !== 'number'

              }
            );

          if (firstMissing >= 0) {
            setActiveIndex(
              firstMissing,
              true
            );
            playAudioAssetNow(
              audioKeyForIndex_(
                firstMissing
              ),
              true
            );
          }
        });

        choices.appendChild(button);
      });

      card.appendChild(choices);
      root.appendChild(card);
    });

  function buildAudioBlock(assetKey, fallbackUrl, label, compact) {
    var wrap =
      el(
        'div',
        'audio-wrap inline-seek-audio-wrap' +
          (
            compact
              ? ' compact-audio-wrap'
              : ''
          )
      );

    if (label) {
      var title =
        el(
          'p',
          'audio-label'
        );
      title.textContent =
        label;
      wrap.appendChild(title);
    }

    var controls =
      el(
        'div',
        'custom-audio-controls audio-seek-controls'
      );

    var toggle =
      el(
        'button',
        'audio-toggle'
      );
    toggle.type = 'button';
    toggle.dataset.assetKey =
      assetKey;
    toggle.disabled = true;
    toggle.textContent = '…';
    toggle.setAttribute(
      'aria-label',
      '音声を再生'
    );
    controls.appendChild(
      toggle
    );

    var seek =
      document.createElement(
        'input'
      );
    seek.type = 'range';
    seek.className =
      'audio-seek';
    seek.dataset.assetKey =
      assetKey;
    seek.min = '0';
    seek.max = '1000';
    seek.step = '1';
    seek.value = '0';
    seek.disabled = true;
    seek.setAttribute(
      'aria-label',
      '音声の再生位置'
    );
    controls.appendChild(
      seek
    );

    wrap.appendChild(
      controls
    );

    var audio =
      document.createElement(
        'audio'
      );
    audio.className =
      'audio-engine';
    audio.preload = 'none';
    audio.dataset.assetKey =
      assetKey;
    audio.setAttribute(
      'playsinline',
      ''
    );

    toggle.addEventListener(
      'click',
      function () {
        if (
          !audio.getAttribute(
            'src'
          )
        ) {
          return;
        }

        if (audio.paused) {
          prepareAudioStart(audio);
          pauseOtherAudio(audio);
          var promise =
            audio.play();

          if (
            promise &&
            typeof promise.catch ===
              'function'
          ) {
            promise.catch(
              function () {
                setAudioStatus(
                  assetKey,
                  '再生を開始できませんでした。Driveリンクを使用してください。',
                  true
                );
              }
            );
          }
        } else {
          audio.pause();
        }
      }
    );

    seek.addEventListener(
      'input',
      function () {
        seekAudioFromControl_(
          audio,
          seek
        );
      }
    );

    audio.addEventListener(
      'play',
      function () {
        toggle.textContent = 'Ⅱ';
        toggle.setAttribute(
          'aria-label',
          '音声を停止'
        );
        pauseOtherAudio(audio);
      }
    );
    audio.addEventListener(
      'pause',
      function () {
        if (!audio.ended) {
          toggle.textContent =
            '▶';
          toggle.setAttribute(
            'aria-label',
            '音声を再生'
          );
        }
      }
    );
    audio.addEventListener(
      'ended',
      function () {
        toggle.textContent =
          '▶';
        toggle.setAttribute(
          'aria-label',
          '音声を再生'
        );
        updateAudioSeek_(
          audio,
          seek
        );
      }
    );
    audio.addEventListener(
      'loadedmetadata',
      function () {
        prepareAudioStart(
          audio
        );
        seek.disabled =
          !isFinite(
            audio.duration
          );
        updateAudioSeek_(
          audio,
          seek
        );
      }
    );
    audio.addEventListener(
      'durationchange',
      function () {
        seek.disabled =
          !isFinite(
            audio.duration
          );
        updateAudioSeek_(
          audio,
          seek
        );
      }
    );
    audio.addEventListener(
      'timeupdate',
      function () {
        updateAudioSeek_(
          audio,
          seek
        );
      }
    );

    wrap.appendChild(
      audio
    );

    var status =
      el(
        'p',
        'audio-status'
      );
    status.dataset.assetKey =
      assetKey;
    status.textContent = '';
    status.classList.add(
      'hidden'
    );
    wrap.appendChild(
      status
    );

    var fallback =
      document.createElement(
        'a'
      );
    fallback.className =
      'media-fallback' +
      (
        compact
          ? ' hidden'
          : ''
      );
    fallback.dataset.assetKey =
      assetKey;
    fallback.href =
      fallbackUrl;
    fallback.target =
      '_blank';
    fallback.rel =
      'noopener';
    fallback.textContent =
      '再生できない場合はDriveで開く';
    wrap.appendChild(
      fallback
    );

    return wrap;
  }


  function updateAudioSeek_(
    audio,
    seek
  ) {
    if (!seek) return;

    var skip =
      getAudioSkipSeconds(
        audio
      );
    var duration =
      isFinite(audio.duration)
        ? Math.max(
            0,
            audio.duration - skip
          )
        : 0;
    var current =
      isFinite(audio.currentTime)
        ? Math.max(
            0,
            audio.currentTime - skip
          )
        : 0;

    if (duration <= 0) {
      seek.value = '0';
      return;
    }

    seek.value =
      String(
        Math.max(
          0,
          Math.min(
            1000,
            Math.round(
              (
                current /
                duration
              ) *
              1000
            )
          )
        )
      );
  }


  function seekAudioFromControl_(
    audio,
    seek
  ) {
    if (
      !audio ||
      !seek ||
      !isFinite(
        audio.duration
      )
    ) {
      return;
    }

    var skip =
      getAudioSkipSeconds(
        audio
      );
    var duration =
      Math.max(
        0,
        audio.duration - skip
      );

    if (duration <= 0) {
      return;
    }

    var ratio =
      Math.max(
        0,
        Math.min(
          1,
          Number(
            seek.value || 0
          ) / 1000
        )
      );

    try {
      audio.currentTime =
        skip +
        (
          duration *
          ratio
        );
    } catch (e) {
      // Ignore transient seek failures while metadata becomes seekable.
    }
  }

  function getAudioSkipSeconds(audio) {
    return Math.max(0, Number(audio.dataset.skipMs || 0) / 1000);
  }

  function prepareAudioStart(audio) {
    var skip = getAudioSkipSeconds(audio);
    if (!isFinite(audio.duration)) return;
    if (audio.ended || audio.currentTime < skip - 0.05) {
      try {
        audio.currentTime = Math.min(skip, Math.max(0, audio.duration - 0.05));
      } catch (e) {
        // Metadata may not be fully seekable yet; timeupdate will correct display.
      }
    }
  }



  function scheduleInitialAudioPrefetch() {
    if (
      !app.payload ||
      !Array.isArray(
        app.payload.questions
      )
    ) {
      return;
    }

    var keys =
      app.payload.questions
        .map(function (question) {
          return (
            question.audio_asset_key ||
            null
          );
        })
        .filter(Boolean);

    if (!keys.length) {
      return;
    }

    if (isMobileMode()) {
      ensureAudioLoaded(
        keys[0],
        { background: false }
      );
      if (keys[1]) {
        window.setTimeout(function () {
          ensureAudioLoaded(
            keys[1],
            { background: true }
          );
        }, 500);
      }
      return;
    }

    keys.forEach(function (assetKey, index) {
      window.setTimeout(function () {
        ensureAudioLoaded(
          assetKey,
          { background: index !== 0 }
        );
      }, index * 350);
    });
  }

  function ensureAudioLoaded(
    assetKey,
    options
  ) {
    if (!assetKey) return;

    var opts = options || {};
    var background =
      opts.background === true;

    if (app.mediaCache[assetKey]) {
      attachAudioData(
        assetKey,
        app.mediaCache[assetKey],
        app.mediaTrimMs[assetKey] || 0
      );
      return;
    }

    if (app.mediaLoading[assetKey]) return;
    app.mediaLoading[assetKey] = true;

    if (!background) {
      setAudioStatus(
        assetKey,
        '音声を準備中…',
        false
      );
    }

    google.script.run
      .withSuccessHandler(function (media) {
        app.mediaLoading[assetKey] = false;
        app.mediaRetryCount[assetKey] = 0;
        app.mediaCache[assetKey] = media.data_uri;
        app.mediaTrimMs[assetKey] =
          Number(
            media.trim_start_ms || 0
          );
        attachAudioData(
          assetKey,
          media.data_uri,
          app.mediaTrimMs[assetKey]
        );
        setAudioStatus(
          assetKey,
          '',
          false
        );
      })
      .withFailureHandler(function () {
        app.mediaLoading[assetKey] = false;

        var retries =
          Number(
            app.mediaRetryCount[
              assetKey
            ] || 0
          );

        if (retries < 1) {
          app.mediaRetryCount[
            assetKey
          ] = retries + 1;

          if (!background) {
            setAudioStatus(
              assetKey,
              '音声を再準備中…',
              false
            );
          }

          window.setTimeout(
            function () {
              ensureAudioLoaded(
                assetKey,
                {
                  background:
                    background
                }
              );
            },
            700
          );
          return;
        }

        setAudioStatus(
          assetKey,
          '音声を準備できませんでした。もう一度この問題を開くか、Driveリンクを使用してください。',
          true
        );
      })
      .getListeningWebMedia({
        schema:
          'H3_WEB_MEDIA_REQUEST_V1',
        mode: app.payload.mode,
        set_id: app.payload.set_id,
        txn_id:
          app.payload.txn_id || null,
        legacy_review_id:
          app.payload
            .legacy_review_id || null,
        asset_key: assetKey
      });
  }

  function attachAudioData(assetKey, dataUri, trimStartMs) {
    var nodes = document.querySelectorAll(
      'audio[data-asset-key="' + assetKey + '"]'
    );

    Array.prototype.forEach.call(nodes, function (audio) {
      audio.dataset.skipMs = String(Math.max(0, Number(trimStartMs || 0)));
      if (!audio.getAttribute('src')) {
        audio.src = dataUri;
        audio.load();
      }
    });

    var toggles = document.querySelectorAll(
      '.audio-toggle[data-asset-key="' + assetKey + '"]'
    );
    Array.prototype.forEach.call(
      toggles,
      function (button) {
        button.disabled = false;
        button.textContent = '▶';
        button.setAttribute(
          'aria-label',
          '音声を再生'
        );
      }
    );
  }

  function setAudioStatus(assetKey, message, isError) {
    var nodes = document.querySelectorAll(
      '.audio-status[data-asset-key="' + assetKey + '"]'
    );

    Array.prototype.forEach.call(nodes, function (node) {
      node.textContent = message;
      node.classList.toggle('media-error', !!isError);
      node.classList.toggle('hidden', !message);
    });

    var fallbacks = document.querySelectorAll(
      '.media-fallback[data-asset-key="' + assetKey + '"]'
    );
    Array.prototype.forEach.call(fallbacks, function (node) {
      if (node.closest('.compact-audio-wrap')) {
        node.classList.toggle('hidden', !isError);
      }
    });
  }

  function resetAudioAsset(
    assetKey
  ) {
    var audio =
      document.querySelector(
        'audio[data-asset-key="' +
        assetKey +
        '"]'
      );

    if (!audio) return;

    var skip =
      getAudioSkipSeconds(audio);

    try {
      audio.currentTime = skip;
    } catch (e) {
      // A freshly attached source will already start at zero.
    }
  }

  function playAudioAssetNow(
    assetKey,
    restart
  ) {
    if (!assetKey) return false;

    var audio = document.querySelector(
      'audio[data-asset-key="' + assetKey + '"]'
    );

    if (!audio || !audio.getAttribute('src')) {
      return false;
    }

    if (restart === true) {
      resetAudioAsset(
        assetKey
      );
    } else {
      prepareAudioStart(audio);
    }

    pauseOtherAudio(audio);

    var promise = audio.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(function () {
        // iOS may still reject playback if the media was not fully ready
        // within the same user gesture. In that case the visible play
        // button remains the fallback.
      });
    }

    return true;
  }

  function pauseOtherAudio(current) {
    Array.prototype.forEach.call(
      document.querySelectorAll('audio'),
      function (audio) {
        if (audio !== current && !audio.paused) {
          audio.pause();
        }
      }
    );
  }

  function buildMobileProgress(count) {
    var root = document.getElementById('mobile-progress');
    root.textContent = '';

    for (var i = 0; i < count; i += 1) {
      (function (index) {
        var button = el('button', 'progress-button');
        button.type = 'button';
        button.textContent = 'Q' + (index + 1);
        button.dataset.index = String(index);
        if (index === 0) button.classList.add('current');
        button.addEventListener('click', function () {
          setActiveIndex(index);
        });
        root.appendChild(button);
      })(i);
    }
  }

  function setActiveIndex(
    index,
    restartAudio
  ) {
    if (!app.payload || app.locked) return;

    var max =
      app.payload.questions.length - 1;

    pauseOtherAudio(null);

    app.activeIndex =
      Math.max(
        0,
        Math.min(max, index)
      );
    updateMobilePager();

    var activeAudioKey =
      audioKeyForIndex_(
        app.activeIndex
      );

    ensureAudioLoaded(
      activeAudioKey,
      { background: false }
    );

    if (
      restartAudio === true &&
      activeAudioKey
    ) {
      resetAudioAsset(
        activeAudioKey
      );
    }

    if (app.activeIndex < max) {
      window.setTimeout(function () {
        ensureAudioLoaded(
          audioKeyForIndex_(
            app.activeIndex + 1
          ),
          { background: true }
        );
      }, 350);
    }

    if (isMobileMode()) {
      var progress = document.getElementById('mobile-progress');
      if (progress && progress.scrollIntoView) {
        progress.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    }
  }

  function syncResponsiveState() {
    if (!app.payload) return;
    updateMobilePager();
  }

  function updateMobilePager() {
    var cards = document.querySelectorAll('.question-card');

    Array.prototype.forEach.call(cards, function (card, index) {
      card.classList.toggle('mobile-active', index === app.activeIndex);
    });

    var buttons = document.querySelectorAll('.progress-button');

    Array.prototype.forEach.call(buttons, function (button, index) {
      var questionKey =
        questionKeys[index];
      button.classList.toggle('current', index === app.activeIndex);
      button.classList.toggle(
        'answered',
        typeof app.answers[questionKey] === 'number' &&
          !app.uncertain[questionKey]
      );
      button.classList.toggle(
        'uncertain-mark',
        typeof app.answers[questionKey] === 'number' &&
          !!app.uncertain[questionKey]
      );
      button.setAttribute(
        'aria-current',
        index === app.activeIndex ? 'step' : 'false'
      );
    });

  }

  function updateLiveSummary() {
    updateMobilePager();
  }

  function allAnswered() {
    return questionKeys.every(
      function (questionKey) {
        return (
          typeof app.answers[
            questionKey
          ] === 'number'
        );
      }
    );
  }

  function isQuestionKeyWrittenSurface_() {
    return (
      app.surfaceFamily ===
        'READING' ||
      app.surfaceFamily ===
        'TRANSLATION'
    );
  }


  function submitAnswers() {
    if (!allAnswered() || app.locked || app.submitting) return;

    if (
      [
        'LISTENING',
        'SYSTEM_TEST',
        'WRITTEN'
      ].indexOf(
        app.payload && app.payload.mode
      ) < 0
    ) {
      showError(
        'この画面からは回答を送信できません。'
      );
      return;
    }

    app.submitting = true;
    setInteractiveDisabled(true);
    updateLiveSummary();

    var keyedWrittenSurface =
      isQuestionKeyWrittenSurface_();

    var request = {
      schema: 'H3_WEB_SUBMIT_V1',
      mode: app.payload.mode,
      set_id: app.payload.set_id,
      txn_id:
        app.payload.txn_id || null,
      legacy_review_id:
        app.payload
          .legacy_review_id || null,
      answers: sections.map(function (section, index) {
        if (keyedWrittenSurface) {
          var questionKey =
            questionKeys[index];

          return {
            question_key:
              questionKey,
            answer:
              app.answers[
                questionKey
              ],
            uncertain:
              !!app.uncertain[
                questionKey
              ]
          };
        }

        return {
          section: section,
          answer: app.answers[section],
          uncertain: !!app.uncertain[section]
        };
      })
    };

    if (keyedWrittenSurface) {
      request.provider_kind =
        'WRITTEN';
      request.surface_family =
        app.surfaceFamily;
    }

    google.script.run
      .withSuccessHandler(function (result) {
        app.submitting = false;
        app.locked = true;

        document.body.classList.add('graded');
        setInteractiveDisabled(true);
        pauseOtherAudio(null);

        document.getElementById('questions').classList.add('hidden');
        document.getElementById('mobile-progress').classList.add('hidden');

        renderResult(result);
        updateLiveSummary();

        if (isMobileMode()) {
          document.getElementById('result').scrollIntoView({
            block: 'start',
            behavior: 'smooth'
          });
        }
      })
      .withFailureHandler(function (err) {
        app.submitting = false;
        app.locked = false;
        setInteractiveDisabled(false);
        showError(
          '採点に失敗しました。回答は保持されています。\n' +
          errorText(err)
        );
        updateLiveSummary();
      })
      .submitListeningWebAnswers(request);
  }

  function setInteractiveDisabled(disabled) {
    Array.prototype.forEach.call(
      document.querySelectorAll('.choice, .uncertain'),
      function (node) {
        node.disabled = disabled;
      }
    );

  }

  function renderResult(result) {
    if (
      result.mode ===
        'REVIEW_REPLAY' &&
      result.after_replay &&
      (
        result.after_replay.schema ===
          'H3_PERSISTENT_REVIEW_PAYLOAD_V1' ||
        result.after_replay.schema ===
          'H3_LEGACY_PERSISTENT_REVIEW_PAYLOAD_V1'
      )
    ) {
      renderPersistentReview(
        result.after_replay
      );
      return;
    }

    if (
      result.mode === 'LISTENING' &&
      result.after_sync &&
      result.after_sync.schema ===
        'H3_PERSISTENT_REVIEW_PAYLOAD_V1'
    ) {
      renderPersistentReview(
        result.after_sync
      );
      return;
    }

    if (
      result.mode === 'WRITTEN' &&
      result.after_sync &&
      [
        'H3_PERSISTENT_WRITTEN_REVIEW_PAYLOAD_V1',
        'H3_PERSISTENT_READING_REVIEW_PAYLOAD_V1',
        'H3_PERSISTENT_TRANSLATION_REVIEW_PAYLOAD_V1'
      ].indexOf(
        result.after_sync.schema
      ) >= 0
    ) {
      renderPersistentReview(
        result.after_sync
      );
      return;
    }

    var root =
      document.getElementById(
        'result'
      );
    root.textContent = '';
    root.classList.remove(
      'hidden'
    );

    var score =
      el('p', 'score');
    score.textContent =
      result.score +
      ' / ' +
      result.total;
    root.appendChild(score);

    var table =
      document.createElement(
        'table'
      );
    var thead =
      document.createElement(
        'thead'
      );
    var hr =
      document.createElement('tr');

    [
      '問題',
      '回答',
      '正答',
      '正誤'
    ].forEach(function (label) {
      var th =
        document.createElement('th');
      th.textContent = label;
      hr.appendChild(th);
    });

    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody =
      document.createElement(
        'tbody'
      );

    result.summary.forEach(
      function (row, index) {
        var tr =
          document.createElement('tr');

        var displayedAnswer =
          String(
            row.answer
          ) +
          (
            result.mode ===
              'WRITTEN' &&
            row.uncertain
              ? '?'
              : ''
          );

        [
          'Q' + (index + 1),
          displayedAnswer,
          String(
            row.correct_answer
          ),
          (
            row.result ||
            row.mark ||
            ''
          )
        ].forEach(
          function (value) {
            var td =
              document.createElement(
                'td'
              );
            td.textContent = value;
            tr.appendChild(td);
          }
        );

        tbody.appendChild(tr);
      }
    );

    table.appendChild(tbody);
    root.appendChild(table);

    if (
      result.mode ===
      'SYSTEM_TEST'
    ) {
      var note =
        el('p', 'poc-note');
      note.textContent =
        'SYSTEM_TESTのreceiptは専用test journalへ永続化済みです。学習runtime/historyにはWRITEしていません。';
      root.appendChild(note);
    }

    var pre =
      document.createElement('pre');
    pre.id = 'receipt';
    pre.textContent =
      result.receipt;
    root.appendChild(pre);

    var copy =
      el(
        'button',
        'copy-button'
      );
    copy.type = 'button';
    copy.textContent =
      '回答結果をコピー';
    copy.addEventListener(
      'click',
      function () {
        copyReceipt(
          result.receipt,
          copy
        );
      }
    );
    root.appendChild(copy);
  }

  function appendReadingReviewPassage_(
    root,
    review
  ) {
    if (
      !review ||
      review.surface_family !==
        'READING'
    ) {
      return;
    }

    var passage =
      review.passage || {};

    if (
      !passage.passage_id ||
      !passage.passage_sha256 ||
      !passage.text_ko ||
      !passage.text_ja
    ) {
      throw new Error(
        'READING_REVIEW_PASSAGE_INVALID'
      );
    }

    var block =
      el(
        'section',
        'reading-passage-card reading-passage review-reading-passage'
      );
    block.dataset.passageId =
      passage.passage_id;

    var title =
      el(
        'h2',
        'question-title'
      );
    title.textContent =
      '本文';
    block.appendChild(title);

    var ko =
      el(
        'div',
        'question-prompt reading-passage-text'
      );
    ko.textContent =
      readingPassageDisplayText_(
        passage.text_ko
      );
    block.appendChild(ko);

    var ja =
      el(
        'div',
        'review-translation review-translation-reading'
      );
    var jaText =
      document.createElement('p');
    jaText.textContent =
      readingPassageTranslationDisplayText_(
        passage.text_ja
      );
    ja.appendChild(jaText);
    block.appendChild(ja);

    root.appendChild(block);
  }


  function normalizeTranslationReview_(
    review
  ) {
    if (
      !review ||
      review.surface_family !==
        'TRANSLATION'
    ) {
      return review;
    }

    if (
      review.schema !==
        'H3_PERSISTENT_TRANSLATION_REVIEW_PAYLOAD_V1' ||
      !Array.isArray(
        review.questions
      ) ||
      Number(
        review.item_count
      ) !== review.questions.length
    ) {
      throw new Error(
        'TRANSLATION_REVIEW_PAYLOAD_INVALID'
      );
    }

    var normalized = {};
    Object.keys(review).forEach(
      function (key) {
        normalized[key] =
          review[key];
      }
    );

    normalized.sections =
      review.questions.map(
        function (question) {
          var section =
            String(
              question.section || ''
            );
          var sectionNo =
            section.replace(
              /^P/,
              ''
            );
          var choices =
            Array.isArray(
              question.choices
            )
              ? question.choices
              : [];

          return {
            section: section,
            display:
              '筆' +
              sectionNo +
              '／翻訳',
            result:
              question.mark,
            user_answer_position:
              Number(
                question.user_answer
              ),
            correct_answer_position:
              Number(
                question.correct_answer
              ),
            uncertain_known:
              true,
            uncertain:
              !!question
                .explicit_uncertainty,
            question_text:
              String(
                question.question_text ||
                ''
              ),
            target_segment:
              String(
                question.target_segment ||
                ''
              ),
            choices:
              choices.slice(),
            script_text:
              String(
                question.question_text ||
                ''
              ),
            explanation:
              question.explanation ||
              null,
            audio_asset_key: null,
            audio_fallback_url: null
          };
        }
      );

    return normalized;
  }


  function reviewAllViewed_(
    review
  ) {
    return (
      review &&
      Array.isArray(
        review.sections
      ) &&
      review.sections.length > 0 &&
      review.sections.every(
        function (_part, index) {
          return !!app.reviewVisited[
            String(index)
          ];
        }
      )
    );
  }


  function reviewCompletionProviderKind_(
    review
  ) {
    return String(
      review &&
      (
        review.provider_kind ||
        review.kind
      ) ||
      ''
    );
  }


  function newReviewCompletionEventKey_() {
    if (
      !window.crypto ||
      !window.crypto.getRandomValues
    ) {
      return '';
    }

    var bytes =
      new Uint8Array(16);
    window.crypto.getRandomValues(
      bytes
    );

    return (
      'H3RC-' +
      Array.prototype.map
        .call(
          bytes,
          function (value) {
            return (
              '0' +
              Number(value)
                .toString(16)
            ).slice(-2);
          }
        )
        .join('')
    );
  }


  function reviewCompletionEventKey_(
    review
  ) {
    if (
      !review ||
      typeof review !== 'object'
    ) {
      return '';
    }

    var property =
      '__h3ReviewCompletionEventKey';
    var existing =
      String(
        review[property] || ''
      );

    if (existing) {
      return existing;
    }

    var generated =
      newReviewCompletionEventKey_();

    if (!generated) {
      return '';
    }

    Object.defineProperty(
      review,
      property,
      {
        value: generated,
        enumerable: false,
        writable: false,
        configurable: false
      }
    );

    return generated;
  }


  function reviewCompletionRequest_(
    review
  ) {
    var kind =
      reviewCompletionProviderKind_(
        review
      );
    var sourceId =
      kind === 'WRITTEN'
        ? String(
            review.set_id || ''
          )
        : String(
            review.legacy_review_id ||
            review.txn_id ||
            ''
          );

    return {
      schema:
        'H3_REVIEW_COMPLETE_REQUEST_V2',
      review_kind: kind,
      surface_family:
        String(
          review.surface_family || ''
        ),
      set_id:
        String(
          review.set_id || ''
        ),
      review_source_id:
        sourceId,
      viewed_count:
        review.sections.length,
      completion_event_key:
        reviewCompletionEventKey_(
          review
        )
    };
  }


  function reviewCompletionRecorded_(
    request
  ) {
    app.reviewCompletionRefreshPending =
      true;

    if (
      app.payload &&
      app.payload.mode === 'HOME'
    ) {
      app.reviewCompletionRefreshPending =
        false;
      loadHome();
    }
  }


  function attemptReviewCompletion_(
    request,
    attempt
  ) {
    app.reviewCompletionPending = true;

    google.script.run
      .withSuccessHandler(
        function (result) {
          var recorded =
            result &&
            result.schema ===
              'H3_REVIEW_COMPLETE_RESULT_V2' &&
            (
              result.status ===
                'RECORDED' ||
              result.status ===
                'ALREADY_RECORDED'
            ) &&
            String(
              result.set_id || ''
            ) ===
              String(
                request.set_id || ''
              ) &&
            String(
              result.completion_event_key ||
              ''
            ) ===
              String(
                request.completion_event_key ||
                ''
              );

          if (recorded) {
            app.reviewCompletionPending =
              false;
            reviewCompletionRecorded_(
              request
            );
            return;
          }

          var retryable =
            result &&
            result.schema ===
              'H3_REVIEW_COMPLETE_RESULT_V2' &&
            result.status === 'ERROR' &&
            result.error_class ===
              'TRANSIENT' &&
            result.retryable === true;

          if (
            retryable &&
            Number(attempt || 0) < 1
          ) {
            attemptReviewCompletion_(
              request,
              Number(attempt || 0) + 1
            );
            return;
          }

          app.reviewCompletionPending =
            false;
          if (window.console) {
            console.warn(
              'Review completion metadata was not recorded.',
              result
            );
          }
        }
      )
      .withFailureHandler(
        function (err) {
          if (
            Number(attempt || 0) < 1
          ) {
            attemptReviewCompletion_(
              request,
              Number(attempt || 0) + 1
            );
            return;
          }

          app.reviewCompletionPending =
            false;
          if (window.console) {
            console.warn(
              'Review completion transport failed.',
              err
            );
          }
        }
      )
      .completeReviewSession(
        request
      );
  }


  function completeReviewAndLoadHome_(
    review
  ) {
    if (
      !reviewAllViewed_(review)
    ) {
      loadHome();
      return;
    }

    var request =
      reviewCompletionRequest_(
        review
      );

    if (
      request.completion_event_key
    ) {
      attemptReviewCompletion_(
        request,
        0
      );
    }

    loadHome();
  }


  function renderPersistentReview(
    review
  ) {
    review =
      normalizeTranslationReview_(
        review
      );

    resetForPayload();
    app.payload = review;
    app.locked = true;
    app.activeIndex = 0;

    document.body.classList.add(

    );

      document.getElementById(
        'result'
      );

    root.classList.remove(

    root.appendChild(pager);

    var cards =

      );

    review.sections.forEach(
      function (part, index) {
        var card =
          buildPersistentReviewCard(

          );
        card.dataset.reviewIndex =
