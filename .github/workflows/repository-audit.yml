                provider_kind: 'LISTENING',
                surface_family: '5L',
                set_id: 'H3-L',
                txn_id: 'TX-L',
                sections: [{}, {}, {}, {}, {}]
              },
              kind: 'LISTENING',
              source: 'TX-L'
            },
            {
              label: '5W',
