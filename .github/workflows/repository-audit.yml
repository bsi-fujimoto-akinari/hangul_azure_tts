              '### B. 5L preparation and preissue readback',
              '### C. H3_WEB_SYNC receipt verification readback',
              '## 24. K1_READY_ONE_SHOT_V1',
              'SCRIPT_TXT is explicitly outside the learner issue critical path',
          ]:
