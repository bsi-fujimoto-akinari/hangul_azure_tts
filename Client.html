        cards.appendChild(card);
      }
    );

    root.appendChild(cards);

    var technical =
      document.createElement(
        'details'
      );
    technical.className =
      'review-technical';

    var technicalSummary =
      document.createElement(
        'summary'
      );
    technicalSummary.textContent =
      '技術情報';
    technical.appendChild(
      technicalSummary
    );

    var ids =
      document.createElement('p');
    ids.textContent =
      'SET_ID=' +
      review.set_id +
      (
        review.kind ===
          'WRITTEN'
          ? '\nREVIEW_KIND=WRITTEN'
          : (
              review.legacy_review_id
                ? (
                    '\nLEGACY_REVIEW_ID=' +
                    review.legacy_review_id
                  )
                : (
                    '\nTXN_ID=' +
                    review.txn_id
                  )
            )
      );
    ids.className =
      'review-technical-ids';
    technical.appendChild(ids);

    var copyIds =
      el(
        'button',
        'copy-button'
      );
    copyIds.type = 'button';
    copyIds.textContent =
      '技術情報をコピー';
    copyIds.addEventListener(
      'click',
      function () {
        copyReceipt(
          ids.textContent,
          copyIds
        );
      }
    );
    technical.appendChild(
      copyIds
    );

    if (
      review.technical &&
      review.technical.receipt
    ) {
      var pre =
        document.createElement(
          'pre'
        );
      pre.textContent =
        review.technical.receipt;
      technical.appendChild(pre);

      var copy =
        el(
          'button',
          'copy-button'
        );
      copy.type = 'button';
      copy.textContent =
        'receiptをコピー';
      copy.addEventListener(
        'click',
        function () {
          copyReceipt(
            review.technical
              .receipt,
            copy
          );
        }
      );
      technical.appendChild(copy);
    }

    root.appendChild(
      technical
    );

    var actions =
      el(
        'div',
        'review-footer-actions'
      );

    var back =
      el(
        'button',
        'secondary review-back-button'
      );
    back.type = 'button';
    back.textContent =
      'ホーム';
    back.addEventListener(
      'click',
      function () {
        completeReviewAndLoadHome_(
          review
        );
      }
    );
    actions.appendChild(back);

    root.appendChild(actions);

    setReviewPage(
      0,
      review
    );
  }

  function setReviewPage(
    index,
    review
  ) {
    var max =
      review.sections.length - 1;
    app.activeIndex =
      Math.max(
        0,
        Math.min(
          max,
          Number(index) || 0
        )
      );

    app.reviewVisited[
      String(app.activeIndex)
    ] = true;

    Array.prototype
      .forEach.call(
        document.querySelectorAll(
          '.persistent-review-card'
        ),
        function (card) {
          card.classList.toggle(
            'review-active',
            Number(
              card.dataset.reviewIndex
            ) === app.activeIndex
          );
        }
      );

    Array.prototype
      .forEach.call(
        document.querySelectorAll(
          '.review-progress-button'
        ),
        function (button) {
          var active =
            Number(
              button.dataset.index
            ) === app.activeIndex;

          button.classList.toggle(
            'current',
            active
          );

          button.setAttribute(
            'aria-current',
            active
              ? 'step'
              : 'false'
          );
        }
      );

    var section =
      review.sections[
        app.activeIndex
      ];

    if (
      section &&
      section.audio_asset_key
    ) {
      ensureAudioLoaded(
        section.audio_asset_key
      );
    }

    if (isMobileMode()) {
      var pager =
        document.querySelector(
          '.review-progress'
        );

      if (
        pager &&
        pager.scrollIntoView
      ) {
        pager.scrollIntoView({
          block: 'start',
          behavior: 'smooth'
        });
      }
    }
  }

  function writtenReviewDisplayLabel_(
    part
  ) {
    var section =
      String(
        part && part.section || ''
      );
    var labels = {
      D2: '筆2/語彙',
      D3: '筆3/文法',
      D4: '筆4/置換',
      D5: '筆5/共通',
      D6: '筆6/応答'
    };

    if (labels[section]) {
      return labels[section];
    }

    return String(
      part && part.display || section
    ).replace(/／/g, '/');
  }


  function reviewCardTitleText_(
    part,
    index
  ) {
    var payload =
      app.payload || {};
    var family =
      String(
        payload.surface_family || ''
      );

    if (
      payload.kind === 'WRITTEN' &&
      (
        !family ||
        family === '5W'
      )
    ) {
      return (
        'Q' +
        (index + 1) +
        ' ［' +
        writtenReviewDisplayLabel_(
          part
        ) +
        '］ ' +
        part.result
      );
    }

    return (
      'Q' +
      (index + 1) +
      ' ' +
      questionDisplayLabel_(
        part.display,
        family,
        part.section
      ) +
      '　' +
      part.result
    );
  }


  function appendBracketUnderlines_(
    node,
    text
  ) {
    var source =
      String(text || '');
    var pattern =
      /\[([^\]\n]+)\]|［([^］\n]+)］/g;
    var cursor = 0;
    var match;

    while (
      (match = pattern.exec(source))
    ) {
      node.appendChild(
        document.createTextNode(
          source.slice(
            cursor,
            match.index
          )
        )
      );

      var underline =
        document.createElement('u');
      underline.textContent =
        match[1] || match[2] || '';
      node.appendChild(
        underline
      );

      cursor =
        match.index +
        match[0].length;
    }

    node.appendChild(
      document.createTextNode(
        source.slice(cursor)
      )
    );
  }


  function appendChoicesToReviewScript_(
    node,
    choices
  ) {
    (
      Array.isArray(choices)
        ? choices
        : []
    ).forEach(
      function (choice, index) {
        var symbol =
          choice &&
          typeof choice === 'object'
            ? String(
                choice.symbol ||
                circled[index] ||
                ''
              )
            : String(
                circled[index] || ''
              );
        var text =
          choice &&
          typeof choice === 'object'
            ? String(
                choice.text || ''
              )
            : String(choice || '');

        node.appendChild(
          document.createTextNode(
            '\n' +
            symbol +
            ' ' +
            text
          )
        );
      }
    );
  }


  function appendTranslationReviewScript_(
    node,
    part
  ) {
    var fullText =
      String(
        part.question_text || ''
      );
    var target =
      String(
        part.target_segment || ''
      );
    var targetIndex =
      fullText.indexOf(target);

    if (
      !fullText ||
      !target ||
      targetIndex < 0
    ) {
      throw new Error(
        'TRANSLATION_REVIEW_TARGET_SEGMENT_MISMATCH'
      );
    }

    node.appendChild(
      document.createTextNode(
        fullText.slice(
          0,
          targetIndex
        )
      )
    );

    var underline =
      document.createElement('u');
    underline.textContent =
      target;
    node.appendChild(underline);

    node.appendChild(
      document.createTextNode(
        fullText.slice(
          targetIndex +
          target.length
        )
      )
    );

    appendChoicesToReviewScript_(
      node,
      part.choices
    );
  }


  function appendWritten5WReviewScript_(
    node,
    part
  ) {
    var surface =
      part.question_surface || {};
    var body =
      String(surface.body || '');
    var choices =
      Array.isArray(surface.choices)
        ? surface.choices
        : [];

    if (!body) {
      var fallback =
        String(
          surface.rendered ||
          part.script_text ||
          ''
        );
      body = fallback.replace(
        /^Q\d+\s+\[[^\n]+\]\r?\n/,
        ''
      );
      if (choices.length) {
        var firstChoice =
          body.search(
            /\n[①②③④]\s/
          );
        if (firstChoice >= 0) {
          body =
            body.slice(
              0,
              firstChoice
            );
        }
      }
    }

    if (part.section === 'D4') {
      appendBracketUnderlines_(
        node,
        body
      );
    } else {
      node.appendChild(
        document.createTextNode(
          body
        )
      );
    }

    appendChoicesToReviewScript_(
      node,
      choices
    );
  }


  function appendReviewScript_(
    node,
    part
  ) {
    var payload =
      app.payload || {};
    var family =
      String(
        payload.surface_family || ''
      );

    if (
      payload.kind === 'WRITTEN' &&
      family === 'TRANSLATION'
    ) {
      appendTranslationReviewScript_(
        node,
        part
      );
      return;
    }

    if (
      payload.kind === 'WRITTEN' &&
      (
        !family ||
        family === '5W'
      )
    ) {
      appendWritten5WReviewScript_(
        node,
        part
      );
      return;
    }

    appendSafeUnderlineMarkup_(
      node,
      part.script_text
    );
  }


  function isWritten5WReview_() {
    var payload =
      app.payload || {};
    var family =
      String(
        payload.surface_family || ''
      );

    return (
      payload.kind === 'WRITTEN' &&
      (
        !family ||
        family === '5W'
      )
    );
  }

  function buildReviewExplanationContainer_(
    part
  ) {
    var isWritten =
      app.payload &&
      app.payload.kind === 'WRITTEN';
    var container =
      document.createElement('section');

    container.className =
      'review-explanation' +
      (
        isWritten
          ? ' review-explanation-written'
          : ''
      );

    var heading =
      document.createElement('h4');
    heading.className =
      'review-block-title ' +
      'review-explanation-title';
    heading.textContent =
      '解説';
    container.appendChild(
      heading
    );

    return container;
  }

  function reviewReasonDisplayText_(
    part,
    text
  ) {
    var value =
      String(text || '');
    var payload =
      app.payload || {};

    if (
      payload.set_id ===
        'H3-20260919-L02' &&
      part &&
      part.section === 'K5' &&
      part.explanation_sha256 ===
        'd5fbcf3e695219d43ec0068d504067f00a0b1ca4c767cac3b54ace4230f52fc5'
    ) {
      return value.replace(
        '어린이를 위한 책 읽기 행사라고明示されている',
        '어린이를 위한 책 읽기 행사と明示されている'
      );
    }

    return value;
  }


  function buildPersistentReviewCard(
    part,
    index
  ) {
    var card =
      el(
        'section',
        'persistent-review-card'
      );
    card.dataset.result =
      part.result;

    var head =
      el(
        'div',
        'review-section-head'
      );
    var title =
      document.createElement('h3');
    title.textContent =
      reviewCardTitleText_(
        part,
        index
      );
    head.appendChild(title);
    card.appendChild(head);

    if (part.audio_asset_key) {
      card.appendChild(
        buildAudioBlock(
          part.audio_asset_key,
          part.audio_fallback_url,
          '',
          true
        )
      );
    }

    var answerRow =
      el(
        'div',
        'review-answer-row'
      );

    var user =
      document.createElement('p');
    var userAnswerText =
      part.user_answer_position
        ? circled[
            part.user_answer_position - 1
          ]
        : (
            typeof part.user_answer ===
              'number'
              ? circled[
                  part.user_answer - 1
                ]
              : String(
                  part.user_answer || ''
                )
          );
    user.textContent =
      'あなた　' +
      userAnswerText +
      (
        part.uncertain_known ===
          false
          ? ' ?—'
          : (
              part.uncertain
                ? ' ?'
                : ''
            )
      );
    answerRow.appendChild(user);

    var correct =
      document.createElement('p');
    var correctAnswerText =
      part.correct_answer_position
        ? circled[
            part.correct_answer_position - 1
          ]
        : (
            typeof part.correct_answer ===
              'number'
              ? circled[
                  part.correct_answer - 1
                ]
              : String(
                  part.correct_answer || ''
                )
          );
    correct.textContent =
      '正答　　' +
      correctAnswerText;
    answerRow.appendChild(
      correct
    );
    card.appendChild(
      answerRow
    );

    if (
      part.section === 'K1' &&
      part.question_surface &&
      part.question_surface
        .image_data_uri
    ) {
      var image =
        document.createElement('img');
      image.className =
        'k1-image review-k1-image';
      image.src =
        part.question_surface
          .image_data_uri;
      image.alt =
        'K1 問題画像';
      card.appendChild(image);
    }

    var reviewFamily =
      String(
        app.payload &&
        app.payload.surface_family || ''
      );

    if (
      reviewFamily !==
        'TRANSLATION'
    ) {
      var scriptTitle =
        document.createElement('h4');
      scriptTitle.className =
        'review-block-title';
      scriptTitle.textContent =
        reviewFamily === 'READING'
          ? '設問'
          : (
              app.payload &&
              app.payload.kind ===
                'WRITTEN'
                ? '問題'
                : '問題・スクリプト'
            );
      card.appendChild(
        scriptTitle
      );
    }

    var script =
      document.createElement('pre');
    script.className =
      'review-section-script';
    appendReviewScript_(
      script,
      part
    );
    card.appendChild(script);

    appendReviewTranslations(
      card,
      part.explanation,
      part
    );

    var explanationContainer =
      buildReviewExplanationContainer_(
        part
      );

    var body =
      el(
        'div',
        'review-explanation-body'
      );

    if (
      part.explanation &&
      part.explanation.reason
    ) {
      var reason =
        document.createElement('p');
      reason.className =
        'review-reason';
      reason.textContent =
        reviewReasonDisplayText_(
          part,
          part.explanation.reason
        );
      body.appendChild(reason);
    } else if (
      part.explanation &&
      part.explanation.text &&
      part.explanation.text !==
        'UNKNOWN'
    ) {
      var writtenExplanation =
        document.createElement('p');
      writtenExplanation.className =
        'review-reason';
      writtenExplanation.textContent =
        part.explanation.text;
      body.appendChild(
        writtenExplanation
      );

      if (
        part.explanation
          .key_expression &&
        part.explanation
          .key_expression !==
          'UNKNOWN'
      ) {
        var keyExpression =
          document.createElement('p');
        keyExpression.className =
          'review-key-expression';
        keyExpression.textContent =
          part.explanation
            .key_expression;
        body.appendChild(
          keyExpression
        );
      }
    }

    (
      part.explanation &&
      part.explanation
        .learning_blocks ||
      []
    ).forEach(function (block) {
      body.appendChild(
        buildLearningBlock(
          block
        )
      );
    });

    explanationContainer
      .appendChild(body);
    card.appendChild(
      explanationContainer
    );

    return card;
  }

  function appendReviewTranslations(
    card,
    explanation,
    part
  ) {
    if (!explanation) return;

    var hasBody =
      !!explanation.body_ja;
    var choices =
      Array.isArray(
        explanation.choices
      )
        ? explanation.choices
        : [];
    var hasChoiceJa =
      choices.some(
        function (choice) {
          return !!choice.ja;
        }
      );

    if (
      !hasBody &&
      !hasChoiceJa
    ) {
      return;
    }

    var translation =
      el(
        'div',
        'review-translation' +
          (
            isWritten5WReview_()
              ? ' review-translation-written'
              : ''
          )
      );

    if (hasBody) {
      var body =
        document.createElement('p');

      if (
        isWritten5WReview_() &&
        part &&
        part.section === 'D4'
      ) {
        appendBracketUnderlines_(
          body,
          explanation.body_ja
        );
      } else {
        body.appendChild(
          document.createTextNode(
            explanation.body_ja
          )
        );
      }

      translation.appendChild(body);
    }

    choices.forEach(
      function (choice, index) {
        if (!choice.ja) return;

        var row =
          document.createElement(
            'p'
          );
        var ko =
          choice.ko
            ? choice.ko + '　'
            : '';
        row.textContent =
          circled[index] +
          ' ' +
          ko +
          choice.ja;
        translation.appendChild(row);
      }
    );

    card.appendChild(
      translation
    );
  }

  function buildLearningBlock(
    block
  ) {
    var wrap =
      el(
        'div',
        'review-learning-block'
      );

    if (block.form) {
      var form =
        document.createElement('h5');
      form.textContent =
        block.form;
      wrap.appendChild(form);
    }

    if (block.usage) {
      var usage =
        document.createElement('p');
      usage.textContent =
        block.usage;
      wrap.appendChild(usage);
    }

    if (
      block.type ===
        'pronunciation' &&
      block.surface &&
      block.actual
    ) {
      var pronunciation =
        document.createElement('p');
      pronunciation.textContent =
        block.surface +
        ' → [' +
        block.actual +
        ']';
      wrap.appendChild(
        pronunciation
      );
    }

    if (
      Array.isArray(
        block.items
      )
    ) {
      block.items.forEach(
        function (item) {
          var line =
            document.createElement(
              'p'
            );
          var ko =
            item.ko || '';
          var hanja =
            item.hanja
              ? '（' +
                item.hanja +
                '）'
              : '';
          var ja =
            item.ja
              ? '　' + item.ja
              : '';
          line.textContent =
            ko + hanja + ja;
          wrap.appendChild(line);
        }
      );
    }

    if (block.note) {
      var note =
        document.createElement('p');
      note.textContent =
        block.note;
      wrap.appendChild(note);
    }

    if (block.example_ko) {
      var example =
        document.createElement('p');
      example.textContent =
        block.example_ko +
        (
          block.example_ja
            ? '　' +
              block.example_ja
            : ''
        );
      wrap.appendChild(example);
    }

    return wrap;
  }

  function copyReceipt(text, button) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () {
          button.textContent = 'コピー済み';
        })
        .catch(function () {
          legacyCopy(text, button);
        });
      return;
    }

    legacyCopy(text, button);
  }

  function legacyCopy(text, button) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';

    document.body.appendChild(area);
    area.select();

    try {
      document.execCommand('copy');
      button.textContent = 'コピー済み';
    } catch (e) {
      button.textContent = '上のreceiptを選択してください';
    }

    document.body.removeChild(area);
  }


  function reviewSurfaceIcon_(
    surfaceFamily
  ) {
    var ns =
      'http://www.w3.org/2000/svg';
    var family =
      String(surfaceFamily || '');
    var paths = {
      '5L': [
        'M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3'
      ],
      '5W': [
        'M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z',
        'M14.487 7.858A1 1 0 0 1 14 7V2',
        'M20 19.645V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l2.516 2.516',
        'M8 18h1'
      ],
      'READING': [
        'M12 5v16',
        'M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z'
      ],
      'TRANSLATION': [
        'm5 8 6 6',
        'm4 14 6-6 2-3',
        'M2 5h12',
        'M7 2h1',
        'm22 22-5-10-5 10',
        'M14 18h6'
      ]
    };

    if (!paths[family]) {
      return null;
    }

    // Lucide icon geometry (ISC):
    // https://lucide.dev/
    var svg =
      document.createElementNS(
        ns,
        'svg'
      );
    svg.setAttribute(
      'class',
      'review-history-icon'
    );
    svg.setAttribute(
      'viewBox',
      '0 0 24 24'
    );
    svg.setAttribute(
      'fill',
      'none'
    );
    svg.setAttribute(
      'stroke',
      'currentColor'
    );
    svg.setAttribute(
      'stroke-width',
      '2'
    );
    svg.setAttribute(
      'stroke-linecap',
      'round'
    );
    svg.setAttribute(
      'stroke-linejoin',
      'round'
    );
    svg.setAttribute(
      'aria-hidden',
      'true'
    );
    svg.setAttribute(
      'focusable',
      'false'
    );

    paths[family].forEach(
      function (pathData) {
        var path =
          document.createElementNS(
            ns,
            'path'
          );
        path.setAttribute(
          'd',
          pathData
        );
        svg.appendChild(path);
      }
    );

    return svg;
  }

  function el(tag, className) {
    var node = document.createElement(tag);
    node.className = className;
    return node;
  }

  function setLoading(on) {
    document.getElementById('loading').classList.toggle('hidden', !on);
  }

  function showError(message) {
    var node = document.getElementById('error');
    node.textContent = message;
    node.classList.remove('hidden');
  }

  function errorText(err) {
    if (!err) return 'UNKNOWN_ERROR';
    if (typeof err === 'string') return err;
    return err.message || String(err);
  }
})();
</script>
