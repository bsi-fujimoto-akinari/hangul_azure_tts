          import re
          from pathlib import Path

          code = Path('Code.js').read_text(encoding='utf-8')
          preissue = Path('WebAppPreissue.js').read_text(encoding='utf-8')
          contract = Path('H3_WEB_CHAT_CONTRACT.md').read_text(encoding='utf-8')
          ops = Path('OPERATIONS.md').read_text(encoding='utf-8')

          def body(text, name, next_name=None):
              start_marker = f'function {name}('
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Could not isolate {name}: start marker missing.')
              if next_name:
                  end_marker = f'function {next_name}('
                  end = text.find(end_marker, start + len(start_marker))
                  if end < 0:
                      raise SystemExit(f'Could not isolate {name}: next marker missing.')
                  return text[start:end]
              return text[start:]

          process_set = body(
              code,
              'processListeningAudioSet_',
              'listeningPlanTextByRole_',
          )
          for forbidden in [
              'persistListeningSetScript_(',
