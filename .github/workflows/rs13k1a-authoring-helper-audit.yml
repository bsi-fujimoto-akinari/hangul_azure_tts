name: RS13K1A K1 Authority Authoring Helper Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    name: rs13k1a-authoring-helper-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RS-13K1A authoring helper
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');

          const evidence=fs.readFileSync('WebAppMultiSkillEvidence.js','utf8');
          const source=fs.readFileSync('WebAppK1SecondaryAuthority.js','utf8');

          const context={console,JSON,Number,String,Object,Array,Math,Date};
          context.globalThis=context;
          context.SpreadsheetApp={flush(){}};
          vm.createContext(context);
          vm.runInContext(evidence,context);
          vm.runInContext(source,context);

          assert.strictEqual(
            context.H3_RS13K1A_AUTHORING_CONTRACT_ID_,
            'H3-RS13K1A-AUTHORING-HELPER-20260922-V1'
          );

          const rh=context.H3_RS13K1_READY_HEADERS_;
          const ah=context.H3_RS13K1_AUTHORITY_HEADERS_;
          const ch=context.H3_MULTI_SKILL_CONCEPT_HEADERS_;

          function row(headers,obj){
            return headers.map(k =>
              Object.prototype.hasOwnProperty.call(obj,k) ? obj[k] : ''
            );
          }

          function readyRow(overrides){
            return row(rh,Object.assign({
              K1_READY_ID:'H3-K1R-20260922-999',
              CREATED_AT:'2026-09-22T12:00:00+09:00',
              STATUS:'READY',
              IMAGE_FILE_ID:'IMG',
              IMAGE_URL:'https://example.invalid/IMG',
              IMAGE_SHA256:'abc123',
              FINAL_CHOICES_JSON:'["a","b","c","d"]',
              ANSWER_KEY:'2',
              TTS_SCRIPT_JSON:'{}',
              QA_PROFILE:JSON.stringify({
                group:'G',
                mode:'NEW_AUTHORING',
                item_id:'NEW-H3-K1-20260922-999',
                profile:'fixture',
                image_source:'generated'
              }),
              AUDIT_RESULT:JSON.stringify({
                result:'PASS',
                visual_qa:'PASS',
                blind_audit:'PASS',
                exactly_one_choice:2
              }),
              BOUND_LISTENING_SET_ID:'',
              CONSUMED_AT:''
            },overrides||{}));
          }

          function conceptRow(overrides){
            return row(ch,Object.assign({
              CONCEPT_ID:'VOCAB:열쇠',
              LEVEL:'3級',
              CONCEPT_DOMAIN:'VOCABULARY',
              CONCEPT_LABEL:'열쇠',
              SKILL_ID:'H3-P2-SK031',
              FAMILY:'WRITTEN',
              SECTION_KEY:'H3-P2',
              APPLICATION_LABEL:'열쇠',
              MAPPING_ROLE:'APPLICATION_SKILL',
              MATCH_TYPE:'EXACT_LEXEME_MATCH',
              CONFIDENCE:'HIGH',
              DIRECT_REUSE:'NO',
              STATE_TRANSFER:'NO',
              RETEST_CLOSURE:'NO',
              STABILITY_TRANSFER:'NO',
              SCHEDULER_USE:'DIAGNOSTIC_SELECTION_ONLY',
              STATUS:'ACTIVE_PILOT'
            },overrides||{}));
          }

          const ready=[rh,readyRow()];
          const concepts=[ch,conceptRow()];
          const request={
            k1_ready_id:'H3-K1R-20260922-999',
            listening_set_no:4,
            target_skill_id:'H3-P2-SK031',
            concept_id:'VOCAB:열쇠',
            source_ref:'AUTHOR_REVIEW:FIXTURE',
            author_verified_exact:true,
            notes:'fixture note'
          };

          const plan=context.h3Rs13k1aPlanFromValues_(
            [ah],
            ready,
            concepts,
            request,
            '2026-09-22T12:05:00.000Z'
          );
          assert.strictEqual(plan.action,'APPEND');
          assert.strictEqual(
            plan.authority_id,
            'K1A|H3-K1R-20260922-999|H3-P2-SK031|VOCAB:열쇠'
          );
          assert.strictEqual(plan.row[2],'H3-K1-SK001');
          assert.strictEqual(plan.row[3],'abc123');
          assert.strictEqual(plan.row[4],'NEW-H3-K1-20260922-999');
          assert.strictEqual(plan.row[7],'CONTRIBUTORY');
          assert.strictEqual(plan.row[8],'HIGH');
          assert.strictEqual(plan.row[10],'ACTIVE_PROSPECTIVE');

          assert.throws(
            ()=>context.h3Rs13k1aPlanFromValues_(
              [ah],ready,concepts,
              {...request,author_verified_exact:false},
              '2026-09-22T12:05:00.000Z'
            ),
            /AUTHOR_VERIFIED_EXACT_REQUIRED/
          );

          assert.throws(
            ()=>context.h3Rs13k1aPlanFromValues_(
              [ah],ready,concepts,
              {...request,listening_set_no:3},
              '2026-09-22T12:05:00.000Z'
            ),
            /LISTENING_SET_NO_INVALID/
          );

          const oldReady=[
            rh,
            readyRow({CREATED_AT:'2026-09-20T08:00:00+09:00'})
          ];
          assert.throws(
            ()=>context.h3Rs13k1aPlanFromValues_(
              [ah],oldReady,concepts,request,
              '2026-09-22T12:05:00.000Z'
            ),
            /READY_NOT_PROSPECTIVE/
          );

          const boundReady=[
            rh,
            readyRow({BOUND_LISTENING_SET_ID:'H3-L-0004'})
          ];
          assert.throws(
            ()=>context.h3Rs13k1aPlanFromValues_(
              [ah],boundReady,concepts,request,
              '2026-09-22T12:05:00.000Z'
            ),
            /READY_NOT_UNBOUND/
          );

          const consumedReady=[
            rh,
            readyRow({STATUS:'CONSUMED',CONSUMED_AT:'2026-09-22T12:10:00+09:00'})
          ];
          assert.throws(
            ()=>context.h3Rs13k1aPlanFromValues_(
              [ah],consumedReady,concepts,request,
              '2026-09-22T12:05:00.000Z'
            ),
            /READY_NOT_UNBOUND/
          );

          const unsafeConcepts=[
            ch,
            conceptRow({CONFIDENCE:'MEDIUM'})
          ];
          assert.throws(
            ()=>context.h3Rs13k1aPlanFromValues_(
              [ah],ready,unsafeConcepts,request,
              '2026-09-22T12:05:00.000Z'
            ),
            /TARGET_MAPPING_UNSAFE/
          );

          const existing=plan.row.slice();
          existing[11]='2026-09-22T12:05:00.000Z';
          existing[13]='original note';
          const noOp=context.h3Rs13k1aPlanFromValues_(
            [ah,existing],
            ready,
            concepts,
            {...request,notes:'different repeat note'},
            '2026-09-22T13:00:00.000Z'
          );
          assert.strictEqual(noOp.action,'NO_OP');
          assert.strictEqual(noOp.row[11],'2026-09-22T12:05:00.000Z');
          assert.strictEqual(noOp.row[13],'original note');

          const concepts2=[
            ch,
            conceptRow(),
            conceptRow({
              CONCEPT_ID:'EXPR:마음을_놓다',
              CONCEPT_DOMAIN:'EXPRESSION',
              CONCEPT_LABEL:'마음을 놓다',
              SKILL_ID:'H3-P4-SK014',
              SECTION_KEY:'H3-P4',
              APPLICATION_LABEL:'마음을 놓다',
              MATCH_TYPE:'EXACT_EXPRESSION_SEMANTICS'
            })
          ];
          assert.throws(
            ()=>context.h3Rs13k1aPlanFromValues_(
              [ah,existing],
              ready,
              concepts2,
              {
                ...request,
                target_skill_id:'H3-P4-SK014',
                concept_id:'EXPR:마음을_놓다'
              },
              '2026-09-22T13:00:00.000Z'
            ),
            /EXISTING_AUTHORITY_CONFLICT/
          );

          function makeSpreadsheet(authorityRows){
            const store={
              authority:[ah].concat(authorityRows.map(r=>r.slice())),
              ready:ready.map(r=>r.slice()),
              concept:concepts.map(r=>r.slice())
            };
            function makeSheet(key){
              return {
                getLastRow(){ return store[key].length; },
                getRange(r,c,n,m){
                  return {
                    getDisplayValues(){
                      return store[key].slice(r-1,r-1+n).map(
                        row=>row.slice(c-1,c-1+m)
                      );
                    },
                    setValues(values){
                      for(let i=0;i<n;i++){
                        store[key][r-1+i]=values[i].slice();
                      }
                      return this;
                    }
                  };
                }
              };
            }
            return {
              _store:store,
              getSheetByName(name){
                if(name===context.H3_RS13K1_AUTHORITY_SHEET_) return makeSheet('authority');
                if(name===context.H3_RS13K1_READY_SHEET_) return makeSheet('ready');
                if(name===context.H3_MULTI_SKILL_CONCEPT_SHEET_) return makeSheet('concept');
                return null;
              }
            };
          }

          const sheet=makeSpreadsheet([]);
          const preview=context.h3Rs13k1aPreview_(sheet,request);
          assert.strictEqual(preview.action,'APPEND');
          assert.strictEqual(sheet._store.authority.length,1);

          const write=context.h3Rs13k1aAuthor_(
            sheet,
            request,
            '2026-09-22T12:05:00.000Z'
          );
          assert.strictEqual(write.status,'PASS_WRITTEN');
          assert.strictEqual(write.written,1);
          assert.strictEqual(sheet._store.authority.length,2);

          const repeat=context.h3Rs13k1aAuthor_(
            sheet,
            request,
            '2026-09-22T13:00:00.000Z'
          );
          assert.strictEqual(repeat.status,'NO_OP');
          assert.strictEqual(repeat.written,0);
          assert.strictEqual(sheet._store.authority.length,2);

          const contract=context.h3Rs13k1aDescribeContract_();
          assert.strictEqual(contract.automatic_concept_inference,false);
          assert.strictEqual(contract.historical_backfill,false);
          assert.strictEqual(contract.scheduler_write,false);
          assert.strictEqual(contract.learner_state_write,false);

          console.log('RS-13K1A authoring helper audit passed.');
          NODE
