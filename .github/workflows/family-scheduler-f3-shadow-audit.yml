name: Family Scheduler F3 Shadow Audit

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check WebAppFamilyScheduler.js
          node --check WebAppFamilySchedulerPreparation.js

      - name: Contract audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("WebAppFamilyScheduler.js")
          text = p.read_text(encoding="utf-8")
          required = [
              "family_scheduler_state_v1",
              "family_scheduler_decision_log_v1",
              "h3FamilySchedulerShadowPreview",
              "h3FamilySchedulerShadowTick",
              "P1_RETEST_ADVANCE",
              "P2_STARVATION",
              "P3_BALANCE",
              "P4_COVERAGE",
              "P5_SKILL_PRESSURE",
              "P6_TIEBREAK",
              "scheduler not applied to issue selection",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing contract token: {token}")
          forbidden = [
              "SCHEDULER_APPLIED,true",
              "SCHEDULER_APPLIED: true",
              "issueProductionSet(",
              "issueReading",
              "issueTranslation",
              "issueListening",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"F3 live-wiring token present: {token}")
          print("F3 static contract PASS")
          PY

      - name: F4 shadow observation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")
          web = Path("WebApp.js").read_text(encoding="utf-8")

          required = [
              "H3_FS_F4_START_CLOCK_ = 27",
              "H3_FS_F4_TARGET_COMMITS_ = 20",
              "function h3FamilySchedulerObserveAfterCommit_(",
              "function h3FamilySchedulerF4Status()",
              "COMMIT_OBSERVED",
              "F4 SHADOW observation",
              "status:'RECOVERY_REQUIRED'",
              "scheduler_applied:false",
          ]
          for token in required:
              if token not in fs:
                  raise SystemExit(f"missing F4 contract token: {token}")

          if web.count("h3FamilySchedulerObserveAfterCommit_(") != 4:
              raise SystemExit("F4 must wire exactly four family post-commit hooks.")

          for family in ["'L'", "'W'", "'R'", "'T'"]:
              if family not in web:
                  raise SystemExit(f"family hook missing: {family}")

          # F4's original SHADOW persistence surfaces remain unchanged even
          # after the separately audited LIMITED_LIVE issue path is added.
          append_start = fs.index("function h3FsAppend_(ss,level,e)")
          append_end = fs.index("function h3FsLogRows_", append_start)
          if fs[append_start:append_end].count("appendRow([") != 1:
              raise SystemExit("F3 evaluation append surface changed unexpectedly.")

          state_start = fs.index("function h3FsWriteState_(ss,level,state)")
          state_end = fs.index("function h3FsHistoryRecord_", state_start)
          if fs[state_start:state_end].count(".setValues(") != 1:
              raise SystemExit("F4 current-state write surface changed unexpectedly.")

          observed_start = fs.index("function h3FsAppendCommitObserved_")
          observed_end = fs.index("function h3FsObserveCommitted_", observed_start)
          if fs[observed_start:observed_end].count("appendRow([") != 1:
              raise SystemExit("F4 commit-observation append surface changed unexpectedly.")

          if "schedulerApplied===true?'LIMITED_LIVE':'SHADOW'" not in fs[observed_start:observed_end]:
              raise SystemExit("F4/LIMITED_LIVE provenance split missing.")

          status_start = fs.index("function h3FamilySchedulerF4Status()")
          status_end = fs.index("function h3FamilySchedulerShadowPreview()", status_start)
          if "String(x.MODE||'')==='SHADOW'" not in fs[status_start:status_end]:
              raise SystemExit("F4 status must count SHADOW observations only.")

          # Hook must occur only after lightweight HOME index persistence.
          listening_sync = web.index("result.home_index_sync =")
          listening_obs = web.index("result.family_scheduler_shadow =")
          if not listening_sync < listening_obs:
              raise SystemExit("Listening observer precedes HOME commit sync.")

          reading_sync = web.index("readingResult.home_index_sync =")
          reading_obs = web.index("readingResult.family_scheduler_shadow =")
          if not reading_sync < reading_obs:
              raise SystemExit("Reading observer precedes HOME commit sync.")

          translation_sync = web.index("translationResult.home_index_sync =")
          translation_obs = web.index("translationResult.family_scheduler_shadow =")
          if not translation_sync < translation_obs:
              raise SystemExit("Translation observer precedes HOME commit sync.")

          written_sync = web.index("writtenResult.home_index_sync =")
          written_obs = web.index("writtenResult.family_scheduler_shadow =")
          if not written_sync < written_obs:
              raise SystemExit("Written observer precedes HOME commit sync.")

          print("F4 shadow observation contract PASS")
          PY

      - name: Live resolver contract (not wired)
        run: |
          python - <<'PY'
          from pathlib import Path

          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")

          required = [
              "H3_FAMILY_SCHEDULER_LIVE_RESOLVER_V1",
              "function h3FsResolveLive_(evaluation)",
              "function h3FamilySchedulerLiveResolverPreview()",
              "mode:'LIVE_RESOLVER'",
              "scheduler_applied:false",
              "route_kind='CURRENT_SET'",
              "route_kind='BLOCKED'",
              "route_kind='FAMILY'",
              "FAMILY_SCHEDULER_LIVE_RESOLVER_SCHEMA_INVALID",
              "FAMILY_SCHEDULER_LIVE_RESOLVER_ACTION_INVALID",
          ]
          for token in required:
              if token not in fs:
                  raise SystemExit(f"missing live resolver token: {token}")

          start = fs.index("function h3FsResolveLive_(evaluation)")
          end = fs.index("function h3FsSnapshot_", start)
          resolver = fs[start:end]

          forbidden = [
              "appendRow",
              ".setValue(",
              ".setValues(",
              "h3FsAppend_(",
              "h3FsWriteState_(",
              "issueProductionSet(",
              "issueReading",
              "issueTranslation",
              "issueListening",
          ]
          for token in forbidden:
              if token in resolver:
                  raise SystemExit(f"live resolver must remain pure/unwired: {token}")

          preview_start = fs.index("function h3FamilySchedulerLiveResolverPreview()")
          preview_end = fs.index("function h3FamilySchedulerIssueRoutePreview()", preview_start)
          preview = fs[preview_start:preview_end]
          for token in [
              "appendRow",
              ".setValue(",
              ".setValues(",
              "h3FsAppend_(",
              "h3FsWriteState_(",
          ]:
              if token in preview:
                  raise SystemExit(f"live resolver preview must remain read-only: {token}")

          print("Live resolver static contract PASS")
          PY

      - name: Live resolver deterministic fixture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          vm.runInThisContext(fs.readFileSync('WebAppFamilyScheduler.js','utf8'));

          function evaluation(overrides) {
            return {
              schema:H3_FS_OUTPUT_SCHEMA_,
              mode:'SHADOW',
              global_set_clock:27,
              next_action:'RECOMMEND_FAMILY',
              recommended_family:'W',
              primary_reason:'P3_BALANCE',
              candidate_order:['W','L','R','T'],
              family_metrics:{},
              current_set_id:'',
              result_status:'PASS',
              ...overrides
            };
          }

          const family = h3FsResolveLive_(evaluation({}));
          if (family.route_kind !== 'FAMILY') throw new Error('family route mismatch');
          if (family.family !== 'W') throw new Error('family value mismatch');
          if (family.result_status !== 'READY') throw new Error('family readiness mismatch');
          if (family.scheduler_applied !== false) throw new Error('resolver must not claim application');

          const resume = h3FsResolveLive_(evaluation({
            next_action:'RESUME_CURRENT',
            recommended_family:'NONE',
            primary_reason:'RESUME_CURRENT',
            candidate_order:[],
            current_set_id:'H3-TEST-CURRENT',
            result_status:'PASS'
          }));
          if (resume.route_kind !== 'CURRENT_SET') throw new Error('resume route mismatch');
          if (resume.current_set_id !== 'H3-TEST-CURRENT') throw new Error('resume set mismatch');
          if (resume.family !== 'NONE') throw new Error('resume family must remain NONE');

          const blocked = h3FsResolveLive_(evaluation({
            next_action:'BLOCKED',
            recommended_family:'NONE',
            primary_reason:'ALL_BLOCKED',
            candidate_order:[],
            current_set_id:'',
            result_status:'BLOCKED'
          }));
          if (blocked.route_kind !== 'BLOCKED') throw new Error('blocked route mismatch');
          if (blocked.result_status !== 'BLOCKED') throw new Error('blocked status mismatch');

          const invalid = [
            () => h3FsResolveLive_(null),
            () => h3FsResolveLive_(evaluation({recommended_family:'X'})),
            () => h3FsResolveLive_(evaluation({
              next_action:'RESUME_CURRENT',
              recommended_family:'NONE',
              current_set_id:''
            })),
            () => h3FsResolveLive_(evaluation({
              next_action:'UNKNOWN',
              recommended_family:'NONE'
            }))
          ];
          invalid.forEach((fn, i) => {
            let threw = false;
            try { fn(); } catch (_) { threw = true; }
            if (!threw) throw new Error('invalid resolver case did not fail closed: '+i);
          });

          console.log('Live resolver deterministic fixture PASS');
          NODE

      - name: Issue routing bridge contract (not executing)
        run: |
          python - <<'PY'
          from pathlib import Path

          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")

          required = [
              "H3_FAMILY_SCHEDULER_ISSUE_ROUTE_V1",
              "H3_FS_ISSUE_ROUTE_BINDINGS_",
              "function h3FsIssueRoute_(resolved,readiness,currentLearning)",
              "function h3FamilySchedulerIssueRoutePreview()",
              "route_target:'LISTENING'",
              "route_target:'WRITTEN'",
              "route_target:'READING'",
              "route_target:'TRANSLATION'",
              "issue_performed:false",
              "scheduler_applied:false",
              "requires_prepare",
              "h3ReviewCurrentLearning_(ss)",
              "h3FsReadiness_(ss)",
          ]
          for token in required:
              if token not in fs:
                  raise SystemExit(f"missing issue routing token: {token}")

          start = fs.index("function h3FsIssueRoute_(resolved,readiness,currentLearning)")
          end = fs.index("function h3FsSnapshot_", start)
          route = fs[start:end]

          forbidden = [
              "appendRow",
              ".setValue(",
              ".setValues(",
              "h3FsAppend_(",
              "h3FsWriteState_(",
              "consumeK1ReadyAfterIssue_(",
              "prepareListeningBackendSet(",
              "h3WrittenSubmit_(",
              "h3ReadingSubmit_(",
              "h3TranslationSubmit_(",
              "h3TranslationV2Submit_(",
          ]
          for token in forbidden:
              if token in route:
                  raise SystemExit(f"issue routing bridge must not execute issue/submit writes: {token}")

          preview_start = fs.index("function h3FamilySchedulerIssueRoutePreview()")
          preview_end = fs.index("function h3FsHomeNextLocked_()", preview_start)
          preview = fs[preview_start:preview_end]
          for token in [
              "appendRow",
              ".setValue(",
              ".setValues(",
              "h3FsAppend_(",
              "h3FsWriteState_(",
          ]:
              if token in preview:
                  raise SystemExit(f"issue route preview must remain read-only: {token}")

          print("Issue routing bridge static contract PASS")
          PY

      - name: Issue routing deterministic fixture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          vm.runInThisContext(fs.readFileSync('WebAppFamilyScheduler.js','utf8'));

          function resolved(overrides) {
            return {
              schema:H3_FS_LIVE_RESOLVER_SCHEMA_,
              mode:'LIVE_RESOLVER',
              scheduler_applied:false,
              global_set_clock:27,
              source_next_action:'RECOMMEND_FAMILY',
              primary_reason:'P3_BALANCE',
              route_kind:'FAMILY',
              family:'W',
              current_set_id:'',
              result_status:'READY',
              ...overrides
            };
          }

          const readiness={
            L:{state:'READY',eligible:true,reason:''},
            W:{state:'PREPARE_REQUIRED',eligible:true,reason:''},
            R:{state:'PREPARE_REQUIRED',eligible:true,reason:''},
            T:{state:'PREPARE_REQUIRED',eligible:true,reason:''}
          };

          const expected={
            L:['LISTENING','5L','LISTENING',false],
            W:['WRITTEN','5W','WRITTEN',true],
            R:['WRITTEN','READING','READING',true],
            T:['WRITTEN','TRANSLATION','TRANSLATION',true]
          };

          Object.keys(expected).forEach(family=>{
            const route=h3FsIssueRoute_(
              resolved({family}),
              readiness,
              null
            );
            const e=expected[family];
            if(route.provider_kind!==e[0]) throw new Error(family+' provider mismatch');
            if(route.surface_family!==e[1]) throw new Error(family+' surface mismatch');
            if(route.route_target!==e[2]) throw new Error(family+' target mismatch');
            if(route.requires_prepare!==e[3]) throw new Error(family+' prepare mismatch');
            if(route.issue_performed!==false) throw new Error(family+' issue execution boundary violated');
            if(route.scheduler_applied!==false) throw new Error(family+' scheduler application boundary violated');
          });

          const current=h3FsIssueRoute_(
            resolved({
              route_kind:'CURRENT_SET',
              family:'NONE',
              current_set_id:'H3-TEST-R001',
              source_next_action:'RESUME_CURRENT'
            }),
            readiness,
            {
              set_id:'H3-TEST-R001',
              provider_kind:'WRITTEN',
              surface_family:'READING'
            }
          );
          if(current.route_target!=='READING') throw new Error('current route target mismatch');
          if(current.current_set_id!=='H3-TEST-R001') throw new Error('current set mismatch');
          if(current.requires_prepare!==false) throw new Error('current must not prepare');

          const blocked=h3FsIssueRoute_(
            resolved({
              route_kind:'BLOCKED',
              family:'NONE',
              result_status:'BLOCKED',
              source_next_action:'BLOCKED'
            }),
            readiness,
            null
          );
          if(blocked.result_status!=='BLOCKED') throw new Error('blocked route mismatch');

          let threw=false;
          try {
            h3FsIssueRoute_(
              resolved({family:'W'}),
              {W:{state:'BLOCKED',eligible:false,reason:'TEST'}},
              null
            );
          } catch (_) { threw=true; }
          if(!threw) throw new Error('ineligible family did not fail closed');

          threw=false;
          try {
            h3FsIssueRoute_(
              resolved({family:'W'}),
              readiness,
              {set_id:'UNEXPECTED',provider_kind:'WRITTEN',surface_family:'5W'}
            );
          } catch (_) { threw=true; }
          if(!threw) throw new Error('unexpected current learning did not fail closed');

          console.log('Issue routing deterministic fixture PASS');
          NODE

      - name: Family Scheduler live issue contract
        run: |
          python - <<'PY'
          from pathlib import Path

          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")
          index = Path("Index.html").read_text(encoding="utf-8")

          required = [
              "function h3FsLatestReadyK1_(ss)",
              "function h3FsReadyListeningPrestage_(ss,nextSetNo)",
              "function h3FsAllocateListeningSetId_(ss)",
              "function h3FsBuildListeningPrepare_(ss)",
              "function h3FsHomeNextLocked_()",
              "prepareListeningBackendSet(",
              "preparation_performed=true",
              "FAMILY_SCHEDULER_LISTENING_PREPARE_READBACK_FAIL",
              "function h3FsFindPreparedWritten_(ss)",
              "function h3FsFindPreparedReading_(ss)",
              "function h3FsFindPreparedTranslation_(ss)",
              "function h3FsIssueWritten_(ss)",
              "function h3FsIssueReading_(ss)",
              "function h3FsIssueTranslation_(ss)",
              "function h3FsIssueListening_(ss)",
              "function h3FsIssuePreparedFamily_(ss,family)",
              "function h3FsAppendIssueApplied_(",
              "function h3FsIssueAppliedForSet_(ss,level,setId)",
              "schedulerApplied===true?'LIMITED_LIVE':'SHADOW'",
              "appliedIssue?'FAMILY_SCHEDULER':selectionSource",
              "limited_live_commit_count:liveCommits.length",
              "'ISSUE_APPLIED'",
              "'LIMITED_LIVE'",
              "scheduler_applied=true",
              "issue_performed=true",
              "client_action='OPEN_ISSUED'",
              "consumeK1ReadyAfterIssue_(",
              "h3ReadingPreissueValidate_",
              "h3TranslationV2RequireIssued_",
              "h3WrittenValidateSourceIdentity_",
              "FAMILY_SCHEDULER_ISSUE_CURRENT_READBACK_MISMATCH",
          ]
          for token in required:
              if token not in fs:
                  raise SystemExit(f"missing live issue token: {token}")

          if "'OPEN_ISSUED'" not in index:
              raise SystemExit("HOME NEXT client must open newly issued set.")

          if "'PREPARE_REQUIRED'" not in index:
              raise SystemExit("NEXT must expose the deterministic preparation path.")

          if "route.client_action !==\n                'AUTHORING_REQUIRED'" not in index:
              raise SystemExit("NEXT must disable after semantic authoring is required.")

          home_start = fs.index("function h3FsHomeNextLocked_()")
          home_end = fs.index("function h3FamilySchedulerHomeNext()", home_start)
          home_locked = fs[home_start:home_end]
          if "prepareListeningBackendSet(" in home_locked:
              raise SystemExit("Listening preparation must not run while the outer scheduler lock is held.")

          public_start = fs.index("function h3FamilySchedulerHomeNext()")
          public_end = fs.index("function h3FamilySchedulerShadowTick()", public_start)
          public_rpc = fs[public_start:public_end]
          if "prepareListeningBackendSet(" not in public_rpc:
              raise SystemExit("HOME NEXT must bridge PREPARE_REQUIRED to the listening backend.")

          # Existing SHADOW evaluator itself must remain read-only.
          eval_start = fs.index("function h3FsEvaluate_(ss,level)")
          eval_end = fs.index("function h3FsResolveLive_", eval_start)
          evaluator = fs[eval_start:eval_end]
          for token in ["appendRow", ".setValue(", ".setValues("]:
              if token in evaluator:
                  raise SystemExit(f"evaluator write boundary violated: {token}")

          print("Family Scheduler live issue contract PASS")
          PY

      - name: HOME NEXT activation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("Index.html").read_text(encoding="utf-8")
          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")

          required = [
              "family-scheduler-launcher",
              "family-scheduler-actions",
              "family-scheduler-button",
              "family-scheduler-next",
              "family-scheduler-next-family",
              "family-scheduler-family-group",
              "'L'",
              "'W'",
              "'R'",
              "'T'",
              "nextButton.disabled = true",
              "button.disabled = true",
              "aria-disabled",
              "home.insertBefore(",
              "review",
              "new MutationObserver(",
              "repeat(4, minmax(0, 1fr))",
              "nextButton.addEventListener(",
              ".h3FamilySchedulerIssueRoutePreview()",
              ".h3FamilySchedulerHomeNext()",
          ]
          for token in required:
              if token not in index:
                  raise SystemExit(f"missing F5 read-only UI token: {token}")

          if index.count("family-scheduler-launcher") < 3:
              raise SystemExit("F5 launcher style/injection contract incomplete.")

          preview_start = index.index("(function () {")
          preview = index[preview_start:]

          if "family-scheduler-next-caption" in index or "nextCaption" in preview:
              raise SystemExit("F5 NEXT caption must remain hidden; display family only.")

          if preview.count(".h3FamilySchedulerIssueRoutePreview()") != 1:
              raise SystemExit("HOME NEXT must use exactly one fresh route preview RPC per launcher render.")

          if preview.count(".h3FamilySchedulerHomeNext()") != 1:
              raise SystemExit("HOME NEXT must use exactly one activation RPC from its click handler.")

          forbidden = [
              "h3FamilySchedulerShadowTick",
              "h3FamilySchedulerObserveAfterCommit_",
              "submitListeningWebAnswers",
              "submitWrittenWebAnswers",
              "submitReadingWebAnswers",
              "submitTranslationWebAnswers",
          ]
          for token in forbidden:
              if token in preview:
                  raise SystemExit(f"F5 read-only boundary violated: {token}")

          if preview.count("nextButton.addEventListener(") != 1:
              raise SystemExit("HOME NEXT must have exactly one click handler.")

          if "button.addEventListener(" in preview:
              raise SystemExit("Manual L/W/R/T buttons must remain disabled without click handlers.")

          if index.index("family-scheduler-launcher") > index.index("</head>"):
              raise SystemExit("F5 preview styles must load before body render.")

          fs_preview_start = fs.index("function h3FamilySchedulerShadowPreview()")
          fs_preview_end = fs.index("function h3FamilySchedulerLiveResolverPreview()", fs_preview_start)
          fs_preview = fs[fs_preview_start:fs_preview_end]
          for token in [
              "appendRow",
              ".setValue(",
              ".setValues(",
              "h3FsAppend_(",
              "h3FsWriteState_(",
          ]:
              if token in fs_preview:
                  raise SystemExit(f"Shadow preview RPC must remain read-only: {token}")

          if "h3FamilySchedulerHomeNext" not in fs:
              raise SystemExit("HOME NEXT server RPC missing.")

          rpc_start = fs.index("function h3FamilySchedulerHomeNext()")
          rpc_end = fs.index("function h3FamilySchedulerShadowTick()", rpc_start)
          rpc = fs[rpc_start:rpc_end]
          for token in [
              "h3WrittenSubmit_(",
              "h3ReadingSubmit_(",
              "h3TranslationSubmit_(",
              "h3TranslationV2Submit_(",
          ]:
              if token in rpc:
                  raise SystemExit(f"HOME NEXT must never submit learner answers: {token}")

          print("HOME NEXT activation contract PASS")
          PY

      - name: W/R/T preparation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")
          prep = Path("WebAppFamilySchedulerPreparation.js").read_text(encoding="utf-8")

          required_prep = [
              "H3-FAMILY-SCHEDULER-W-PREP-20260924-V1",
              "H3_FAMILY_SCHEDULER_WRITTEN_AUTHORING_REQUEST_V1",
              "function h3FsPrepareWritten_(ss)",
              "WRITTEN_STAGE_AUTHORING:",
              "H3-FAMILY-SCHEDULER-RT-PREP-20260924-V1",
              "function h3FsRtDueObligations_(ss,family,direction)",
              "function h3FsPrepareReading_(ss)",
              "function h3FsPrepareTranslation_(ss)",
              "function h3FsBuildReadingSource_(ss,selected)",
              "h3ReadingBuildSectionMaterializationPlan_(",
              "function h3FsAuthoredSurfaceSha_(x)",
              "function h3FsTranslationSourceForObligation_(ss,obligation,used)",
              "h3TranslationV2ValidateRetestSurface_(",
              "h3TranslationV2LockBundle_(",
              "h3TranslationV2BuildStage_(",
              "TRANSLATION_RETEST_SURFACE:",
              "READING_RETEST_SOURCE:",
          ]
          for token in required_prep:
              if token not in prep:
                  raise SystemExit(f"missing R/T preparation token: {token}")

          required_home = [
              "h3FsPrepareWritten_(ss)",
              "out.prepare_request=wPrep.authoring_request",
              "h3FsPrepareReading_(ss)",
              "h3FsPrepareTranslation_(ss)",
              "FAMILY_SCHEDULER_RT_PREPARE_SET_ID_MISSING",
              "out.preparation_performed=true",
          ]
          for token in required_home:
              if token not in fs:
                  raise SystemExit(f"missing HOME R/T bridge token: {token}")

          w_start = prep.index("function h3FsPrepareWritten_(ss)")
          w_end = prep.index("function h3FamilySchedulerWrittenAuthoringRequestPreview()", w_start)
          w_body = prep[w_start:w_end]
          for token in ["appendRow(", ".setValue(", ".setValues(", "deleteRow", "deleteRows"]:
              if token in w_body:
                  raise SystemExit(f"W preparation must remain read-only: {token}")

          forbidden = [
              "h3ReadingSubmit_(",
              "h3TranslationV2Submit_(",
              "h3WrittenSubmit_(",
              "consumeK1ReadyAfterIssue_(",
              "h3FamilySchedulerObserveAfterCommit_(",
          ]
          for token in forbidden:
              if token in prep:
                  raise SystemExit(f"R/T preparation must stay preissue-only: {token}")

          if prep.count("appendRow(") != 2:
              raise SystemExit("R/T preparation must have exactly two stage append surfaces.")

          print("W/R/T preparation static contract PASS")
          PY

      - name: Semantic authoring queue contract
        run: |
          python - <<'PY'
          from pathlib import Path

          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")

          required = [
              "authoring_queue_v1",
              "H3_FAMILY_SCHEDULER_AUTHORING_QUEUE_V1",
              "H3-SEMANTIC-AUTHORING-QUEUE-20260924-V1",
              "function h3FsAuthoringUpsert_(ss,level,evaluation,prep)",
