      - name: Verify audio semantic invariants
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const crypto = require('crypto');

          const source = fs.readFileSync('Code.js', 'utf8');
          const context = vm.createContext({
            console,
            Utilities: {
              DigestAlgorithm: { SHA_256: 'SHA_256' },
              Charset: { UTF_8: 'UTF_8' },
              computeDigest: (_algorithm, text) =>
                Array.from(
                  crypto.createHash('sha256')
                    .update(String(text), 'utf8')
                    .digest()
                )
            }
          });

          vm.runInContext(source, context, {
            filename: 'Code.js'
          });

          const run = expression =>
            vm.runInContext(expression, context);

          const fail = message => {
            throw new Error(message);
          };

          const assert = (condition, message) => {
            if (!condition) fail(message);
          };

          const same = (actual, expected, message) => {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              fail(
                message + '\nexpected=' + JSON.stringify(expected) +
                '\nactual=' + JSON.stringify(actual)
              );
            }
          };

          const expectThrow = (fn, message) => {
            let threw = false;
            try {
              fn();
            } catch (_error) {
              threw = true;
            }
            assert(threw, message);
          };

          const validate = (plan, section) =>
            run(
              'validateListeningAudioPlan_(' +
              JSON.stringify(JSON.stringify(plan)) + ',' +
              JSON.stringify(section) +
              ')'
            );

          const listeningSpec = (plan, versionExpression, section) =>
            run(
              'listeningAudioSpec_(' +
              JSON.stringify({ plan, section: section || 'K1' }) + ',' +
              '{voice:"JiMin",audioVersion:' +
              (versionExpression || 'HQ_LISTENING_AUDIO_VERSION_V2') +
              '}' +
              ')'
            );

          same(
            run('HQ_VOICES'),
            [
              { label: 'Hyunsu', id: 'ko-KR-HyunsuNeural', rate: '+20%' },
