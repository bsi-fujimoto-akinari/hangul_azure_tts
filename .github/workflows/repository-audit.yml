            'VOICE=JiMin;RESPONSE_VOICE=Hyunsu;NUMBER_VOICE=Nanami'
          ) {
            throw new Error('K3 V21 voice assignment mismatch: '+k3spec.assignment);
          }
          for (const voiceId of [
            'ko-KR-JiMinNeural',
            'ko-KR-HyunsuNeural',
            'ja-JP-NanamiNeural'
          ]) {
            if (!k3spec.ssml.includes(voiceId)) {
              throw new Error('K3 V21 SSML missing voice '+voiceId);
            }
          }

          const k4=[
            {role:'passage',text:'본문입니다.',repeat:1,pause_ms_after:2200},
            {role:'replay_cue',text:'もう一度読みます',repeat:1,pause_ms_after:2200},
            {role:'passage',text:'본문입니다.',repeat:1,pause_ms_after:3200}
          ];
          ctx.__k4=k4;
          vm.runInContext("validateListeningAudioPlan_(JSON.stringify(__k4),'K4')",ctx);
          vm.runInContext("validateListeningOfficialParityPlan_(__k4,'K4')",ctx);
          ctx.__j4={section:'K4',plan:k4};
          const k4spec=vm.runInContext('listeningAudioSpec_(__j4,__state)',ctx);
          if (!k4spec.assignment.includes('CUE_VOICE=Nanami')) {
            throw new Error('K4 V21 cue voice missing.');
          }
          if (!k4spec.ssml.includes('ja-JP-NanamiNeural')) {
            throw new Error('K4 V21 Japanese cue is not Nanami.');
          }

          const oldK3=k3.filter(x=>!x.role.startsWith('choice_number'));
          ctx.__oldK3=oldK3;
          let rejected=false;
          try {
            vm.runInContext("validateListeningOfficialParityPlan_(__oldK3,'K3')",ctx);
          } catch (_e) { rejected=true; }
          if (!rejected) {
            throw new Error('V21 accepted K3 without choice-number audio.');
          }

          const badCue=[
            {role:'passage',text:'본문입니다.',repeat:1,pause_ms_after:2200},
            {role:'replay_cue',text:'다시 한 번 들으세요.',repeat:1,pause_ms_after:2200},
            {role:'passage',text:'본문입니다.',repeat:1,pause_ms_after:3200}
          ];
          ctx.__badCue=badCue;
          rejected=false;
          try {
            vm.runInContext("validateListeningAudioPlan_(JSON.stringify(__badCue),'K5')",ctx);
          } catch (_e) { rejected=true; }
          if (!rejected) {
            throw new Error('V21 accepted Korean replay cue.');
          }
          NODE

