name: Apps Script auto-sync

on:
  workflow_run:
    workflows: ["Repository audit"]
    types: [completed]
  workflow_dispatch:
    inputs:
      intended_smoke_sha:
        description: "Exact audited main SHA authorized for an optional temporary read-only Apps Script smoke preflight"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: apps-script-auto-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout audited main source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 2

      - name: Verify exact audited main source
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TRIGGER_NAME: ${{ github.event_name }}
          TRIGGER_AUDIT_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          TRIGGER_AUDIT_EVENT: ${{ github.event.workflow_run.event || '' }}
          TRIGGER_AUDIT_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=2

          checked_out="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$checked_out" != "$SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA does not match the resolved source SHA."
            exit 1
          fi
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Credentialed Apps Script work is restricted to the exact current main SHA."
            exit 1
          fi

          if [ "$TRIGGER_NAME" = "workflow_run" ]; then
            if [ "$TRIGGER_AUDIT_SHA" != "$SOURCE_SHA" ] || \
               [ "$TRIGGER_AUDIT_EVENT" != "push" ] || \
               [ "$TRIGGER_AUDIT_CONCLUSION" != "success" ]; then
              echo "::error::Triggering Repository audit is not a successful push audit for the exact source SHA."
              exit 1
            fi
          else
            python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GH_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          token = os.environ['GH_TOKEN']
          query = urllib.parse.urlencode({
              'branch': 'main',
              'status': 'completed',
              'per_page': '100',
          })
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              f'repository-audit.yml/runs?{query}'
          )
          req = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          matches = [
              run for run in payload.get('workflow_runs', [])
              if run.get('head_sha') == sha
              and run.get('head_branch') == 'main'
              and run.get('event') == 'push'
              and run.get('status') == 'completed'
              and run.get('conclusion') == 'success'
          ]
          if not matches:
              raise SystemExit(
                  'No successful Repository audit push run exists for the exact current main SHA.'
              )
          print(f'Exact audited main source verified: {sha}')
          PY
          fi

      - name: Detect read-only smoke preflight request
        id: smoke_request
        shell: bash
        env:
          INTENDED_SMOKE_SHA: ${{ github.event.inputs.intended_smoke_sha || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INTENDED_SMOKE_SHA" ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Apps Script-impacting change
        id: impact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ steps.smoke_request.outputs.requested }}" = "true" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              *.js|*.gs|*.html|appsscript.json)
                changed=true
                ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Detect synchronization-policy change
        id: policy_change
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | \
             grep -Fxq '.github/workflows/apps-script-auto-sync.yml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check clasp credential availability
        if: steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true'
        id: auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON is not configured. Apps Script sync is skipped safely."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize clasp credentials
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ.get('CLASPRC_JSON', '')
          if not value.strip():
              raise SystemExit('CLASPRC_JSON is empty')

          path = Path.home() / '.clasprc.json'
          path.write_text(value, encoding='utf-8')
          path.chmod(0o600)
          PY


      - name: Verify exact Apps Script target
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          data = json.loads(Path('.clasp.json').read_text(encoding='utf-8'))
          actual = data.get('scriptId')
          if actual != expected:
              raise SystemExit(f'Apps Script target mismatch: {actual!r}')
          PY

      - name: Show Apps Script file status
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 show-file-status --json

      - name: Push audited main to Apps Script HEAD
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          output="$(npx -y @google/clasp@3.4.0 push --force 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Skipping push'; then
            echo "::error::clasp skipped the push."
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Eq '^Pushed (one|[0-9]+) file|^Pushed no files|^Script is already up to date[.]$'; then
            echo "::error::clasp did not report a completed push."
            exit 1
          fi

      - name: Attest Apps Script HEAD source against exact audited main
        id: source_attestation
        if: (steps.impact.outputs.changed == 'true' || steps.policy_change.outputs.changed == 'true' || steps.smoke_request.outputs.requested == 'true') && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          repo_dir="$GITHUB_WORKSPACE"
          readback_dir="$(mktemp -d)"
          trap 'rm -rf "$readback_dir"' EXIT

          cp "$repo_dir/.clasp.json" "$readback_dir/.clasp.json"
          (
            cd "$readback_dir"
            npx -y @google/clasp@3.4.0 pull
          )

          REPO_DIR="$repo_dir" READBACK_DIR="$readback_dir" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = Path(os.environ['REPO_DIR'])
          readback = Path(os.environ['READBACK_DIR'])

          expected = sorted(
              p for p in subprocess.check_output(
                  [
                      'git', '-C', str(repo), 'ls-files',
                      '*.js', '*.gs', '*.html', 'appsscript.json'
                  ],
                  text=True,
              ).splitlines()
              if p
          )
          actual = sorted(
              p.relative_to(readback).as_posix()
              for p in readback.rglob('*')
              if p.is_file()
              and p.name != '.clasp.json'
              and (
                  p.suffix in {'.js', '.gs', '.html'}
                  or p.name == 'appsscript.json'
              )
          )

          if expected != actual:
              missing = sorted(set(expected) - set(actual))
              extra = sorted(set(actual) - set(expected))
              raise SystemExit(
                  f'Apps Script readback file-set mismatch; missing={missing}; extra={extra}'
              )

          def normalized_text(path):
              text = path.read_text(encoding='utf-8')
              text = text.replace('\r\n', '\n').replace('\r', '\n')
              return text.splitlines()

          digest_source = hashlib.sha256()
          digest_readback = hashlib.sha256()

          for rel in expected:
              source_path = repo / rel
              readback_path = readback / rel
              if rel == 'appsscript.json':
                  source_value = json.loads(source_path.read_text(encoding='utf-8'))
                  readback_value = json.loads(readback_path.read_text(encoding='utf-8'))
                  if source_value != readback_value:
                      raise SystemExit('Apps Script manifest readback mismatch.')
                  source_bytes = json.dumps(
                      source_value, sort_keys=True, separators=(',', ':')
                  ).encode('utf-8')
                  readback_bytes = json.dumps(
                      readback_value, sort_keys=True, separators=(',', ':')
                  ).encode('utf-8')
              else:
                  source_lines = normalized_text(source_path)
                  readback_lines = normalized_text(readback_path)
                  if source_lines != readback_lines:
                      raise SystemExit(f'Apps Script source readback mismatch: {rel}')
                  source_bytes = ('\n'.join(source_lines)).encode('utf-8')
                  readback_bytes = ('\n'.join(readback_lines)).encode('utf-8')

              digest_source.update(rel.encode('utf-8') + b'\0' + source_bytes + b'\0')
              digest_readback.update(rel.encode('utf-8') + b'\0' + readback_bytes + b'\0')

          source_sha = digest_source.hexdigest()
          readback_sha = digest_readback.hexdigest()
          if source_sha != readback_sha:
              raise SystemExit('Apps Script aggregate source attestation digest mismatch.')

          output_path = os.environ['GITHUB_OUTPUT']
          with open(output_path, 'a', encoding='utf-8') as output:
              output.write('attested=true\n')
              output.write(f'file_count={len(expected)}\n')
              output.write(f'source_digest={source_sha}\n')
              output.write(f'readback_digest={readback_sha}\n')

          print(
              f'Apps Script source attestation PASS: '
              f'{len(expected)} files; digest={source_sha}'
          )
          PY

      - name: Validate one-revision read-only smoke boundary
        id: smoke_boundary
        if: steps.smoke_request.outputs.requested == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          INTENDED_SMOKE_SHA: ${{ github.event.inputs.intended_smoke_sha || '' }}
          SOURCE_ATTESTED: ${{ steps.source_attestation.outputs.attested || '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::Temporary credentialed smoke is manual-dispatch only."
            exit 1
          fi
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "::error::Temporary credentialed smoke is one-attempt only; workflow reruns are not authorized."
            exit 1
          fi
          python3 - "$INTENDED_SMOKE_SHA" <<'PY'
          import re
          import sys

          if re.fullmatch(r'[0-9a-f]{40}', sys.argv[1]) is None:
              raise SystemExit(
                  'intended_smoke_sha must be one immutable 40-character commit SHA.'
              )
          PY
          if [ "$INTENDED_SMOKE_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Temporary credentialed smoke is restricted to the explicitly intended audited SHA."
            exit 1
          fi
          if [ "$SOURCE_ATTESTED" != "true" ]; then
            echo "::error::Development-mode smoke requires a successful immediate Apps Script source attestation."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Temporary UXR-5F read-only 5W #6 Review smoke
        if: steps.smoke_boundary.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          params='[{"schema":"H3_WEB_RENDER_REQUEST_V1","mode":"REVIEW","review_kind":"WRITTEN","surface_family":"5W","set_id":"H3-20260914-03","q_no":1,"txn_id":null,"legacy_review_id":null}]'
          out=/tmp/uxr5f-5w6-smoke.out
          set +e
          npx -y @google/clasp@3.4.0 run-function getListeningWebSet --params "$params" >"$out" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::UXR-5F 5W #6 server smoke failed; Apps Script error/stack follows."
            cat "$out"
            exit "$status"
          fi
          python3 - "$out" <<'PY'
          import json
          import sys

          raw = open(sys.argv[1], encoding='utf-8').read().strip()
          candidates = [line.strip() for line in raw.splitlines() if line.strip()]
          payload = None
          for candidate in reversed(candidates):
              try:
                  value = json.loads(candidate)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict):
                  payload = value
                  break
          if payload is None:
              print('::error::Could not parse clasp run-function result as a JSON object.')
              print(raw[:2000])
              raise SystemExit(1)

          summary = {
              'schema': payload.get('schema'),
              'mode': payload.get('mode'),
              'kind': payload.get('kind'),
              'provider_kind': payload.get('provider_kind'),
              'surface_family': payload.get('surface_family'),
              'surface_set_no': payload.get('surface_set_no'),
              'sections_is_array': isinstance(payload.get('sections'), list),
              'sections_len': len(payload.get('sections') or []),
              'questions_is_array': isinstance(payload.get('questions'), list),
              'questions_len': len(payload.get('questions') or []),
          }
          print('UXR-5F 5W #6 server payload shape: ' + json.dumps(summary, ensure_ascii=False))
          if (
              summary['mode'] != 'REVIEW' or
              summary['kind'] != 'WRITTEN' or
              summary['surface_family'] != '5W' or
              summary['surface_set_no'] != 6 or
              not summary['sections_is_array'] or
              summary['sections_len'] != 5
          ):
              raise SystemExit('UXR-5F 5W #6 server payload shape mismatch.')
          PY

      # Any temporary clasp run-function step must be inserted immediately after
      # smoke_boundary and gated by:
      #   if: steps.smoke_boundary.outputs.ready == 'true'
      # Repository audit rejects run-function usage that does not use this boundary.

      - name: Read deployment inventory
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 list-deployments


      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apps Script auto-sync"
            echo ""
            echo "- source: $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "- Apps Script-impacting change: ${{ steps.impact.outputs.changed || 'unknown' }}"
            echo "- synchronization-policy change: ${{ steps.policy_change.outputs.changed || 'unknown' }}"
            echo "- clasp credential ready: ${{ steps.auth.outputs.ready || 'not-needed' }}"
            echo "- source attestation: ${{ steps.source_attestation.outputs.attested || 'not-run' }}"
            echo "- attested file count: ${{ steps.source_attestation.outputs.file_count || 'not-run' }}"
            echo "- source digest: ${{ steps.source_attestation.outputs.source_digest || 'not-run' }}"
            echo "- target script ID: 1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-"
            echo '- manifest overwrite mode: audited CI only (clasp push --force)'
            echo '- versioned /exec deployment: not changed by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
