name: Repository audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tracked-file allowlist
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          allowed = {
              '.clasp.json',
              '.gitignore',
              'Code.js',
              'WebApp.js',
              'WebAppFixture.js',
              'Index.html',
              'Stylesheet.html',
              'Client.html',
              'appsscript.json',
              'OPERATIONS.md',
              'RECOVERY.md',
              '.github/workflows/repository-audit.yml',
              '.github/workflows/apps-script-auto-sync.yml',
          }
          tracked = set(
              subprocess.check_output(
                  ['git', 'ls-files'], text=True
              ).splitlines()
          )
          unexpected = sorted(tracked - allowed)
          missing = sorted({
              '.clasp.json', '.gitignore', 'Code.js',
              'WebApp.js', 'WebAppFixture.js', 'Index.html',
              'Stylesheet.html', 'Client.html', 'appsscript.json'
          } - tracked)

          if unexpected:
              print('Unexpected tracked files:')
              print('\n'.join(f'  - {p}' for p in unexpected))
          if missing:
              print('Required tracked files missing:')
              print('\n'.join(f'  - {p}' for p in missing))
          if unexpected or missing:
              sys.exit(1)
          PY

      - name: Reject credential files and likely embedded secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ['git', 'ls-files'], text=True
          ).splitlines()

          forbidden_names = {
              '.clasprc.json',
              '.env',
              'credentials.json',
              'client_secret.json',
              'service-account.json',
          }
          forbidden_suffixes = {'.pem', '.p12', '.pfx', '.key'}

          bad_paths = []
          for raw in tracked:
              p = pathlib.PurePosixPath(raw)
              if p.name.lower() in forbidden_names or p.suffix.lower() in forbidden_suffixes:
                  bad_paths.append(raw)

          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'(?i)\b(?:client_secret|refresh_token)\b\s*[:=]\s*["\'][^"\']{8,}'),
              re.compile(r'(?i)\bAZURE_SPEECH_KEY\b\s*[:=]\s*["\'][A-Za-z0-9+/=_-]{16,}'),
              re.compile(r'\bgh[pousr]_[A-Za-z0-9]{20,}\b'),
              re.compile(r'\bAIza[0-9A-Za-z_-]{35}\b'),
              re.compile(r'\bGOCSPX-[A-Za-z0-9_-]{20,}\b'),
          ]

          findings = []
          scan_targets = [
              p for p in tracked
              if p != '.github/workflows/repository-audit.yml'
          ]
          for raw in scan_targets:
              path = pathlib.Path(raw)
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  findings.append((raw, 'non-UTF-8 tracked file'))
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      findings.append((raw, 'likely embedded credential/secret'))
                      break

          if bad_paths:
              print('Forbidden credential-like files are tracked:')
              print('\n'.join(f'  - {p}' for p in sorted(bad_paths)))
          if findings:
              print('Potential secret findings:')
              print('\n'.join(f'  - {p}: {reason}' for p, reason in findings))
          if bad_paths or findings:
              sys.exit(1)
          PY

      - name: Verify gitignore protections
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          required = {'.clasprc.json', '.env', 'node_modules/', '*.log'}
          lines = {
              line.strip()
              for line in pathlib.Path('.gitignore').read_text(encoding='utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          }
          missing = sorted(required - lines)
          if missing:
              print('Required .gitignore entries missing:')
              print('\n'.join(f'  - {x}' for x in missing))
              sys.exit(1)
          PY

      - name: Verify clasp target
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          expected_script_id = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          data = json.loads(pathlib.Path('.clasp.json').read_text(encoding='utf-8'))

          errors = []
          if data.get('scriptId') != expected_script_id:
              errors.append('scriptId mismatch')
          if data.get('rootDir') != '':
              errors.append('rootDir must be empty')
          if data.get('skipSubdirectories') is not False:
              errors.append('skipSubdirectories must be false')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Verify Apps Script manifest policy
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path('appsscript.json').read_text(encoding='utf-8'))
          expected = {
              'timeZone': 'Asia/Tokyo',
              'runtimeVersion': 'V8',
          }

          errors = []
          for key, value in expected.items():
              if data.get(key) != value:
                  errors.append(f'{key} must be {value!r}')

          webapp = data.get('webapp') or {}
          if webapp.get('executeAs') != 'USER_DEPLOYING':
              errors.append('webapp.executeAs must be USER_DEPLOYING')
          if webapp.get('access') != 'MYSELF':
              errors.append('webapp.access must be MYSELF')
          if data.get('dependencies') != {}:
              errors.append('dependencies must remain empty')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Check R3-02 SYSTEM_TEST transaction isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          web = Path('WebApp.js').read_text(encoding='utf-8')
          fixture = Path('WebAppFixture.js').read_text(encoding='utf-8')
          client = Path('Client.html').read_text(encoding='utf-8')

          required = [
              "var H3_WEB_TEST_TXN_SHEET =\n  'listening_web_test_txn_v1';",
              "function h3CommitSystemTestTransaction_(",
              "sheet = h3RequireTestTxnSheet_(spreadsheet);",
              "LockService.getScriptLock()",
              "'PREPARED'",
              "'COMMITTED'",
              "'RECOVERY_REQUIRED'",
              "h3CaptureLearnerRuntimeSentinel_(spreadsheet)",
          ]
          for needle in required:
              if needle not in web:
                  raise SystemExit(f'R3-02 transaction invariant missing: {needle}')

          for sheet_name in [
              'listening_policy_v1',
              'listening_state_v1',
              'listening_log_v1',
              'listening_k1_ready_v1',
              'listening_set_payload_v1',
          ]:
              if sheet_name not in web:
                  raise SystemExit(f'Learner sentinel range missing: {sheet_name}')

          if "h3CommitSystemTestTransaction_(" not in fixture:
              raise SystemExit('SYSTEM_TEST grading is not routed through the transaction journal.')

          if "R3_01_POC_MEMORY_ONLY" in fixture or "receiptは非永続" in client:
              raise SystemExit('Non-persistent R3-01 receipt semantics still present.')

          if "SYSTEM_TEST_TXN_CONFLICT" in web:
              raise SystemExit('SYSTEM_TEST still blocks distinct retry fingerprints.')

          index = Path('Index.html').read_text(encoding='utf-8')
          for stale in ['id="reset"', 'id="submit"', 'id="controls"', 'id="live-summary"']:
              if stale in index:
                  raise SystemExit(f'Manual grading UI still present: {stale}')

          if "window.setTimeout(function () {\n              submitAnswers();\n            }, 80);" not in client:
              raise SystemExit('Q5 auto-submit path is missing.')

          commit_start = web.index('function h3CommitSystemTestTransaction_(')
          commit_src = web[commit_start:]
          for forbidden in [
              "getSheetByName('listening_policy_v1')",
              "getSheetByName('listening_state_v1')",
              "getSheetByName('listening_log_v1')",
              "getSheetByName('listening_k1_ready_v1')",
              "getSheetByName('listening_set_payload_v1')",
              "getSheetByName('skill_queue_v1')",
          ]:
              if forbidden in commit_src:
                  raise SystemExit(f'Forbidden direct learner-sheet access in transaction function: {forbidden}')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check Code.js
          node --check WebApp.js
          node --check WebAppFixture.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Client.html').read_text(encoding='utf-8').strip()
          if not (text.startswith('<script>') and text.endswith('</script>')):
              raise SystemExit('Client.html must contain exactly one outer <script> wrapper')
          Path('/tmp/Client.js').write_text(
              text[len('<script>'):-len('</script>')], encoding='utf-8'
          )
          PY
          node --check /tmp/Client.js

      - name: Verify audio semantic invariants
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const crypto = require('crypto');

          const source = fs.readFileSync('Code.js', 'utf8');
          const context = vm.createContext({
            console,
            Utilities: {
              DigestAlgorithm: { SHA_256: 'SHA_256' },
              Charset: { UTF_8: 'UTF_8' },
              computeDigest: (_algorithm, text) =>
                Array.from(
                  crypto.createHash('sha256')
                    .update(String(text), 'utf8')
                    .digest()
                )
            }
          });

          vm.runInContext(source, context, {
            filename: 'Code.js'
          });

          const run = expression =>
            vm.runInContext(expression, context);

          const fail = message => {
            throw new Error(message);
          };

          const assert = (condition, message) => {
            if (!condition) fail(message);
          };

          const same = (actual, expected, message) => {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              fail(
                message + '\nexpected=' + JSON.stringify(expected) +
                '\nactual=' + JSON.stringify(actual)
              );
            }
          };

          const expectThrow = (fn, message) => {
            let threw = false;
            try {
              fn();
            } catch (_error) {
              threw = true;
            }
            assert(threw, message);
          };

          const validate = (plan, section) =>
            run(
              'validateListeningAudioPlan_(' +
              JSON.stringify(JSON.stringify(plan)) + ',' +
              JSON.stringify(section) +
              ')'
            );

          const listeningSpec = (plan, versionExpression) =>
            run(
              'listeningAudioSpec_(' +
              JSON.stringify({ plan }) + ',' +
              '{voice:"JiMin",audioVersion:' +
              (versionExpression || 'HQ_LISTENING_AUDIO_VERSION') +
              '}' +
              ')'
            );

          same(
            run('HQ_VOICES'),
            [
              { label: 'Hyunsu', id: 'ko-KR-HyunsuNeural', rate: '+20%' },
              { label: 'InJoon', id: 'ko-KR-InJoonNeural', rate: '+5%' },
              { label: 'JiMin', id: 'ko-KR-JiMinNeural', rate: '+0%' },
              { label: 'YuJin', id: 'ko-KR-YuJinNeural', rate: '+0%' }
            ],
            'HQ_VOICES changed unexpectedly.'
          );

          same(
            run('HQ_K1_NUMBER_VOICE'),
            {
              label: 'Nanami',
              id: 'ja-JP-NanamiNeural',
              rate: '+0%'
            },
            'K1 number voice changed unexpectedly.'
          );

          same(
            run('HQ_K1_NUMBER_TEXTS'),
            {
              choice_number1: 'マルイチ',
              choice_number2: 'マルニ',
              choice_number3: 'マルサン',
              choice_number4: 'マルヨン'
            },
            'K1 number text mapping changed unexpectedly.'
          );

          same(
            [
              run('HQ_AUDIO_VERSION_LEGACY'),
              run('HQ_AUDIO_VERSION_V4_1200'),
              run('HQ_AUDIO_VERSION_V4_LEADING5S'),
              run('HQ_AUDIO_VERSION'),
              run('HQ_LISTENING_AUDIO_VERSION_LEADING5S'),
              run('HQ_LISTENING_AUDIO_VERSION'),
              run('HQ_LISTENING_SET_AUDIO_VERSION_LEADING5S'),
              run('HQ_LISTENING_SET_AUDIO_VERSION')
            ],
            [
              'azure-v2-24k160k-1.2s-0.65s-100ms',
              'azure-v4-24k160k-leading5s-q3dual-1.2s-0.65s-100ms',
              'azure-v4-24k160k-leading5s-q3dual-final2.1s-1.2s-0.65s-100ms',
              'azure-v5-24k160k-no-leading-q3dual-final2.1s-1.2s-0.65s-100ms',
              'azure-listening-v1-24k160k-leading5s-segments',
              'azure-listening-v2-24k160k-no-leading-segments',
              'azure-listening-set-v1-24k160k-source-locked',
              'azure-listening-set-v2-24k160k-no-leading-source-locked'
            ],
            'Audio version constants changed unexpectedly.'
          );

          const oldK1Plan = [1, 2, 3, 4].map(n => ({
            role: 'choice' + n,
            text: '한국어',
            repeat: 2,
            pause_ms_after: 3200
          }));

          validate(oldK1Plan, 'K1');

          for (const section of ['K2', 'K3', 'K4', 'K5']) {
            validate([
              {
                role: 'passage',
                text: '한국어',
                repeat: 1,
                pause_ms_after: 1200
              }
            ], section);
          }

          const newK1Plan = [];
          const numberTexts = [
            'マルイチ',
            'マルニ',
            'マルサン',
            'マルヨン'
          ];

          for (let i = 0; i < 4; i++) {
            newK1Plan.push({
              role: 'choice_number' + (i + 1),
              text: numberTexts[i],
              repeat: 1,
              pause_ms_after: 731
            });
            newK1Plan.push({
              role: 'choice' + (i + 1),
              text: '한국어',
              repeat: 2,
              pause_ms_after: 3200
            });
          }

          validate(newK1Plan, 'K1');

          expectThrow(
            () => validate([
              {
                role: 'choice_number1',
                text: 'マルイチ',
                repeat: 1,
                pause_ms_after: 700
              }
            ], 'K2'),
            'K2 accepted a K1 choice-number role.'
          );

          expectThrow(
            () => validate([
              {
                role: 'choice_number1',
                text: 'マルニ',
                repeat: 1,
                pause_ms_after: 700
              }
            ], 'K1'),
            'choice_number1 accepted mismatched text.'
          );

          expectThrow(
            () => validate([
              {
                role: 'choice_number1',
                text: 'マルイチ',
                repeat: 2,
                pause_ms_after: 700
              }
            ], 'K1'),
            'K1 choice-number role accepted repeat=2.'
          );

          expectThrow(
            () => validate([
              {
                role: 'choice1',
                text: 'マルイチ',
                repeat: 1,
                pause_ms_after: 700
              }
            ], 'K1'),
            'General role accepted Japanese number text.'
          );

          expectThrow(
            () => validate([
              {
                role: 'choice_number1',
                text: 'テスト',
                repeat: 1,
                pause_ms_after: 700
              }
            ], 'K1'),
            'K1 choice-number role accepted arbitrary Japanese.'
          );

          expectThrow(
            () => validate([
              {
                role: 'choice_number1',
                text: 'マルイチ',
                repeat: 1,
                pause_ms_after: 700,
                voice: 'ja-JP-NanamiNeural'
              }
            ], 'K1'),
            'AUDIO_PLAN_JSON accepted an extra field.'
          );

          const oldListeningSpec = listeningSpec(oldK1Plan);
          assert(
            oldListeningSpec.assignment === 'VOICE=JiMin',
            'Current Listening assignment format changed.'
          );
          assert(
            !oldListeningSpec.ssml.includes('ja-JP-NanamiNeural'),
            'Current Listening plan unexpectedly uses Japanese voice.'
          );
          assert(
            !oldListeningSpec.ssml.includes('5000ms'),
            'Current Listening audio still contains the retired 5000ms lead-in.'
          );

          const legacyLeadingListeningSpec = listeningSpec(
            oldK1Plan,
            'HQ_LISTENING_AUDIO_VERSION_LEADING5S'
          );
          assert(
            legacyLeadingListeningSpec.ssml.includes('5000ms'),
            'Legacy Listening checkpoint lost its recovery-compatible 5000ms lead-in.'
          );
          assert(
            legacyLeadingListeningSpec.fingerprint !== oldListeningSpec.fingerprint,
            'Legacy/current Listening fingerprints must remain distinct.'
          );

          const numberedListeningSpec = listeningSpec(newK1Plan);
          assert(
            numberedListeningSpec.assignment ===
              'VOICE=JiMin;NUMBER_VOICE=Nanami',
            'Numbered K1 assignment format is incorrect.'
          );
          assert(
            numberedListeningSpec.ssml.includes('ja-JP-NanamiNeural') &&
            numberedListeningSpec.ssml.includes('ko-KR-JiMinNeural'),
            'Numbered K1 SSML does not contain both Japanese and Korean voices.'
          );
          assert(
            numberedListeningSpec.ssml.includes('<break time="731ms"/>'),
            'Number gap is not sourced from pause_ms_after.'
          );
          assert(
            oldListeningSpec.fingerprint !== numberedListeningSpec.fingerprint,
            'Listening fingerprint did not change when SSML changed.'
          );

          const writtenJob = {
            audio: [
              '하나',
              '둘',
              '원문\n완성문',
              '넷',
              '다섯',
              '여섯',
              '일곱'
            ]
          };
          const voices = [
            'Hyunsu',
            'InJoon',
            'JiMin',
            'YuJin',
            'Hyunsu',
            'InJoon'
          ];

          const oldV4Spec = run(
            'audioSpec_(' +
            JSON.stringify(writtenJob) + ',' +
            JSON.stringify({
              voices,
              audioVersion:
                'azure-v4-24k160k-leading5s-q3dual-1.2s-0.65s-100ms'
            }) +
            ')'
          );

          const leadingFinalV4Spec = run(
            'audioSpec_(' +
            JSON.stringify(writtenJob) + ',' +
            JSON.stringify({
              voices,
              audioVersion:
                'azure-v4-24k160k-leading5s-q3dual-final2.1s-1.2s-0.65s-100ms'
            }) +
            ')'
          );

          assert(
            leadingFinalV4Spec.ssml.replace('2.1s', '1.2s') === oldV4Spec.ssml,
            'Historical v4 SSML differs by more than the approved final tail.'
          );
          assert(
            leadingFinalV4Spec.ssml.includes('5000ms'),
            'Historical v4 checkpoint lost its recovery-compatible lead-in.'
          );
          assert(
            leadingFinalV4Spec.fingerprint !== oldV4Spec.fingerprint,
            'Historical v4 fingerprints must remain distinct.'
          );

          const currentV5Spec = run(
            'audioSpec_(' +
            JSON.stringify(writtenJob) + ',' +
            JSON.stringify({
              voices,
              audioVersion:
                'azure-v5-24k160k-no-leading-q3dual-final2.1s-1.2s-0.65s-100ms'
            }) +
            ')'
          );
          assert(
            !currentV5Spec.ssml.includes('5000ms'),
            'Current written audio still contains the retired 5000ms lead-in.'
          );
          assert(
            currentV5Spec.ssml.includes('<break time="2.1s"/>'),
            'Current written audio lost the approved final 2.1s tail.'
          );
          assert(
            currentV5Spec.fingerprint !== leadingFinalV4Spec.fingerprint,
            'Current/legacy written fingerprints must remain distinct.'
          );

          const combinedBuilderSource = source.slice(
            source.indexOf('function combinedListeningSetSpec_'),
            source.indexOf('function locateListeningSetAudioRow_')
          );
          assert(
            !combinedBuilderSource.includes('HQ_LEADING_SILENCE_MS_LEGACY'),
            'Current combined 5L builder still injects the retired lead-in.'
          );

          const legacySpec = run(
            'audioSpec_(' +
            JSON.stringify(writtenJob) + ',' +
            JSON.stringify({ voices }) +
            ')'
          );
          assert(
            legacySpec.description.startsWith('HANGUL_AUDIO_V3:'),
            'Missing audioVersion no longer falls back to legacy written audio.'
          );
          assert(
            !legacySpec.ssml.includes('5000ms'),
            'Legacy written audio unexpectedly gained v4 leading silence.'
          );

          console.log('Audio semantic regression checks passed.');
          NODE