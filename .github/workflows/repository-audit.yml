name: Repository audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tracked-file allowlist
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          allowed = {
              '.clasp.json',
              '.gitignore',
              'Code.js',
              'WebApp.js',
              'WebAppFixture.js',
              'WebAppProduction.js',
              'WebAppTransactionCommon.js',
              'WebAppSurfaceCommon.js',
              'WebAppSurfaceCommonAudit.js',
              'WebAppLevelCommon.js',
              'WebAppLevelCommonAudit.js',
              'WebAppJun2Taxonomy.js',
              'WebAppJun2TaxonomyAudit.js',
              'WebAppFormatCommon.js',
              'WebAppFormatCommonAudit.js',
              'WebAppWrittenNewfmt.js',
              'WebAppWrittenNewfmtAudit.js',
              'WebAppWrittenProduction.js',
              'WebAppWrittenAnswerSync.js',
              'WebAppProductionRender.js',
              'WebAppReadingPilot.js',
              'WebAppReadingPilotAudit.js',
              'WebAppReadingActivation.js',
              'WebAppReadingActivationAudit.js',
              'WebAppReadingProduction.js',
              'WebAppTranslationPilot.js',
              'WebAppTranslationPilotAudit.js',
              'WebAppTranslationActivation.js',
              'WebAppTranslationActivationAudit.js',
              'WebAppTranslationProduction.js',
              'WebAppTranslationV2.js',
              'WebAppTranslationV2Audit.js',
              'WebAppTranslationV2Production.js',
              'WebAppRtSoftSignal.js',
              'WebAppMultiSkillEvidence.js',
              'WebAppMultiSkillShadow.js',
              'WebAppConceptAuthoring.js',
              'WebAppRtSoftSignalPreflight.js',
              'WebAppK1SecondaryAuthority.js',
              'WebAppRs13GateReporter.js',
              'WebAppPreissue.js',
              'WebAppReceipt.js',
              'WebAppReviewCore.js',
              'WebAppReviewListeningAdapter.js',
              'WebAppReviewPersistence.js',
              'WebAppReviewWrittenAdapter.js',
              'WebAppSurfaceReviewBridge.js',
              'WebAppSurfaceReviewBridgeAudit.js',
              'ListeningBackendOrchestrator.js',
              'ReviewAudioBackfill.js',
              'H3_WEB_CHAT_CONTRACT.md',
              'H3_REVIEW_ARCHITECTURE.md',
              'H3_REVIEW_EXPLANATION_STYLE_CONTRACT.md',
              'H3_LEARNING_SURFACE_CONTRACT.md',
              'H3_LEVEL_RUNTIME_CONTRACT.md',
              'H3_JUN2_TAXONOMY_CONTRACT.md',
              'H3_NEWFMT_LEVEL_CONTRACT.md',
              'H3_2026_NEWFMT_SOURCE_CONTRACT.md',
              'H3_WRITTEN_NEWFMT_RUNTIME_CONTRACT.md',
              'H3_READING_P8_PILOT_CONTRACT.md',
              'H3_READING_ACTIVATION_CONTRACT.md',
              'H3_READING_PRODUCTION_CONTRACT.md',
              'H3_READING_P9_P10_PILOT_CONTRACT.md',
              'H3_TRANSLATION_P11_P12_PILOT_CONTRACT.md',
              'H3_TRANSLATION_ACTIVATION_CONTRACT.md',
              'H3_TRANSLATION_PRODUCTION_CONTRACT.md',
              'H3_TRANSLATION_V2_RUNTIME_CONTRACT.md',
              'H3_RS10_SOFT_SIGNAL_CONTRACT.md',
              'H3_RS12_PROSPECTIVE_EVIDENCE_CONTRACT.md',
              'H3_RS13_REAL_DATA_SHADOW_CONTRACT.md',
              'H3_RS13E_CONCEPT_AUTHORING_CONTRACT.md',
              'H3_RS14P_LIMITED_LIVE_PREFLIGHT_CONTRACT.md',
              'H3_RS13K1_K1_SECONDARY_AUTHORITY_CONTRACT.md',
              'H3_RS13G_GATE_REPORTER_CONTRACT.md',
              'H3_RS13K1A_K1_AUTHORITY_AUTHORING_HELPER_CONTRACT.md',
              'H3_SURFACE_REVIEW_BRIDGE_CONTRACT.md',
              'Index.html',
              'Stylesheet.html',
              'Client.html',
              'appsscript.json',
              'OPERATIONS.md',
              'RECOVERY.md',
              '.github/workflows/repository-audit.yml',
              '.github/workflows/apps-script-auto-sync.yml',
              '.github/workflows/rs10-soft-signal-audit.yml',
              '.github/workflows/rs12-prospective-evidence-audit.yml',
              '.github/workflows/rs13-real-data-shadow-audit.yml',
              '.github/workflows/rs13e-concept-authoring-audit.yml',
              '.github/workflows/rs14p-limited-live-preflight-audit.yml',
              '.github/workflows/rs13k1-k1-secondary-authority-audit.yml',
              '.github/workflows/rs13g-gate-reporter-audit.yml',
              '.github/workflows/rs13k1a-authoring-helper-audit.yml',
          }
          tracked = set(
              subprocess.check_output(
                  ['git', 'ls-files'], text=True
              ).splitlines()
          )
          unexpected = sorted(tracked - allowed)
          missing = sorted({
              '.clasp.json', '.gitignore', 'Code.js',
              'WebApp.js', 'WebAppFixture.js', 'WebAppProduction.js', 'WebAppTransactionCommon.js', 'WebAppWrittenProduction.js', 'WebAppWrittenAnswerSync.js', 'ListeningBackendOrchestrator.js', 'WebAppProductionRender.js', 'WebAppPreissue.js', 'WebAppReceipt.js', 'Index.html',
              'Stylesheet.html', 'Client.html', 'appsscript.json'
          } - tracked)

          if unexpected:
              print('Unexpected tracked files:')
              print('\n'.join(f'  - {p}' for p in unexpected))
          if missing:
              print('Required tracked files missing:')
              print('\n'.join(f'  - {p}' for p in missing))
          if unexpected or missing:
              sys.exit(1)
          PY

      - name: Reject credential files and likely embedded secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ['git', 'ls-files'], text=True
          ).splitlines()

          forbidden_names = {
              '.clasprc.json',
              '.env',
              'credentials.json',
              'client_secret.json',
              'service-account.json',
          }
          forbidden_suffixes = {'.pem', '.p12', '.pfx', '.key'}

          bad_paths = []
          for raw in tracked:
              p = pathlib.PurePosixPath(raw)
              if p.name.lower() in forbidden_names or p.suffix.lower() in forbidden_suffixes:
                  bad_paths.append(raw)

          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'(?i)\b(?:client_secret|refresh_token)\b\s*[:=]\s*["\'][^"\']{8,}'),
              re.compile(r'(?i)\bAZURE_SPEECH_KEY\b\s*[:=]\s*["\'][A-Za-z0-9+/=_-]{16,}'),
              re.compile(r'\bgh[pousr]_[A-Za-z0-9]{20,}\b'),
              re.compile(r'\bAIza[0-9A-Za-z_-]{35}\b'),
              re.compile(r'\bGOCSPX-[A-Za-z0-9_-]{20,}\b'),
          ]

          findings = []
          scan_targets = [
              p for p in tracked
              if p != '.github/workflows/repository-audit.yml'
          ]
          for raw in scan_targets:
              path = pathlib.Path(raw)
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  findings.append((raw, 'non-UTF-8 tracked file'))
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      findings.append((raw, 'likely embedded credential/secret'))
                      break

          if bad_paths:
              print('Forbidden credential-like files are tracked:')
              print('\n'.join(f'  - {p}' for p in sorted(bad_paths)))
          if findings:
              print('Potential secret findings:')
              print('\n'.join(f'  - {p}: {reason}' for p, reason in findings))
          if bad_paths or findings:
              sys.exit(1)
          PY

      - name: Verify gitignore protections
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          required = {'.clasprc.json', '.env', 'node_modules/', '*.log'}
          lines = {
              line.strip()
              for line in pathlib.Path('.gitignore').read_text(encoding='utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          }
          missing = sorted(required - lines)
          if missing:
              print('Required .gitignore entries missing:')
              print('\n'.join(f'  - {x}' for x in missing))
              sys.exit(1)
          PY

      - name: Verify clasp target
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          expected_script_id = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          data = json.loads(pathlib.Path('.clasp.json').read_text(encoding='utf-8'))

          errors = []
          if data.get('scriptId') != expected_script_id:
              errors.append('scriptId mismatch')
          if data.get('rootDir') != '':
              errors.append('rootDir must be empty')
          if data.get('skipSubdirectories') is not False:
              errors.append('skipSubdirectories must be false')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Verify Apps Script manifest policy
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path('appsscript.json').read_text(encoding='utf-8'))
          expected = {
              'timeZone': 'Asia/Tokyo',
              'runtimeVersion': 'V8',
          }

          errors = []
          for key, value in expected.items():
              if data.get(key) != value:
                  errors.append(f'{key} must be {value!r}')

          webapp = data.get('webapp') or {}
          if webapp.get('executeAs') != 'USER_DEPLOYING':
              errors.append('webapp.executeAs must be USER_DEPLOYING')
          if webapp.get('access') != 'MYSELF':
              errors.append('webapp.access must be MYSELF')
          if data.get('dependencies') != {}:
              errors.append('dependencies must remain empty')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Check SYSTEM_TEST transaction isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          web = Path('WebApp.js').read_text(encoding='utf-8')
          fixture = Path('WebAppFixture.js').read_text(encoding='utf-8')
          client = Path('Client.html').read_text(encoding='utf-8')

          required = [
              "var H3_WEB_TEST_TXN_SHEET =\n  'listening_web_test_txn_v1';",
              "function h3CommitSystemTestTransaction_(",
              "sheet = h3RequireTestTxnSheet_(spreadsheet);",
              "LockService.getScriptLock()",
              "'PREPARED'",
              "'COMMITTED'",
              "'RECOVERY_REQUIRED'",
              "h3CaptureLearnerRuntimeSentinel_(spreadsheet)",
          ]
          for needle in required:
              if needle not in web:
                  raise SystemExit(f'R3-02 transaction invariant missing: {needle}')

          for sheet_name in [
              'listening_policy_v1',
              'listening_state_v1',
              'listening_log_v1',
              'listening_k1_ready_v1',
              'listening_set_payload_v1',
          ]:
              if sheet_name not in web:
                  raise SystemExit(f'Learner sentinel range missing: {sheet_name}')

          if "h3CommitSystemTestTransaction_(" not in fixture:
              raise SystemExit('SYSTEM_TEST grading is not routed through the transaction journal.')

          if "R3_01_POC_MEMORY_ONLY" in fixture or "receiptは非永続" in client:
              raise SystemExit('Non-persistent R3-01 receipt semantics still present.')

          if "SYSTEM_TEST_TXN_CONFLICT" in web:
              raise SystemExit('SYSTEM_TEST still blocks distinct retry fingerprints.')

          index = Path('Index.html').read_text(encoding='utf-8')
          for stale in ['id="reset"', 'id="submit"', 'id="controls"', 'id="live-summary"']:
              if stale in index:
                  raise SystemExit(f'Manual grading UI still present: {stale}')

          if (
              "if (allAnswered())" not in client or
              "window.setTimeout(function () {" not in client or
              "submitAnswers();" not in client
          ):
              raise SystemExit(
                  'Shared final-answer auto-submit path is missing.'
              )

          if "app.payload.mode !==\n                'WRITTEN'" in client:
              raise SystemExit(
                  'Obsolete WRITTEN manual-grade guard remains in auto-submit path.'
              )

          commit_start = web.index('function h3CommitSystemTestTransaction_(')
          commit_src = web[commit_start:]
          for forbidden in [
              "getSheetByName('listening_policy_v1')",
              "getSheetByName('listening_state_v1')",
              "getSheetByName('listening_log_v1')",
              "getSheetByName('listening_k1_ready_v1')",
              "getSheetByName('listening_set_payload_v1')",
              "getSheetByName('skill_queue_v1')",
          ]:
              if forbidden in commit_src:
                  raise SystemExit(f'Forbidden direct learner-sheet access in transaction function: {forbidden}')
          PY

      - name: Check production transaction and scheduler contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prod = Path('WebAppProduction.js').read_text(encoding='utf-8')
          required = [
              'var H3_R3_PRODUCTION_COMMIT_ENABLED = true;',
              "var H3_R3_PRODUCTION_GATE_MODE =\n  'NORMAL_LIVE_ACTIVE';",
              "'NORMAL_LIVE_PRODUCTION_GATE_MISMATCH'",
              "var H3_WEB_PROD_TXN_SHEET = 'listening_web_txn_v1';",
              'function h3ProdSubmit_(request)',
              'LockService.getScriptLock()',
              "'PREPARED'",
              "'COMMITTED'",
              "'ROLLED_BACK'",
              "'RECOVERY_REQUIRED'",
              'function h3ProdRestoreSnapshot_(',
              'function h3ProdApplyPlan_(',
              'R3_SLOT_ROLE_NOT_PERSISTED',
              'CONFLICT_ALREADY_COMMITTED',
          ]
          for needle in required:
              if needle not in prod:
                  raise SystemExit(f'R3-03 invariant missing: {needle}')

          if 'H3_R3_PRODUCTION_COMMIT_SET_ID' in prod or 'R3_08_PRODUCTION_SET_NOT_ARMED' in prod:
              raise SystemExit('Retired exact-one-set production arm remains in current production code.')

          web = Path('WebApp.js').read_text(encoding='utf-8')
          fixture = Path('WebAppFixture.js').read_text(encoding='utf-8')
          client = Path('Client.html').read_text(encoding='utf-8')
          if 'h3ProdSubmit_(' in fixture or 'h3ProdSubmit_(' in client:
              raise SystemExit('Production submit leaked into fixture/client surface.')
          if "request.mode === 'LISTENING'" not in web:
              raise SystemExit('R3-05 production route is missing.')
          PY

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const source = fs.readFileSync('WebAppProduction.js', 'utf8');
          const context = vm.createContext({ console });
          vm.runInContext(source, context, { filename: 'WebAppProduction.js' });

          const run = expression => vm.runInContext(expression, context);
          const fail = message => { throw new Error(message); };
          const assert = (cond, message) => { if (!cond) fail(message); };

          const synthetic = {
            setId: 'H3-SYNTH-L02',
            setNo: 1,
            answerKey: {K1:3,K2:2,K3:2,K4:3,K5:3},
            itemPayloadSha256: 'payload',
            sourceProvenance: {
              K1:{slot_role:'PRIMARY'},
              K2:{slot_role:'PRIMARY'},
              K3:{slot_role:'PRIMARY'},
              K4:{slot_role:'PRIMARY'},
              K5:{slot_role:'PRIMARY'}
            },
            policyMap: {
              ACTIVE_WRONG_CAP:'3',
              BASELINE1_END:'2',
              BASELINE2_END:'4'
            },
            stateMap: {},
            logTable: {
              map: {
                SKILL_ID:0,
                SOURCE_PROVENANCE:1,
                SURFACE_HASH:2,
                USER_RESULT:3,
                STATUS:4,
                LISTENING_ISSUE_NO:5
              },
              rows: []
            },
            logRows: []
          };

          ['K1','K2','K3','K4','K5'].forEach((section, i) => {
            const row = [
              'H3-' + section + '-SK001',
              'SYNTH',
              'surface-' + section,
              '',
              'VALID',
              '1'
            ];
            synthetic.logTable.rows.push(row);
            synthetic.logRows.push({rowNumber:i+2,row});
            synthetic.stateMap[section + '_VALID_COUNT'] = {
              rowNumber: 10+i,
              value:'0'
            };
            synthetic.stateMap['LAST_' + section + '_ISSUE'] = {
              rowNumber: 20+i,
              value:'0'
            };
          });
          [
            ['LISTENING_ISSUE_NO','0'],
            ['PHASE','BASELINE_1'],
            ['ACTIVE_WRONG_COUNT','0'],
            ['OVERLOAD_STATUS',''],
            ['LAST_UPDATED_AT',''],
            ['NEXT_SET_COMPOSITION','K1,K2,K3,K4,K5'],
            ['NEXT_LISTENING_SET_NO','1'],
            ['LAST_LISTENING_SET_ID',''],
            ['ANSWER_SYNC_PHASE','IDLE']
          ].forEach(([key,value], i) => {
            synthetic.stateMap[key] = {rowNumber:30+i,value};
          });

          context.__ctx = synthetic;
          context.__answers = [
            {section:'K1',answer:3,uncertain:false},
            {section:'K2',answer:1,uncertain:false},
            {section:'K3',answer:3,uncertain:false},
            {section:'K4',answer:2,uncertain:false},
            {section:'K5',answer:2,uncertain:false}
          ];

          const plan = run("h3ProdBuildPlan_(__ctx,__answers,'2026-09-19T12:38:44+09:00')");

          assert(plan.score === 1, 'Synthetic L02 score must be 1/5.');
          assert(plan.activeWrongCount === 4, 'Synthetic L02 active wrong count must be 4.');
          assert(plan.overload === true, 'Synthetic L02 must enter overload.');
          assert(plan.stateValues.OVERLOAD_STATUS === 'LISTENING_OVERLOAD_PLAN_READY',
                 'Synthetic L02 overload status mismatch.');
          const syntheticSchedulerPlan = JSON.parse(
            plan.stateValues.OVERLOAD_PLAN_JSON
          );
          assert(
            syntheticSchedulerPlan.schema === 'H3_LISTENING_OVERLOAD_PLAN_V3',
            'Synthetic L02 scheduler schema mismatch.'
          );
          assert(
            syntheticSchedulerPlan.next_set_no === 2,
            'Synthetic L02 scheduler next set mismatch.'
          );
          assert(
            syntheticSchedulerPlan.blocking_overflow.length === 0,
            'Synthetic L02 scheduler should be feasible.'
          );
          assert(
            syntheticSchedulerPlan.normal_retest_per_set_cap === 2,
            'Synthetic L02 overload retest cap must be 2.'
          );
          assert(plan.stateValues.NEXT_LISTENING_SET_NO === '2',
                 'Synthetic L02 next set must be 2.');
          assert(plan.stateValues.PHASE === 'BASELINE_1',
                 'Synthetic L02 phase mismatch.');

          for (const section of ['K1','K2','K3','K4','K5']) {
            assert(plan.stateValues[section + '_VALID_COUNT'] === '1',
                   section + ' primary count mismatch.');
          }

          for (const section of ['K2','K3','K4','K5']) {
            const row = plan.logWrites.find(x => x.section === section);
            assert(row.queue_update_status === 'OVERLOAD_REVIEW_REQUIRED',
                   section + ' overload queue status mismatch.');
            assert(row.provenance.retest.required === true,
                   section + ' retest should be required.');
            assert(row.provenance.retest.due_min_set_no === 2,
                   section + ' due_min mismatch.');
            assert(row.provenance.retest.due_max_set_no === 4,
                   section + ' due_max mismatch.');
          }

          const k1 = plan.logWrites.find(x => x.section === 'K1');
          assert(k1.queue_update_status === 'NO_RETEST', 'K1 should not require retest.');
          assert(k1.provenance.retest.required === false, 'K1 retest evidence mismatch.');
          NODE

      - name: Check Web receipt and targeted dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          code = Path('Code.js').read_text(encoding='utf-8')
          web = Path('WebApp.js').read_text(encoding='utf-8')
          prod = Path('WebAppProduction.js').read_text(encoding='utf-8')
          receipt = Path('WebAppReceipt.js').read_text(encoding='utf-8')
          ops = Path('OPERATIONS.md').read_text(encoding='utf-8')
          contract = Path('H3_WEB_CHAT_CONTRACT.md').read_text(encoding='utf-8')

          required_code = [
              'function processPendingAudioForSet(',
              "normalizedMode !== '5W'",
              "normalizedMode !== '5L'",
              'targetSetId',
              'locate_(',
              'collectListeningSetRows_(',
          ]
          for needle in required_code:
              if needle not in code:
                  raise SystemExit(f'R3-04 targeted dispatch invariant missing: {needle}')

          if 'function processLatestPendingAudioJob()' not in code:
              raise SystemExit('One-minute fallback entry point was removed.')

          if 'h3BuildWebReceipt_(core.set_id, txnId)' not in web:
              raise SystemExit('SYSTEM_TEST is not using the shared receipt formatter.')
          if 'h3BuildWebReceipt_(context.setId, txnId)' not in prod:
              raise SystemExit('Production is not using the shared receipt formatter.')

          for needle in [
              '[H3_WEB_SYNC]',
              'STATUS=COMMITTED',
              'H3TX-',
              'function h3ParseWebReceipt_(',
          ]:
              if needle not in receipt:
                  raise SystemExit(f'Receipt contract invariant missing: {needle}')

          for needle in ['K1', '5L', '5W', '5Q', 'DEPRECATED']:
              if needle not in contract:
                  raise SystemExit(f'Trigger contract invariant missing: {needle}')

          if 'processPendingAudioForSet(mode, setId)' not in ops:
              raise SystemExit('Operations policy lacks targeted audio dispatch.')
          if 'deprecated for new learner requests' not in ops:
              raise SystemExit('Operations policy does not deprecate 5Q.')

          if 'H3_R3_PRODUCTION_COMMIT_ENABLED = true' not in prod or "'NORMAL_LIVE_ACTIVE'" not in prod:
              raise SystemExit('R3-11 normal-live production commit gate is missing.')
          PY

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('WebAppReceipt.js', 'utf8');
          const ctx = vm.createContext({});
          vm.runInContext(source, ctx, {filename:'WebAppReceipt.js'});

          const receipt = vm.runInContext(
            "h3BuildWebReceipt_('H3-20260919-L03','H3TX-20260919-000123')",
            ctx
          );
          const expected = [
            '[H3_WEB_SYNC]',
            'SET_ID=H3-20260919-L03',
            'TXN_ID=H3TX-20260919-000123',
            'STATUS=COMMITTED'
          ].join('\n');

          if (receipt !== expected) {
            throw new Error('R3-04 receipt serialization mismatch.');
          }

          ctx.__receipt = receipt;
          const parsed = vm.runInContext('h3ParseWebReceipt_(__receipt)', ctx);
          if (
            parsed.set_id !== 'H3-20260919-L03' ||
            parsed.txn_id !== 'H3TX-20260919-000123' ||
            parsed.status !== 'COMMITTED'
          ) {
            throw new Error('R3-04 receipt parser mismatch.');
          }

          let failed = false;
          try {
            vm.runInContext(
              "h3ParseWebReceipt_('[H3_WEB_SYNC]\\nSET_ID=X\\nTXN_ID=bad\\nSTATUS=COMMITTED')",
              ctx
            );
          } catch (_e) {
            failed = true;
          }
          if (!failed) {
            throw new Error('Malformed receipt was accepted.');
          }
          NODE
      - name: Check production rendering and source-lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          code = Path('Code.js').read_text(encoding='utf-8')
          web = Path('WebApp.js').read_text(encoding='utf-8')
          render = Path('WebAppProductionRender.js').read_text(encoding='utf-8')
          prod = Path('WebAppProduction.js').read_text(encoding='utf-8')

          required = [
              "H3-LISTENING-RENDER-RULES-20260920-V21",
              "H3-L5E2E-R3-WEB-SURFACE-CONTRACT-20260919-V1",
              'function buildProductionRenderPayload_(',
              'function getProductionMediaPayload_(',
              'function buildProductionReviewPayload_(',
              "PERSISTENT_REVIEW_V1",
          ]
