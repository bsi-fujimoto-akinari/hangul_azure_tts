          };
          clientApi.app.payload = {
            mode: 'REVIEW'
          };

          let calls = installRunSequence([
            {
              type: 'success',
              value: {
                schema:
                  'H3_REVIEW_COMPLETE_RESULT_V2',
                status: 'ERROR',
                error_class: 'VALIDATION',
                retryable: false
              }
            }
          ]);
