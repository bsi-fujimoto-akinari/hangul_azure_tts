          if (plan.active_wrong_count !== 5) {
            throw new Error('R3-10B active count mismatch');
          }
          if (plan.ordered_due.join(',') !== expectedOrder) {
            throw new Error(
              'R3-10B EDF order mismatch: ' +
              plan.ordered_due.join(',')
            );
          }

          const scheduled = plan.normal_retests
            .map(x => x.set_no + ':' + x.section)
            .join(',');
          if (
            scheduled !==
            '3:K4,4:K1,5:K3,6:K2,7:K5'
          ) {
            throw new Error(
              'R3-10B normal schedule mismatch: ' +
              scheduled
            );
          }
          if (plan.supplemental !== null) {
            throw new Error('R3-10B unexpected supplemental');
          }
          if (plan.blocking_overflow.length !== 0) {
            throw new Error('R3-10B unexpected blocking overflow');
          }

          const preissue = fs.readFileSync(
            'WebAppPreissue.js',
