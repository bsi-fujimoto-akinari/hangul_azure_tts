name: Family Scheduler F3 Shadow Audit

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check WebAppFamilyScheduler.js

      - name: Contract audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("WebAppFamilyScheduler.js")
          text = p.read_text(encoding="utf-8")
          required = [
              "family_scheduler_state_v1",
              "family_scheduler_decision_log_v1",
              "h3FamilySchedulerShadowPreview",
              "h3FamilySchedulerShadowTick",
              "P1_RETEST_ADVANCE",
              "P2_STARVATION",
              "P3_BALANCE",
              "P4_COVERAGE",
              "P5_SKILL_PRESSURE",
              "P6_TIEBREAK",
              "scheduler not applied to issue selection",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing contract token: {token}")
          forbidden = [
              "SCHEDULER_APPLIED,true",
              "SCHEDULER_APPLIED: true",
              "issueProductionSet(",
              "issueReading",
              "issueTranslation",
              "issueListening",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"F3 live-wiring token present: {token}")
          print("F3 static contract PASS")
          PY

      - name: F4 shadow observation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")
          web = Path("WebApp.js").read_text(encoding="utf-8")

          required = [
              "H3_FS_F4_START_CLOCK_ = 27",
              "H3_FS_F4_TARGET_COMMITS_ = 20",
              "function h3FamilySchedulerObserveAfterCommit_(",
              "function h3FamilySchedulerF4Status()",
              "COMMIT_OBSERVED",
              "F4 SHADOW observation",
              "status:'RECOVERY_REQUIRED'",
              "scheduler_applied:false",
          ]
          for token in required:
              if token not in fs:
                  raise SystemExit(f"missing F4 contract token: {token}")

          if web.count("h3FamilySchedulerObserveAfterCommit_(") != 4:
              raise SystemExit("F4 must wire exactly four family post-commit hooks.")

          for family in ["'L'", "'W'", "'R'", "'T'"]:
              if family not in web:
                  raise SystemExit(f"family hook missing: {family}")

          if fs.count("appendRow([") != 2:
              raise SystemExit("Family scheduler writes must remain two append-only log paths.")
          if fs.count(".setValues(") != 1:
              raise SystemExit("Family scheduler current-state write surface changed unexpectedly.")

          forbidden = [
              "issueProductionSet(",
              "issueReading",
              "issueTranslation",
              "issueListening",
              "SCHEDULER_APPLIED,true",
              "SCHEDULER_APPLIED: true",
          ]
          for token in forbidden:
              if token in fs:
                  raise SystemExit(f"F4 live-selection token present: {token}")

          # Hook must occur only after lightweight HOME index persistence.
          listening_sync = web.index("result.home_index_sync =")
          listening_obs = web.index("result.family_scheduler_shadow =")
          if not listening_sync < listening_obs:
              raise SystemExit("Listening observer precedes HOME commit sync.")

          reading_sync = web.index("readingResult.home_index_sync =")
          reading_obs = web.index("readingResult.family_scheduler_shadow =")
          if not reading_sync < reading_obs:
              raise SystemExit("Reading observer precedes HOME commit sync.")

          translation_sync = web.index("translationResult.home_index_sync =")
          translation_obs = web.index("translationResult.family_scheduler_shadow =")
          if not translation_sync < translation_obs:
              raise SystemExit("Translation observer precedes HOME commit sync.")

          written_sync = web.index("writtenResult.home_index_sync =")
          written_obs = web.index("writtenResult.family_scheduler_shadow =")
          if not written_sync < written_obs:
              raise SystemExit("Written observer precedes HOME commit sync.")

          print("F4 shadow observation contract PASS")
          PY

      - name: F5 HOME read-only preview contract
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("Index.html").read_text(encoding="utf-8")
          fs = Path("WebAppFamilyScheduler.js").read_text(encoding="utf-8")

          required = [
              "family-scheduler-launcher",
              "family-scheduler-actions",
              "family-scheduler-button",
              "family-scheduler-next",
              "family-scheduler-next-family",
              "family-scheduler-family-group",
              "nextCaption.textContent",
              "'NEXT'",
              "'L'",
              "'W'",
              "'R'",
              "'T'",
              "nextButton.disabled = true",
              "button.disabled = true",
              "aria-disabled",
              "home.insertBefore(",
              "review",
              "new MutationObserver(",
              "repeat(4, minmax(0, 1fr))",
              ".h3FamilySchedulerShadowPreview()",
          ]
          for token in required:
              if token not in index:
                  raise SystemExit(f"missing F5 read-only UI token: {token}")

          if index.count("family-scheduler-launcher") < 3:
              raise SystemExit("F5 launcher style/injection contract incomplete.")

          preview_start = index.index("(function () {")
          preview = index[preview_start:]

          if preview.count(".h3FamilySchedulerShadowPreview()") != 1:
              raise SystemExit("F5 must use exactly one read-only scheduler preview RPC per launcher render.")

          forbidden = [
              "h3FamilySchedulerShadowTick",
              "h3FamilySchedulerObserveAfterCommit_",
              "submitListeningWebAnswers",
              "submitWrittenWebAnswers",
              "submitReadingWebAnswers",
              "submitTranslationWebAnswers",
          ]
          for token in forbidden:
              if token in preview:
                  raise SystemExit(f"F5 read-only boundary violated: {token}")

          if "addEventListener" in preview:
              raise SystemExit("F5 family buttons must not have click handlers.")

          if index.index("family-scheduler-launcher") > index.index("</head>"):
              raise SystemExit("F5 preview styles must load before body render.")

          fs_preview_start = fs.index("function h3FamilySchedulerShadowPreview()")
          fs_preview_end = fs.index("function h3FamilySchedulerShadowTick()", fs_preview_start)
          fs_preview = fs[fs_preview_start:fs_preview_end]
          for token in [
              "appendRow",
              ".setValue(",
              ".setValues(",
              "h3FsAppend_(",
              "h3FsWriteState_(",
          ]:
              if token in fs_preview:
                  raise SystemExit(f"Shadow preview RPC must remain read-only: {token}")

          print("F5 HOME read-only preview PASS")
          PY

      - name: Deterministic ranking fixture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          vm.runInThisContext(fs.readFileSync('WebAppFamilyScheduler.js','utf8'));

          const base = {
            retest_advance_slack: null,
            retest_origin_result: '',
            coverage_shortfall: null
          };
          const L = {...base,family:'L',sets_since_last:7,starvation_cap:6,projected_balance_loss:.32,skill_pressure_vector:[2,0,0],last_global_clock:20};
          const W = {...base,family:'W',sets_since_last:6,starvation_cap:6,projected_balance_loss:.12,skill_pressure_vector:[2,2,2],last_global_clock:21};
          const R = {...base,family:'R',sets_since_last:1,starvation_cap:7,projected_balance_loss:.22,skill_pressure_vector:[2,0,0],last_global_clock:26};
          const T = {...base,family:'T',sets_since_last:0,starvation_cap:7,projected_balance_loss:.22,skill_pressure_vector:[1,2,0],last_global_clock:27};
          const a = [T,R,W,L].sort(h3FsCmp_);
          if (a.map(x=>x.family).join(',') !== 'L,W,R,T') throw new Error('baseline order mismatch');
          if (h3FsReason_(a[0],a[1]) !== 'P2_STARVATION') throw new Error('baseline reason mismatch');

          const Rp1 = {...R,retest_advance_slack:0,retest_origin_result:'×'};
          const b = [L,W,Rp1,T].sort(h3FsCmp_);
          if (b[0].family !== 'R') throw new Error('P1 must dominate');
          if (h3FsReason_(b[0],b[1]) !== 'P1_RETEST_ADVANCE') throw new Error('P1 reason mismatch');

          const R_due5 = {...R,retest_advance_slack:1,retest_origin_result:'×',retest_local_due_max:5,_retest_origin_global:10};
          const T_due6 = {...T,retest_advance_slack:1,retest_origin_result:'×',retest_local_due_max:6,_retest_origin_global:1};
          const c = [T_due6,R_due5].sort(h3FsCmp_);
          if (c[0].family !== 'R') throw new Error('P1 due_max tie-break mismatch');
          if (h3FsReason_(c[0],c[1]) !== 'P1_RETEST_ADVANCE') throw new Error('P1 due_max reason mismatch');

          const R_old = {...R,retest_advance_slack:1,retest_origin_result:'×',retest_local_due_max:5,_retest_origin_global:8};
          const T_new = {...T,retest_advance_slack:1,retest_origin_result:'×',retest_local_due_max:5,_retest_origin_global:9};
          const d = [T_new,R_old].sort(h3FsCmp_);
          if (d[0].family !== 'R') throw new Error('P1 origin-global tie-break mismatch');

          const L_equal = {...L,sets_since_last:6,starvation_cap:6,last_global_clock:20,projected_balance_loss:.50};
          const W_equal = {...W,sets_since_last:6,starvation_cap:6,last_global_clock:21,projected_balance_loss:.01};
          const e = [W_equal,L_equal].sort(h3FsCmp_);
          if (e[0].family !== 'L') throw new Error('P2 oldest-family tie-break mismatch');
          if (h3FsReason_(e[0],e[1]) !== 'P2_STARVATION') throw new Error('P2 tie-break reason mismatch');

          const existing = [{
            obligation_key:'old',
            skill_id:'SK1',
            direction:'',
            origin_result:'×'
          }];
          const replacement = [{
            obligation_key:'new',
            skill_id:'SK1',
            direction:'',
            origin_result:'△'
          },{
            obligation_key:'other',
            skill_id:'SK2',
            direction:'',
            origin_result:'×'
          }];
          const merged = h3FsMergeObligations_(existing,replacement);
          if (merged.length !== 2) throw new Error('F4 obligation merge count mismatch');
          if (!merged.some(x=>x.obligation_key==='new')) throw new Error('F4 newer obligation did not replace prior obligation');
          if (merged.some(x=>x.obligation_key==='old')) throw new Error('F4 stale obligation survived replacement');

          const originalOpen = h3FsOpenObligations_;
          h3FsOpenObligations_ = () => ({
            'W-SK|': {
              skill_id:'W-SK',
              direction:'',
              section:'D2',
              mark:'×',
              gap_min:1,
              gap_max:3,
              last_set_id:'SET-W'
            }
          });
          const wObs = h3FsNewCommitObligations_(
            {},
            'W',
            {set_id:'SET-W',set_no:19,commit_key:'W|SET-W|NOW'},
            28,
            19
          );
          if (wObs.length !== 1) throw new Error('F4 W obligation creation mismatch');
          if (wObs[0].local_due_min !== 20 || wObs[0].local_due_max !== 22) throw new Error('F4 W local due conversion mismatch');
          if (wObs[0].global_service_deadline !== 31) throw new Error('F4 W global deadline mismatch');

          h3FsOpenObligations_ = () => ({
            'T-SK|JP_TO_KR': {
              skill_id:'T-SK',
              direction:'JP_TO_KR',
              section:'',
              mark:'△',
              local_due_min:6,
              local_due_max:9,
              origin_family_clock:4,
              last_set_id:'SET-T'
            }
          });
          const tObs = h3FsNewCommitObligations_(
            {},
            'T',
            {set_id:'SET-T',set_no:4,commit_key:'T|SET-T|NOW'},
            29,
            4
          );
          if (tObs.length !== 1) throw new Error('F4 T obligation creation mismatch');
          if (tObs[0].global_service_deadline !== 34) throw new Error('F4 triangle global deadline mismatch');
          if (tObs[0].local_due_min !== 6 || tObs[0].local_due_max !== 9) throw new Error('F4 T local due mismatch');
          h3FsOpenObligations_ = originalOpen;

          console.log('F3/F4 deterministic ranking PASS');
          NODE
