          python3 - <<'PY'
          import hashlib, json

          sample = {
              "ko": "예매",
              "ja": "前売り",
              "nested": {"b": 2, "a": "수영장"},
          }

          def canonical(v):
              if isinstance(v, list):
                  return [canonical(x) for x in v]
              if isinstance(v, dict):
                  return {k: canonical(v[k]) for k in sorted(v)}
              return v

          text = json.dumps(
              canonical(sample),
              ensure_ascii=False,
              separators=(',', ':'),
          )
