name: Apps Script auto-sync

on:
  workflow_run:
    workflows: ["Repository audit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-auto-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout audited main source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 2

      - name: Verify checked-out source is main lineage
        shell: bash
        run: |
          git fetch origin main --depth=2
          if ! git merge-base --is-ancestor HEAD origin/main &&              ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Checked-out source is not on main lineage."
            exit 1
          fi

      - name: Detect Apps Script-impacting change
        id: impact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              *.js|*.gs|*.html|appsscript.json)
                changed=true
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r HEAD)

          if git log -1 --pretty=%B | grep -Fq '[e2-review-audio-pilot]'; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check clasp credential availability
        if: steps.impact.outputs.changed == 'true'
        id: auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON is not configured. Apps Script sync is skipped safely."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize clasp credentials
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ.get('CLASPRC_JSON', '')
          if not value.strip():
              raise SystemExit('CLASPRC_JSON is empty')

          path = Path.home() / '.clasprc.json'
          path.write_text(value, encoding='utf-8')
          path.chmod(0o600)
          PY


      - name: Verify exact Apps Script target
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          data = json.loads(Path('.clasp.json').read_text(encoding='utf-8'))
          actual = data.get('scriptId')
          if actual != expected:
              raise SystemExit(f'Apps Script target mismatch: {actual!r}')
          PY

      - name: Show Apps Script file status
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 show-file-status --json

      - name: Push audited main to Apps Script HEAD
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          output="$(npx -y @google/clasp@3.4.0 push --force 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Skipping push'; then
            echo "::error::clasp skipped the push."
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Eq '^Pushed (one|[0-9]+) file|^Pushed no files|^Script is already up to date[.]$'; then
            echo "::error::clasp did not report a completed push."
            exit 1
          fi

      - name: Run Review audio family1 pilot
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          if ! git log -1 --pretty=%B | grep -Fq '[e2-review-audio-pilot]'; then
            echo 'E2 pilot marker absent; skipped.'
            exit 0
          fi

          start_ts="$(date +%s)"
          npx -y @google/clasp@3.4.0 run-function \
            runReviewAudioPilotFamily1 \
            --nondev \
            --user default \
            --json > /tmp/e2-review-audio-pilot.json
          end_ts="$(date +%s)"

          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('/tmp/e2-review-audio-pilot.json').read_text(encoding='utf-8'))
          response=data.get('response')
          error=data.get('error')
          if error:
              raise SystemExit(f'E2 pilot returned error: {error!r}')
          if not isinstance(response, dict):
              raise SystemExit(f'Unexpected E2 pilot response type: {type(response).__name__}')
          if response.get('schema') != 'H3_REVIEW_AUDIO_PILOT_FAMILY1_V1':
              raise SystemExit(f'Unexpected E2 pilot schema: {response.get("schema")!r}')
          if response.get('target_count') != 3:
              raise SystemExit(f'Unexpected E2 pilot target_count: {response.get("target_count")!r}')

          expected={'5W':5,'2R':3,'2T':2}
          seen={}
          for item in response.get('results') or []:
              fam=item.get('family')
              count=item.get('asset_count')
              seen[fam]=count
              if fam not in expected or count != expected[fam]:
                  raise SystemExit(f'Unexpected E2 family count: {fam!r}={count!r}')
              rows=item.get('results') or []
              if len(rows) != count:
                  raise SystemExit(f'Unexpected E2 result length for {fam}: {len(rows)} != {count}')
              for row in rows:
                  if row.get('status') != 'DONE':
                      raise SystemExit(f'Non-DONE E2 result: {row!r}')
                  if not row.get('file_id') or not row.get('audio_url') or not row.get('audio_text_sha256'):
                      raise SystemExit(f'Incomplete E2 result: {row!r}')

          if seen != expected:
              raise SystemExit(f'E2 family counts mismatch: {seen!r}')

          print('e2_review_audio_pilot=PASS')
          print('pilot_target_count=3')
          print('pilot_asset_count=10')
          print('family_5w_count=5')
          print('family_2r_count=3')
          print('family_2t_count=2')
          print('all_status_done=true')
          print('secret_values_printed=false')
          PY

          echo "pilot_wall_seconds=$((end_ts-start_ts))"

      - name: Read deployment inventory
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 list-deployments


      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apps Script auto-sync"
            echo ""
            echo "- source: $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "- Apps Script-impacting change: ${{ steps.impact.outputs.changed || 'unknown' }}"
            echo "- clasp credential ready: ${{ steps.auth.outputs.ready || 'not-needed' }}"
            echo "- target script ID: 1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-"
            echo '- manifest overwrite mode: audited CI only (clasp push --force)'
            echo '- versioned /exec deployment: not changed by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
