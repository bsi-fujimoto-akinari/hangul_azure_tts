name: RS13G Gate Reporter Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    name: rs13g-gate-reporter-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RS-13G read-only gate reporter
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');

          const evidence=fs.readFileSync('WebAppMultiSkillEvidence.js','utf8');
          const shadow=fs.readFileSync('WebAppMultiSkillShadow.js','utf8');
          const preflight=fs.readFileSync('WebAppRtSoftSignalPreflight.js','utf8');
          const reporter=fs.readFileSync('WebAppRs13GateReporter.js','utf8');

          const context={console,JSON,Number,String,Object,Array,Math,Date};
          context.globalThis=context;
          vm.createContext(context);
          vm.runInContext(evidence,context);
          vm.runInContext(shadow,context);
          vm.runInContext(preflight,context);
          vm.runInContext(reporter,context);

          assert.strictEqual(
            context.H3_RS13G_CONTRACT_ID_,
            'H3-RS13G-GATE-REPORTER-20260922-V1'
          );

          const eh=context.H3_MULTI_SKILL_HEADERS_;
          const ch=context.H3_MULTI_SKILL_CONCEPT_HEADERS_;
          const sh=context.H3_MULTI_SKILL_SHADOW_HEADERS_;

          function row(headers,obj){
            return headers.map(k =>
              Object.prototype.hasOwnProperty.call(obj,k) ? obj[k] : ''
            );
          }

          function concept(id,skill,family,section){
            return row(ch,{
              CONCEPT_ID:id,
              LEVEL:'3級',
              CONCEPT_DOMAIN:id.startsWith('VOCAB:')?'VOCABULARY':'EXPRESSION',
              CONCEPT_LABEL:id.split(':')[1],
              SKILL_ID:skill,
              FAMILY:family,
              SECTION_KEY:section,
              APPLICATION_LABEL:id.split(':')[1],
              MAPPING_ROLE:'APPLICATION_SKILL',
              MATCH_TYPE:id.startsWith('VOCAB:')?'EXACT_LEXEME_MATCH':'EXACT_EXPRESSION_SEMANTICS',
              CONFIDENCE:'HIGH',
              DIRECT_REUSE:'NO',
              STATE_TRANSFER:'NO',
              RETEST_CLOSURE:'NO',
              STABILITY_TRANSFER:'NO',
              SCHEDULER_USE:'DIAGNOSTIC_SELECTION_ONLY',
              STATUS:'ACTIVE_PILOT'
            });
          }

          const concepts=[
            ch,
            concept('VOCAB:열쇠','H3-P2-SK031','WRITTEN','H3-P2'),
            concept('EXPR:마음을_놓다','H3-P4-SK014','WRITTEN','H3-P4')
          ];

          function evidenceRow(i,options){
            const o=Object.assign({
              event:'E'+i,
              sourceFamily:'LISTENING',
              targetSkill:'H3-P2-SK031',
              conceptId:'VOCAB:열쇠',
              result:'○'
            },options||{});
            const linkId='MSL|'+o.event+'|CONTRIBUTORY|'+
              o.targetSkill+'|'+o.conceptId;
            return row(eh,{
              LINK_ID:linkId,
              EVIDENCE_EVENT_ID:o.event,
              LEVEL:'3級',
              EVENT_SCOPE:'COMMITTED_LEARNING',
              SOURCE_EVENT_REF:'LISTENING|TX'+i+'|K2',
              SOURCE_SET_ID:'SET'+i,
              SOURCE_TXN_ID:'TX'+i,
              SOURCE_Q_NO:'2',
              SOURCE_SURFACE_KEY:'SURFACE'+i,
              SOURCE_RESULT:o.result,
              SOURCE_FAMILY:o.sourceFamily,
              DIRECT_SKILL_ID:'H3-K2-SK999',
              LINK_ROLE:'CONTRIBUTORY',
              TARGET_SKILL_ID:o.targetSkill,
              CONCEPT_ID:o.conceptId,
              CONFIDENCE:'HIGH',
              PROVENANCE_KIND:'AUTHOR_VERIFIED_EXACT',
              PROVENANCE_REF:'fixture',
              DIRECT_STATE_AUTHORITY:'NO',
              STATE_TRANSFER:'NO',
              RETEST_CLOSURE_TRANSFER:'NO',
              STABILITY_TRANSFER:'NO',
              SCHEDULER_USE:'DIAGNOSTIC_ONLY',
              STATUS:'ACTIVE_COMMITTED',
              CREATED_AT:'2026-09-22T12:00:0'+Math.min(i,9)+'+09:00',
              NOTES:'fixture'
            });
          }

          const zero=context.h3Rs13gBuildReportFromValues_(
            [eh],
            concepts,
            [sh]
          );
          assert.strictEqual(zero.read_only,true);
          assert.strictEqual(zero.writes_performed,0);
          assert.strictEqual(zero.evidence.committed_rows,0);
          assert.strictEqual(zero.reconciliation.exact,true);
          assert.strictEqual(zero.rs13.state,'AWAIT_REAL_DATA');
          assert.strictEqual(zero.rs13.explicit_review_ready,false);
          assert.strictEqual(zero.rs14p.activation_gate.gate_pass,false);
          assert(zero.rs14p.activation_gate.reasons.includes(
            'INSUFFICIENT_DISTINCT_EVENTS'
          ));

          const oneEvidence=[eh,evidenceRow(1,{result:'×'})];
          const oneExpected=context.h3MultiSkillShadowBuildRowsFromValues_(
            oneEvidence,concepts
          );
          const one=context.h3Rs13gBuildReportFromValues_(
            oneEvidence,
            concepts,
            [sh].concat(oneExpected)
          );
          assert.strictEqual(one.reconciliation.exact,true);
          assert.strictEqual(one.reconciliation.expected_observation_rows,1);
          assert.strictEqual(one.reconciliation.actual_observation_rows,1);
          assert.strictEqual(one.rs13.state,'EXPLICIT_REVIEW_READY');
          assert.strictEqual(one.rs13.explicit_review_ready,true);
          assert.strictEqual(one.rs13.close_automatic,false);
          assert.strictEqual(one.rs14p.activation_gate.gate_pass,false);
          assert.strictEqual(one.rs14p.progress.distinct_events.current,1);
          assert.strictEqual(one.rs14p.progress.distinct_events.remaining,5);

          const missing=context.h3Rs13gBuildReportFromValues_(
            oneEvidence,
            concepts,
            [sh]
          );
          assert.strictEqual(missing.reconciliation.exact,false);
          assert.strictEqual(missing.reconciliation.missing_observation_ids.length,1);
          assert.strictEqual(missing.rs13.state,'RECONCILIATION_REQUIRED');
          assert.strictEqual(
            missing.rs14p.activation_gate.gate_pass,
            false
          );
          assert(
            missing.rs14p.activation_gate.reasons.includes(
              'RS13_RECONCILIATION_NOT_EXACT'
            )
          );

          const sixEvidence=[eh];
          for(let i=1;i<=6;i++){
            sixEvidence.push(evidenceRow(i,{
              sourceFamily:i%2?'LISTENING':'TRANSLATION',
              targetSkill:i<=3?'H3-P2-SK031':'H3-P4-SK014',
              conceptId:i<=3?'VOCAB:열쇠':'EXPR:마음을_놓다',
              result:i===1?'×':'○'
            }));
          }
          const sixExpected=context.h3MultiSkillShadowBuildRowsFromValues_(
            sixEvidence,concepts
          );
          const six=context.h3Rs13gBuildReportFromValues_(
            sixEvidence,
            concepts,
            [sh].concat(sixExpected)
          );
          assert.strictEqual(six.reconciliation.exact,true);
          assert.strictEqual(six.rs13.explicit_review_ready,true);
          assert.strictEqual(six.rs14p.activation_gate.gate_pass,true);
          assert.strictEqual(six.rs14p.progress.distinct_events.remaining,0);
          assert.strictEqual(six.rs14p.progress.concepts.remaining,0);
          assert.strictEqual(six.rs14p.progress.source_families.remaining,0);
          assert.strictEqual(six.rs14p.live_activation_automatic,false);

          const orphan=[sh].concat(oneExpected);
          const orphanExtra=oneExpected[0].slice();
          orphanExtra[0]='MSO|ORPHAN';
          orphanExtra[1]='ORPHAN';
          orphan.push(orphanExtra);
          const orphanReport=context.h3Rs13gBuildReportFromValues_(
            oneEvidence,
            concepts,
            orphan
          );
          assert.strictEqual(orphanReport.reconciliation.exact,false);
          assert.strictEqual(orphanReport.reconciliation.orphan_observation_ids.length,1);

          const contract=context.h3Rs13gDescribeContract_();
          assert.strictEqual(contract.read_only,true);
          assert.strictEqual(contract.reconcile,false);
          assert.strictEqual(contract.scheduler_write,false);
          assert.strictEqual(contract.learner_state_write,false);
          assert.strictEqual(contract.status_write,false);
          assert.strictEqual(contract.automatic_close,false);
          assert.strictEqual(contract.automatic_activation,false);

          assert(
            !reporter.includes('setValues(') &&
            !reporter.includes('setValue(') &&
            !reporter.includes('appendRow('),
            'Reporter must contain no sheet write primitives'
          );
          assert(
            !reporter.includes('h3MultiSkillShadowReconcile_('),
            'Reporter must never reconcile shadow rows'
          );

          [
            'WebAppProduction.js',
            'WebAppWrittenProduction.js',
            'WebAppReadingProduction.js',
            'WebAppTranslationV2Production.js',
            'WebAppRtScheduler.js'
          ].forEach(file=>{
            if(!fs.existsSync(file)) return;
            const source=fs.readFileSync(file,'utf8');
            assert(!source.includes('h3Rs13GateReportLive'));
            assert(!source.includes('h3Rs13gGateReport_'));
          });

          console.log('RS-13G gate reporter audit passed.');
          NODE
