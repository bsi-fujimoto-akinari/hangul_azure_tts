<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <?!= include_('Stylesheet'); ?>
    <style>
      .family-scheduler-launcher {
        padding: 10px;
      }

      .family-scheduler-actions {
        display: grid;
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 4fr);
        gap: 10px;
        width: 100%;
        min-width: 0;
        align-items: stretch;
      }

      .family-scheduler-next-wrap,
      .family-scheduler-family-group {
        min-width: 0;
      }

      .family-scheduler-family-group {
        display: grid;
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
        gap: 5px;
      }

      .family-scheduler-button {
        min-width: 0;
        min-height: 40px;
        border: 1px solid #c9c9c9;
        border-radius: 10px;
        background: #fff;
        padding: 0 4px;
        color: #4b5563;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .02em;
        line-height: 1;
        opacity: 1;
        cursor: default;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .family-scheduler-button:disabled {
        opacity: 1;
        color: #4b5563;
        -webkit-text-fill-color: currentColor;
      }

      .family-scheduler-button.family-scheduler-next,
      .family-scheduler-button.family-scheduler-next:disabled {
        width: 100%;
        min-height: 40px;
        height: 40px;
        border: 2px solid #7b8798;
        background: #eef2f6;
        color: #334155;
        -webkit-text-fill-color: #334155;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.75);
        font-size: 17px;
        font-weight: 900;
        padding: 0;
      }

      .family-scheduler-button.family-scheduler-next:not(:disabled) {
        cursor: pointer;
      }

      body.mobile-device .review-controls-sticky {
        grid-template-columns:
          minmax(0, 5fr)
          minmax(0, 2fr);
        gap: 8px;
      }

      body.mobile-device .review-history-filters {
        display: grid;
        grid-template-columns:
          repeat(5, minmax(0, 1fr));
      }

      body.mobile-device .review-history-sorts {
        display: grid;
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      body.mobile-device .review-filter-button,
      body.mobile-device .review-sort-button {
        width: 100%;
        min-width: 0;
        min-height: 40px;
        padding: 0 3px;
        font-size: 11px;
        letter-spacing: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      @media (max-width: 619px) {
        .family-scheduler-launcher {
          padding: 9px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1 class="sr-only">H3</h1>

      <nav id="mobile-progress" class="mobile-progress hidden" aria-label="問題進捗"></nav>

      <section id="loading" class="status compact-status">読み込み中…</section>
      <section id="error" class="panel error hidden" role="alert"></section>
      <section id="home" class="home hidden"></section>
      <section id="questions" class="questions hidden"></section>

      <section id="result" class="panel result hidden" aria-live="polite"></section>

    </main>

    <script>
      window.H3_BOOT = <?!= bootJson ?>;
    </script>
    <?!= include_('Client'); ?>
    <script>
      (function () {
        var home =
          document.getElementById(
            'home'
          );
        if (!home) {
          return;
        }

        function injectFamilySchedulerPreview() {
          if (
            home.querySelector(
              '.family-scheduler-launcher'
            )
          ) {
            return;
          }

          var review =
            home.querySelector(
              '.review-library'
            );
          if (!review) {
            return;
          }

          var launcher =
            document.createElement(
              'section'
            );
          launcher.className =
            'home-card family-scheduler-launcher';
          launcher.setAttribute(
            'aria-label',
            '学習メニュー'
          );

          var actions =
            document.createElement(
              'div'
            );
          actions.className =
            'family-scheduler-actions';

          var nextWrap =
            document.createElement(
              'div'
            );
          nextWrap.className =
            'family-scheduler-next-wrap';

          var nextButton =
            document.createElement(
              'button'
            );
          nextButton.type = 'button';
          nextButton.className =
            'family-scheduler-button family-scheduler-next';
          nextButton.disabled = true;
          nextButton.setAttribute(
            'aria-disabled',
            'true'
          );
          nextButton.setAttribute(
            'aria-label',
            '次の問題のfamilyを確認中'
          );

          var nextFamily =
            document.createElement(
              'span'
            );
          nextFamily.className =
            'family-scheduler-next-family';
          nextFamily.textContent =
            '—';
          nextFamily.setAttribute(
            'aria-live',
            'polite'
          );

          nextButton.appendChild(
            nextFamily
          );
          nextWrap.appendChild(
            nextButton
          );

          var familyGroup =
            document.createElement(
              'div'
            );
          familyGroup.className =
            'family-scheduler-family-group';

          [
            'L',
            'W',
            'R',
            'T'
          ].forEach(
            function (label) {
              var button =
                document.createElement(
                  'button'
                );
              button.type = 'button';
              button.className =
                'family-scheduler-button';
              button.textContent =
                label;
              button.disabled = true;
              button.setAttribute(
                'aria-disabled',
                'true'
              );
              button.dataset.family =
                label;
              familyGroup.appendChild(
                button
              );
            }
          );

          actions.appendChild(
            nextWrap
          );
          actions.appendChild(
            familyGroup
          );
          launcher.appendChild(
            actions
          );

          function familyForRoute_(
            route
          ) {
            if (
              route &&
              route.route_kind === 'FAMILY' &&
              [
                'L',
                'W',
                'R',
                'T'
              ].indexOf(
                String(
                  route.family || ''
                )
              ) >= 0
            ) {
              return String(
                route.family
              );
            }

            if (
              route &&
              route.route_kind ===
                'CURRENT_SET'
            ) {
              var surface =
                String(
                  route.surface_family ||
                  ''
                );
              if (surface === '5L') {
                return 'L';
              }
              if (surface === '5W') {
                return 'W';
              }
              if (surface === 'READING') {
                return 'R';
              }
              if (
                surface ===
                  'TRANSLATION'
              ) {
                return 'T';
              }
            }

            return '—';
          }

          function setNextState_(
            route
          ) {
            if (
              !home.contains(
                nextButton
              )
            ) {
              return;
            }

            var family =
              familyForRoute_(
                route
              );
            var actionable =
              route &&
              route.result_status ===
                'READY' &&
              (
                route.route_kind ===
                  'CURRENT_SET' ||
                (
                  route.route_kind ===
                    'FAMILY' &&
                  route.readiness_state ===
                    'READY'
                )
              ) &&
              family !== '—';

            nextFamily.textContent =
              family;
            nextButton.dataset.family =
              family;
            nextButton.disabled =
              !actionable;
            nextButton.setAttribute(
              'aria-disabled',
              actionable
                ? 'false'
                : 'true'
            );
            nextButton.setAttribute(
              'aria-label',
              actionable
                ? '次の問題のfamily: ' +
                  family
                : '次の問題は現在利用できません'
            );
          }

          nextButton.addEventListener(
            'click',
            function () {
              if (
                nextButton.disabled
              ) {
                return;
              }

              nextButton.disabled = true;
              nextButton.setAttribute(
                'aria-disabled',
                'true'
              );
              nextButton.setAttribute(
                'aria-busy',
                'true'
              );

              google.script.run
                .withSuccessHandler(
                  function (result) {
                    if (
                      !home.contains(
                        nextButton
                      )
                    ) {
                      return;
                    }

                    nextButton.removeAttribute(
                      'aria-busy'
                    );

                    if (
                      result &&
                      [
                        'OPEN_CURRENT',
                        'OPEN_ISSUED'
                      ].indexOf(
                        result.client_action
                      ) >= 0 &&
                      result.render_request
                    ) {
                      document.dispatchEvent(
                        new CustomEvent(
                          'h3-family-scheduler-open-current',
                          {
                            detail:
                              result.render_request
                          }
                        )
                      );
                      return;
                    }

                    setNextState_(
                      result
                    );
                    nextButton.dataset
                      .clientAction =
                        String(
                          result &&
                          result.client_action ||
                          ''
                        );
                  }
                )
                .withFailureHandler(
                  function () {
                    if (
                      home.contains(
                        nextButton
                      )
                    ) {
                      nextButton.removeAttribute(
                        'aria-busy'
                      );
                      nextFamily.textContent =
                        '—';
                      nextButton.disabled =
                        true;
                      nextButton.setAttribute(
                        'aria-disabled',
                        'true'
                      );
                      nextButton.setAttribute(
                        'aria-label',
                        '次の問題の経路を取得できませんでした'
                      );
                    }
                  }
                )
                .h3FamilySchedulerHomeNext();
            }
          );

          google.script.run
            .withSuccessHandler(
              function (route) {
                setNextState_(
                  route
                );
              }
            )
            .withFailureHandler(
              function () {
                if (
                  home.contains(
                    nextButton
                  )
                ) {
                  nextFamily.textContent =
                    '—';
                  nextButton.disabled =
                    true;
                  nextButton.setAttribute(
                    'aria-disabled',
                    'true'
                  );
                  nextButton.setAttribute(
                    'aria-label',
                    '次の問題のfamilyを取得できませんでした'
                  );
                }
              }
            )
            .h3FamilySchedulerIssueRoutePreview();
          home.insertBefore(
            launcher,
            review
          );
        }

        injectFamilySchedulerPreview();

        new MutationObserver(
          injectFamilySchedulerPreview
        ).observe(
          home,
          {
            childList: true
          }
        );
      }());
    </script>
  </body>
</html>
