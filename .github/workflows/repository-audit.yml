            'Transport failure did not retry exactly once.'
          );

          const timestamps = [
            '2026-09-21T10:00:00.000Z',
            '2026-09-21T10:05:00.000Z'
          ];
          let dateIndex = 0;
          class FakeDate extends Date {
            constructor(...args) {
              if (args.length) {
                super(...args);
              } else {
                super(
                  timestamps[
                    Math.min(
                      dateIndex,
                      timestamps.length - 1
                    )
                  ]
                );
                dateIndex += 1;
              }
            }
          }

          const serverContext = {
            console,
            JSON,
            Number,
            String,
            Object,
            Array,
            Math,
            Date: FakeDate,
            H3_WEB_RUNTIME_SPREADSHEET_ID:
              'RUNTIME'
          };
          serverContext.globalThis =
            serverContext;
          vm.createContext(serverContext);
          vm.runInContext(core, serverContext);
          vm.runInContext(
            persistence,
            serverContext
          );

          const headers = [
            'KIND',
            'SET_ID',
            'SET_NO',
            'ANSWERED_AT',
            'SCORE',
            'TOTAL',
            'WRONG_COUNT',
            'UNCERTAINTY_KNOWN',
            'UNCERTAIN_COUNT',
            'BASE_PRIORITY',
            'REVIEW_SOURCE_ID',
            'SOURCE_MODE',
            'STATUS',
            'SURFACE_FAMILY',
            'LEVEL',
            'LAST_REVIEWED_AT',
            'LAST_REVIEW_COMPLETION_KEY',
            'PRIORITY_STATE_JSON'
          ];
          const map =
            Object.fromEntries(
              headers.map(
                (name, index) => [
                  name,
                  index
                ]
              )
            );
          const row = [
            'LISTENING',
            'H3-L',
            1,
            '2026-09-21T09:00:00Z',
            2,
            5,
            3,
            'TRUE',
            0,
            60,
            'TX-L',
            'LISTENING_PRODUCTION_WEB',
            'ACTIVE',
            '5L',
            '3級',
            '',
            '',
            '{"schema":"H3_REVIEW_PRIORITY_STATE_V1","item_count":0,"base_level":60,"items":[]}'
          ];
          const sheet = {
            getRange(
              rowNumber,
              column,
              rowCount,
              columnCount
            ) {
              return {
                setValues(values) {
                  assert.strictEqual(
                    rowNumber,
                    2
                  );
                  assert.strictEqual(
                    column,
                    map.LAST_REVIEWED_AT + 1
                  );
                  assert.strictEqual(
                    rowCount,
                    1
                  );
                  assert.strictEqual(
                    columnCount,
                    2
                  );
                  row[
                    map.LAST_REVIEWED_AT
                  ] = values[0][0];
                  row[
                    map.LAST_REVIEW_COMPLETION_KEY
                  ] = values[0][1];
                }
              };
            }
          };
          const table = {
            header: headers,
            map,
            rows: [row]
          };
          serverContext
            .h3ReviewHomeIndexTable_ =
            () => ({
              schema_version:
                'H3_REVIEW_HOME_INDEX_V5',
              sheet,
              table
            });
          serverContext
            .h3ReviewHomeIndexFind_ =
            () => ({
              rowNumber: 2,
              row
            });
          serverContext.SpreadsheetApp = {
            openById() {
              return {};
            },
            flush() {}
          };
          let lockAvailable = true;
          serverContext.LockService = {
            getScriptLock() {
              return {
                tryLock() {
                  return lockAvailable;
                },
                releaseLock() {}
              };
            }
          };

          const serverRequest = {
            schema:
              'H3_REVIEW_COMPLETE_REQUEST_V2',
            review_kind: 'LISTENING',
            surface_family: '5L',
            set_id: 'H3-L',
            review_source_id: 'TX-L',
            viewed_count: 5,
            completion_event_key:
              request.completion_event_key
          };

          const first =
            serverContext
              .h3ReviewCompleteSession_(
                serverRequest
              );
          assert.strictEqual(
            first.status,
            'RECORDED'
          );
          const firstTimestamp =
            row[map.LAST_REVIEWED_AT];

          const duplicate =
            serverContext
              .h3ReviewCompleteSession_(
                serverRequest
              );
          assert.strictEqual(
            duplicate.status,
            'ALREADY_RECORDED'
          );
          assert.strictEqual(
            row[map.LAST_REVIEWED_AT],
            firstTimestamp,
            'Same-event retry advanced cooldown timestamp.'
          );

          const laterRequest = {
            ...serverRequest,
            completion_event_key:
              'H3RC-1112131415161718191a1b1c1d1e1f20'
          };
          const later =
            serverContext
              .h3ReviewCompleteSession_(
                laterRequest
              );
          assert.strictEqual(
            later.status,
            'RECORDED'
          );
          assert.strictEqual(
            row[
              map.LAST_REVIEW_COMPLETION_KEY
            ],
            laterRequest.completion_event_key,
            'Later Review completion was incorrectly suppressed.'
          );

          const beforeInvalid =
            row.slice();
          try {
            serverContext
              .h3ReviewCompleteSession_({
                ...serverRequest,
                completion_event_key: ''
              });
            assert.fail(
              'Invalid completion identity was accepted.'
            );
          } catch (err) {
            const failure =
              serverContext
                .h3ReviewCompletionFailureResult_(
                  err
                );
            assert.strictEqual(
              failure.error_class,
              'VALIDATION'
            );
            assert.strictEqual(
              failure.retryable,
              false
            );
          }
          assert.deepStrictEqual(
            row,
            beforeInvalid,
            'Validation failure mutated cooldown state.'
          );

          lockAvailable = false;
          try {
            serverContext
              .h3ReviewCompleteSession_({
                ...serverRequest,
                completion_event_key:
                  'H3RC-2122232425262728292a2b2c2d2e2f30'
              });
            assert.fail(
              'Lock contention was accepted.'
            );
          } catch (err) {
            const failure =
              serverContext
                .h3ReviewCompletionFailureResult_(
                  err
                );
            assert.strictEqual(
              failure.error_class,
              'TRANSIENT'
            );
            assert.strictEqual(
              failure.retryable,
              true
            );
          }

          console.log(
            'Review completion remediation contract checks passed.'
          );
          NODE


      - name: Verify Review explanation style contract
