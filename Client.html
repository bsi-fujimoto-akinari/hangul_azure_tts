<script>
(function () {
  'use strict';

  var sections = ['K1', 'K2', 'K3', 'K4', 'K5'];
  var circled = ['①', '②', '③', '④'];
  var mobileQuery = window.matchMedia('(max-width: 619px)');

  var app = {
    payload: null,
    answers: {},
    uncertain: {},
    locked: false,
    submitting: false,
    activeIndex: 0,
    mediaCache: {},
    mediaTrimMs: {},
    mediaLoading: {},
    reviewKindFilter: null,
    reviewSort: 'RECENT'
  };

  document.addEventListener('DOMContentLoaded', function () {
    applyDeviceProfile();

    if (mobileQuery.addEventListener) {
      mobileQuery.addEventListener('change', syncResponsiveState);
    } else if (mobileQuery.addListener) {
      mobileQuery.addListener(syncResponsiveState);
    }

    loadSet();
  });

  function applyDeviceProfile() {
    var ua = navigator.userAgent || '';
    var screenWidth = Math.min(
      Number(window.screen && window.screen.width || 9999),
      Number(window.screen && window.screen.height || 9999)
    );
    var touch = Number(navigator.maxTouchPoints || 0) > 0;
    var iphoneLike =
      /iPhone|iPod/i.test(ua) ||
      (touch && screenWidth <= 500);

    if (!iphoneLike) return;

    document.body.classList.add('mobile-device');

    var layoutWidth = Number(window.innerWidth || 0);
    if (layoutWidth > 0 && screenWidth > 0 && layoutWidth > screenWidth * 1.35) {
      var zoom = Math.min(layoutWidth / screenWidth, 3);
      document.documentElement.style.setProperty('--h3-mobile-target-width', screenWidth + 'px');
      document.documentElement.style.setProperty('--h3-mobile-zoom', String(zoom));
      document.body.classList.add('mobile-viewport-emulated');
    }
  }

  function isMobileMode() {
    return document.body.classList.contains('mobile-device') || mobileQuery.matches;
  }

  function resetForPayload() {
    pauseOtherAudio(null);

    app.answers = {};
    app.uncertain = {};
    app.locked = false;
    app.submitting = false;
    app.activeIndex = 0;
    app.mediaCache = {};
    app.mediaTrimMs = {};
    app.mediaLoading = {};
    app.mediaRetryCount = {};
    app.reviewKindFilter = null;
    app.reviewSort = 'RECENT';

    document.body.classList.remove(
      'graded'
    );

    ['home', 'questions', 'result']
      .forEach(function (id) {
        var node =
          document.getElementById(id);
        node.textContent = '';
        node.classList.add('hidden');
      });

    document
      .getElementById(
        'mobile-progress'
      )
      .classList.add('hidden');

    var error =
      document.getElementById(
        'error'
      );
    error.textContent = '';
    error.classList.add('hidden');
  }

  function loadSet(request) {
    setLoading(true);
    resetForPayload();

    var webRequest =
      request ||
      window.H3_BOOT;

    google.script.run
      .withSuccessHandler(function (payload) {
        setLoading(false);
        app.payload = payload;

        if (payload.mode === 'HOME') {
          app.locked = true;
          renderHome(payload);
          return;
        }

        if (payload.mode === 'REVIEW') {
          app.locked = true;
          renderPersistentReview(
            payload
          );
          return;
        }

        if (
          !Array.isArray(
            payload.questions
          ) ||
          payload.questions.length !== 5
        ) {
          throw new Error(
            'QUESTION_PAYLOAD_SHAPE_INVALID'
          );
        }

        sections =
          payload.questions.map(
            function (question) {
              return String(
                question.section || ''
              );
            }
          );

        renderQuestions(
          payload.questions
        );
        buildMobileProgress(
          payload.questions.length
        );

        document
          .getElementById(
            'questions'
          )
          .classList.remove('hidden');
        document
          .getElementById(
            'mobile-progress'
          )
          .classList.remove('hidden');

        app.activeIndex = 0;
        updateMobilePager();
        updateLiveSummary();
        scheduleInitialAudioPrefetch();
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        showError(
          errorText(err)
        );
      })
      .getListeningWebSet(
        webRequest
      );
  }

  function loadHome() {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'HOME',
      set_id: null,
      txn_id: null
    });
  }

  function loadReviewTxn(txnId) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'REVIEW',
      set_id: null,
      txn_id:
        String(txnId),
      legacy_review_id: null
    });
  }

  function loadLegacyReview(
    legacyReviewId
  ) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'REVIEW',
      set_id: null,
      txn_id: null,
      legacy_review_id:
        String(legacyReviewId)
    });
  }

  function loadWrittenReview(
    setId
  ) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'REVIEW',
      review_kind:
        'WRITTEN',
      set_id:
        String(setId),
      txn_id: null,
      legacy_review_id: null
    });
  }

  function loadReplayTxn(txnId) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode:
        'REVIEW_REPLAY',
      set_id: null,
      txn_id:
        String(txnId),
      legacy_review_id: null
    });
  }

  function loadLegacyReplay(
    legacyReviewId
  ) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode:
        'REVIEW_REPLAY',
      set_id: null,
      txn_id: null,
      legacy_review_id:
        String(legacyReviewId)
    });
  }

  function loadLearningSet(
    setId,
    mode
  ) {
    var targetMode =
      String(
        mode || 'LISTENING'
      );

    if (
      [
        'LISTENING',
        'WRITTEN'
      ].indexOf(targetMode) < 0
    ) {
      showError(
        '学習モードを確認できません。'
      );
      return;
    }

    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode:
        targetMode,
      set_id:
        String(setId),
      txn_id: null
    });
  }

  function openReviewHistoryEntry_(
    entry
  ) {
    if (
      entry.review_kind ===
        'WRITTEN'
    ) {
      loadWrittenReview(
        entry.set_id
      );
      return;
    }

    if (entry.legacy_review_id) {
      loadLegacyReview(
        entry.legacy_review_id
      );
      return;
    }

    loadReviewTxn(
      entry.txn_id
    );
  }


  function applyReviewHistoryView_(
    history
  ) {
    var nodes =
      Array.prototype.slice.call(
        history.querySelectorAll(
          '.review-history-item'
        )
      );

    nodes.sort(function (a, b) {
      if (
        app.reviewSort ===
          'REVIEW_LEVEL'
      ) {
        var levelDiff =
          Number(
            b.dataset.reviewLevel || 0
          ) -
          Number(
            a.dataset.reviewLevel || 0
          );
        if (levelDiff) {
          return levelDiff;
        }
      }

      var at =
        String(
          a.dataset.answeredAt || ''
        );
      var bt =
        String(
          b.dataset.answeredAt || ''
        );

      if (at !== bt) {
        return at < bt ? 1 : -1;
      }

      return (
        Number(
          a.dataset.originalIndex || 0
        ) -
        Number(
          b.dataset.originalIndex || 0
        )
      );
    });

    var shown = 0;
    nodes.forEach(function (node) {
      var kind =
        String(
          node.dataset.reviewKind ||
          'LISTENING'
        );
      var visible =
        kind ===
        app.reviewKindFilter;

      node.classList.toggle(
        'hidden',
        !visible
      );
      if (visible) {
        shown += 1;
      }
      history.appendChild(node);
    });

    var empty =
      history.querySelector(
        '.review-filter-empty'
      );
    if (empty) {
      empty.classList.toggle(
        'hidden',
        shown !== 0
      );
    }
  }


  function renderHome(payload) {
    var root =
      document.getElementById(
        'home'
      );
    root.textContent = '';
    root.classList.remove(
      'hidden'
    );

    var review =
      el(
        'section',
        'home-card review-library'
      );

    var reviewHead =
      el(
        'div',
        'home-card-head'
      );

    var reviewTitleWrap =
      el(
        'div',
        'home-section-title'
      );

    var reviewTitle =
      document.createElement('h3');
    reviewTitle.textContent =
      '復習';
    reviewTitleWrap.appendChild(
      reviewTitle
    );

    if (
      payload.review_history &&
      payload.review_history.length
    ) {
      var count =
        document.createElement('span');
      count.className =
        'home-history-count';
      count.textContent =
        String(
          payload.review_history
            .length
        );
      reviewTitleWrap.appendChild(
        count
      );
    }

    reviewHead.appendChild(
      reviewTitleWrap
    );
    review.appendChild(
      reviewHead
    );

    var controls =
      el(
        'div',
        'review-controls-sticky'
      );

    if (!app.reviewKindFilter) {
      var latestKind =
        payload.review_history &&
        payload.review_history.length
          ? String(
              payload.review_history[0]
                .review_kind || ''
            )
          : '';

      app.reviewKindFilter =
        ['LISTENING', 'WRITTEN']
          .indexOf(latestKind) >= 0
          ? latestKind
          : 'WRITTEN';
    }

    var filters =
      el(
        'div',
        'review-history-filters review-segmented'
      );
    filters.setAttribute(
      'aria-label',
      '問題種別'
    );

    [
      {
        key: 'LISTENING',
        label: 'L'
      },
      {
        key: 'WRITTEN',
        label: 'W'
      }
    ].forEach(function (spec) {
      var button =
        el(
          'button',
          'review-filter-button'
        );
      button.type = 'button';
      button.dataset.filter =
        spec.key;
      button.textContent =
        spec.label;
      button.classList.toggle(
        'active',
        spec.key ===
          app.reviewKindFilter
      );
      button.setAttribute(
        'aria-pressed',
        String(
          spec.key ===
          app.reviewKindFilter
        )
      );

      button.addEventListener(
        'click',
        function () {
          app.reviewKindFilter =
            spec.key;

          Array.prototype
            .forEach.call(
              filters.querySelectorAll(
                '.review-filter-button'
              ),
              function (node) {
                var active =
                  node === button;
                node.classList.toggle(
                  'active',
                  active
                );
                node.setAttribute(
                  'aria-pressed',
                  String(active)
                );
              }
            );

          applyReviewHistoryView_(
            history
          );
        }
      );

      filters.appendChild(button);
    });

    var sorts =
      el(
        'div',
        'review-history-sorts review-segmented'
      );
    sorts.setAttribute(
      'aria-label',
      '並び順'
    );

    [
      {
        key: 'RECENT',
        label: 'Newest'
      },
      {
        key: 'REVIEW_LEVEL',
        label: 'Priority'
      }
    ].forEach(function (spec) {
      var button =
        el(
          'button',
          'review-sort-button'
        );
      button.type = 'button';
      button.dataset.sort =
        spec.key;
      button.textContent =
        spec.label;
      button.classList.toggle(
        'active',
        spec.key ===
          app.reviewSort
      );
      button.setAttribute(
        'aria-pressed',
        String(
          spec.key ===
          app.reviewSort
        )
      );

      button.addEventListener(
        'click',
        function () {
          app.reviewSort =
            spec.key;

          Array.prototype
            .forEach.call(
              sorts.querySelectorAll(
                '.review-sort-button'
              ),
              function (node) {
                var active =
                  node === button;
                node.classList.toggle(
                  'active',
                  active
                );
                node.setAttribute(
                  'aria-pressed',
                  String(active)
                );
              }
            );

          applyReviewHistoryView_(
            history
          );
        }
      );

      sorts.appendChild(button);
    });

    controls.appendChild(filters);
    controls.appendChild(sorts);
    review.appendChild(controls);

    var history =
      el(
        'div',
        'review-history-list'
      );

    if (
      !payload.review_history ||
      !payload.review_history.length
    ) {
      var empty =
        el(
          'div',
          'home-empty-state'
        );
      empty.textContent =
        '復習履歴はまだありません。';
      history.appendChild(empty);
    } else {
      payload.review_history
        .forEach(
          function (
            entry,
            entryIndex
          ) {
            var item =
              el(
                'article',
                'review-history-item'
              );

            var kind =
              String(
                entry.review_kind ||
                'LISTENING'
              );
            var reviewLevel =
              Number(
                entry.review_level || 0
              );

            item.dataset.reviewKind =
              kind;
            item.dataset.reviewLevel =
              String(reviewLevel);
            item.dataset.answeredAt =
              String(
                entry.review_effective_at ||
                entry.committed_at ||
                entry.answered_at ||
                ''
              );
            item.dataset.originalIndex =
              String(entryIndex);
            item.setAttribute(
              'role',
              'button'
            );
            item.setAttribute(
              'tabindex',
              '0'
            );

            var meta =
              el(
                'div',
                'review-history-meta'
              );

            var headingRow =
              el(
                'div',
                'review-history-heading'
              );

            var heading =
              document.createElement('h4');
            heading.textContent =
              kind === 'WRITTEN'
                ? (
                    '5W #' +
                    String(
                      entry
                        .written_set_no ||
                      '—'
                    )
                  )
                : (
                    '5L #' +
                    entry
                      .listening_set_no
                  );
            headingRow.appendChild(
              heading
            );

            var score =
              el(
                'span',
                'review-history-score'
              );
            score.textContent =
              entry.score +
              '/' +
              entry.total;
            headingRow.appendChild(
              score
            );

            meta.appendChild(
              headingRow
            );

            var date =
              document.createElement(
                'p'
              );
            date.className =
              'review-history-date';
            date.textContent =
              formatHistoryDate(
                entry.committed_at ||
                entry.answered_at
              );
            meta.appendChild(date);

            var summary =
              document.createElement(
                'p'
              );
            summary.className =
              'review-history-summary';
            summary.textContent =
              '×' +
              entry.wrong_count +
              '　' +
              (
                entry
                  .uncertainty_known ===
                  false
                  ? '?—'
                  : (
                      '?' +
                      entry
                        .uncertain_count
                    )
              ) +
              '　復習Lv ' +
              reviewLevel;
            meta.appendChild(
              summary
            );

            item.appendChild(meta);

            var openEntry =
              function () {
                openReviewHistoryEntry_(
                  entry
                );
              };

            item.addEventListener(
              'click',
              openEntry
            );
            item.addEventListener(
              'keydown',
              function (event) {
                if (
                  event.key ===
                    'Enter' ||
                  event.key === ' '
                ) {
                  event
                    .preventDefault();
                  openEntry();
                }
              }
            );

            item.setAttribute(
              'aria-label',
              heading.textContent +
              ' ' +
              score.textContent +
              ' 復習レベル ' +
              reviewLevel
            );

            history.appendChild(
              item
            );
          }
        );

      var filteredEmpty =
        el(
          'div',
          'home-empty-state review-filter-empty hidden'
        );
      filteredEmpty.textContent =
        '選択した種別の復習履歴はありません。';
      history.appendChild(
        filteredEmpty
      );
    }

    review.appendChild(history);
    root.appendChild(review);

    applyReviewHistoryView_(
      history
    );
  }

  function formatHistoryDate(value) {
    var text =
      String(value || '');
    if (!text) return '';

    return text
      .replace('T', ' ')
      .replace(
        /:\d{2}\+09:00$/,
        ''
      )
      .replace(/-/g, '/');
  }

  function audioKeyForIndex_(
    index
  ) {
    if (
      !app.payload ||
      !Array.isArray(
        app.payload.questions
      ) ||
      !app.payload.questions[
        index
      ]
    ) {
      return null;
    }

    return (
      app.payload.questions[
        index
      ].audio_asset_key ||
      null
    );
  }

  function updateWrittenGradeButton_() {
    var button =
      document.querySelector(
        '.written-grade-button'
      );

    if (!button) {
      return;
    }

    button.disabled =
      app.locked ||
      app.submitting ||
      !allAnswered();
  }

  function resetWrittenAnswers_() {
    if (
      !app.payload ||
      app.payload.mode !==
        'WRITTEN' ||
      app.locked ||
      app.submitting
    ) {
      return;
    }

    app.answers = {};
    app.uncertain = {};
    app.activeIndex = 0;

    Array.prototype.forEach.call(
      document.querySelectorAll(
        '.choice'
      ),
      function (node) {
        node.classList.remove(
          'selected'
        );
      }
    );

    Array.prototype.forEach.call(
      document.querySelectorAll(
        '.uncertain'
      ),
      function (node) {
        node.classList.remove(
          'active'
        );
        node.setAttribute(
          'aria-pressed',
          'false'
        );
      }
    );

    updateLiveSummary();
    setActiveIndex(0);
  }

  function appendWrittenControls_(
    root
  ) {
    var controls =
      el(
        'div',
        'control-row written-controls'
      );

    var reset =
      el(
        'button',
        'secondary written-reset-button'
      );
    reset.type = 'button';
    reset.textContent =
      'リセット';
    reset.addEventListener(
      'click',
      resetWrittenAnswers_
    );
    controls.appendChild(reset);

    var grade =
      el(
        'button',
        'primary written-grade-button'
      );
    grade.type = 'button';
    grade.textContent = '採点';
    grade.disabled = true;
    grade.addEventListener(
      'click',
      submitAnswers
    );
    controls.appendChild(grade);

    root.appendChild(
      controls
    );
  }

  function renderQuestions(questions) {
    var root = document.getElementById('questions');
    root.textContent = '';

    questions.forEach(function (q, index) {
      var qNo = index + 1;
      var card = el('section', 'question-card');
      if (
        app.payload &&
        app.payload.mode ===
          'WRITTEN'
      ) {
        card.classList.add(
          'written-question'
        );
      }
      card.dataset.section = q.section;
      card.dataset.index = String(index);
      card.dataset.audioKey = q.audio_asset_key || '';
      if (index === 0) card.classList.add('mobile-active');

      var head = el('div', 'question-head');
      var title = el('h2', 'question-title');
      title.textContent = 'Q' + qNo + ' ' + q.display;

      var uncertain = el('button', 'uncertain');
      uncertain.type = 'button';
      uncertain.textContent = '?';
      uncertain.setAttribute('aria-label', 'Q' + qNo + ' 不確か');
      uncertain.setAttribute('aria-pressed', 'false');
      uncertain.addEventListener('click', function () {
        if (app.locked) return;

        app.uncertain[q.section] = !app.uncertain[q.section];
        uncertain.classList.toggle('active', !!app.uncertain[q.section]);
        uncertain.setAttribute('aria-pressed', String(!!app.uncertain[q.section]));
        updateLiveSummary();
      });

      head.appendChild(title);

      if (q.audio_asset_key) {
        head.appendChild(
          buildAudioBlock(
            q.audio_asset_key,
            q.audio_fallback_url,
            '',
            true
          )
        );
      }

      head.appendChild(uncertain);
      card.appendChild(head);

      if (
        q.question_text
      ) {
        var prompt =
          el(
            'div',
            'question-prompt'
          );
        prompt.textContent =
          q.question_text;
        card.appendChild(prompt);
      }

      if (q.section === 'K1') {
        var img = document.createElement('img');
        img.className = 'k1-image';
        img.src = q.image_data_uri;
        img.alt = 'K1 問題画像';
        img.decoding = 'async';
        img.loading = 'eager';
        card.appendChild(img);
      }

      var choices = el('div', 'choices' + (q.visible_choices ? '' : ' textless'));

      q.choice_ids.forEach(function (choiceId, choiceIndex) {
        var button = el('button', 'choice');
        button.type = 'button';
        button.dataset.answer = String(choiceId);
        button.textContent =
          circled[choiceIndex] +
          (q.visible_choices ? ' ' + q.visible_choices[choiceIndex] : '');

        button.addEventListener('click', function () {
          if (app.locked) return;

          app.answers[q.section] = choiceId;
          Array.prototype.forEach.call(
            choices.querySelectorAll('.choice'),
            function (node) {
              node.classList.toggle('selected', node === button);
            }
          );

          updateLiveSummary();

          if (!app.payload) return;

          if (index < app.payload.questions.length - 1) {
            var nextIndex = index + 1;
            var nextSection = sections[nextIndex];

            setActiveIndex(nextIndex, true);
            playAudioAssetNow(
              audioKeyForIndex_(
                nextIndex
              ),
              true
            );
            return;
          }

          if (allAnswered()) {
            if (
              !app.payload ||
              app.payload.mode !==
                'WRITTEN'
            ) {
              window.setTimeout(function () {
                submitAnswers();
              }, 80);
            } else {
              updateWrittenGradeButton_();
            }
          } else {
            var firstMissing = sections.findIndex(function (section) {
              return typeof app.answers[section] !== 'number';
            });
            if (firstMissing >= 0) {
              setActiveIndex(firstMissing, true);
              playAudioAssetNow(
                audioKeyForIndex_(
                  firstMissing
                ),
                true
              );
            }
          }
        });

        choices.appendChild(button);
      });

      card.appendChild(choices);
      root.appendChild(card);
    });

    if (
      app.payload &&
      app.payload.mode ===
        'WRITTEN'
    ) {
      appendWrittenControls_(
        root
      );
    }
  }

  function buildAudioBlock(assetKey, fallbackUrl, label, compact) {
    var wrap = el('div', 'audio-wrap' + (compact ? ' compact-audio-wrap' : ''));

    if (label) {
      var title = el('p', 'audio-label');
      title.textContent = label;
      wrap.appendChild(title);
    }

    var controls = el('div', 'custom-audio-controls');

    var toggle = el('button', 'audio-toggle');
    toggle.type = 'button';
    toggle.dataset.assetKey = assetKey;
    toggle.disabled = true;
    toggle.textContent = compact ? '…' : '準備中…';
    controls.appendChild(toggle);

    var time = el('span', 'audio-time');
    time.dataset.assetKey = assetKey;
    time.textContent = '0:00 / --:--';
    controls.appendChild(time);

    wrap.appendChild(controls);

    var audio = document.createElement('audio');
    audio.className = 'audio-engine';
    audio.preload = 'none';
    audio.dataset.assetKey = assetKey;
    audio.setAttribute('playsinline', '');

    toggle.addEventListener('click', function () {
      if (!audio.getAttribute('src')) return;

      if (audio.paused) {
        prepareAudioStart(audio);
        pauseOtherAudio(audio);
        var promise = audio.play();
        if (promise && typeof promise.catch === 'function') {
          promise.catch(function () {
            setAudioStatus(
              assetKey,
              '再生を開始できませんでした。Driveリンクを使用してください。',
              true
            );
          });
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', function () {
      toggle.textContent = compact ? 'Ⅱ' : '❚❚ 一時停止';
      pauseOtherAudio(audio);
    });
    audio.addEventListener('pause', function () {
      if (!audio.ended) toggle.textContent = compact ? '▶' : '▶ 再生';
    });
    audio.addEventListener('ended', function () {
      toggle.textContent = compact ? '▶' : '▶ 再生';
      updateAudioTime(audio, time);
    });
    audio.addEventListener('loadedmetadata', function () {
      prepareAudioStart(audio);
      updateAudioTime(audio, time);
    });
    audio.addEventListener('timeupdate', function () {
      updateAudioTime(audio, time);
    });

    wrap.appendChild(audio);

    var status = el('p', 'audio-status');
    status.dataset.assetKey = assetKey;
    status.textContent = '';
    status.classList.add('hidden');
    wrap.appendChild(status);

    var fallback = document.createElement('a');
    fallback.className = 'media-fallback' + (compact ? ' hidden' : '');
    fallback.dataset.assetKey = assetKey;
    fallback.href = fallbackUrl;
    fallback.target = '_blank';
    fallback.rel = 'noopener';
    fallback.textContent = '再生できない場合はDriveで開く';
    wrap.appendChild(fallback);

    return wrap;
  }

  function getAudioSkipSeconds(audio) {
    return Math.max(0, Number(audio.dataset.skipMs || 0) / 1000);
  }

  function prepareAudioStart(audio) {
    var skip = getAudioSkipSeconds(audio);
    if (!isFinite(audio.duration)) return;
    if (audio.ended || audio.currentTime < skip - 0.05) {
      try {
        audio.currentTime = Math.min(skip, Math.max(0, audio.duration - 0.05));
      } catch (e) {
        // Metadata may not be fully seekable yet; timeupdate will correct display.
      }
    }
  }

  function updateAudioTime(audio, node) {
    var skip = getAudioSkipSeconds(audio);
    var rawCurrent = isFinite(audio.currentTime) ? audio.currentTime : skip;
    var rawDuration = isFinite(audio.duration) ? audio.duration : null;
    var current = Math.max(0, rawCurrent - skip);
    var duration = rawDuration === null ? null : Math.max(0, rawDuration - skip);

    node.textContent =
      formatAudioTime(current) + ' / ' +
      (duration === null ? '--:--' : formatAudioTime(duration));
  }

  function formatAudioTime(seconds) {
    var value = Math.max(0, Math.floor(Number(seconds) || 0));
    var minutes = Math.floor(value / 60);
    var remain = value % 60;
    return minutes + ':' + (remain < 10 ? '0' : '') + remain;
  }

  function scheduleInitialAudioPrefetch() {
    if (
      !app.payload ||
      !Array.isArray(
        app.payload.questions
      )
    ) {
      return;
    }

    var keys =
      app.payload.questions
        .map(function (question) {
          return (
            question.audio_asset_key ||
            null
          );
        })
        .filter(Boolean);

    if (!keys.length) {
      return;
    }

    if (isMobileMode()) {
      ensureAudioLoaded(
        keys[0],
        { background: false }
      );
      if (keys[1]) {
        window.setTimeout(function () {
          ensureAudioLoaded(
            keys[1],
            { background: true }
          );
        }, 500);
      }
      return;
    }

    keys.forEach(function (assetKey, index) {
      window.setTimeout(function () {
        ensureAudioLoaded(
          assetKey,
          { background: index !== 0 }
        );
      }, index * 350);
    });
  }

  function ensureAudioLoaded(
    assetKey,
    options
  ) {
    if (!assetKey) return;

    var opts = options || {};
    var background =
      opts.background === true;

    if (app.mediaCache[assetKey]) {
      attachAudioData(
        assetKey,
        app.mediaCache[assetKey],
        app.mediaTrimMs[assetKey] || 0
      );
      return;
    }

    if (app.mediaLoading[assetKey]) return;
    app.mediaLoading[assetKey] = true;

    if (!background) {
      setAudioStatus(
        assetKey,
        '音声を準備中…',
        false
      );
    }

    google.script.run
      .withSuccessHandler(function (media) {
        app.mediaLoading[assetKey] = false;
        app.mediaRetryCount[assetKey] = 0;
        app.mediaCache[assetKey] = media.data_uri;
        app.mediaTrimMs[assetKey] =
          Number(
            media.trim_start_ms || 0
          );
        attachAudioData(
          assetKey,
          media.data_uri,
          app.mediaTrimMs[assetKey]
        );
        setAudioStatus(
          assetKey,
          '',
          false
        );
      })
      .withFailureHandler(function () {
        app.mediaLoading[assetKey] = false;

        var retries =
          Number(
            app.mediaRetryCount[
              assetKey
            ] || 0
          );

        if (retries < 1) {
          app.mediaRetryCount[
            assetKey
          ] = retries + 1;

          if (!background) {
            setAudioStatus(
              assetKey,
              '音声を再準備中…',
              false
            );
          }

          window.setTimeout(
            function () {
              ensureAudioLoaded(
                assetKey,
                {
                  background:
                    background
                }
              );
            },
            700
          );
          return;
        }

        setAudioStatus(
          assetKey,
          '音声を準備できませんでした。もう一度この問題を開くか、Driveリンクを使用してください。',
          true
        );
      })
      .getListeningWebMedia({
        schema:
          'H3_WEB_MEDIA_REQUEST_V1',
        mode: app.payload.mode,
        set_id: app.payload.set_id,
        txn_id:
          app.payload.txn_id || null,
        legacy_review_id:
          app.payload
            .legacy_review_id || null,
        asset_key: assetKey
      });
  }

  function attachAudioData(assetKey, dataUri, trimStartMs) {
    var nodes = document.querySelectorAll(
      'audio[data-asset-key="' + assetKey + '"]'
    );

    Array.prototype.forEach.call(nodes, function (audio) {
      audio.dataset.skipMs = String(Math.max(0, Number(trimStartMs || 0)));
      if (!audio.getAttribute('src')) {
        audio.src = dataUri;
        audio.load();
      }
    });

    var toggles = document.querySelectorAll(
      '.audio-toggle[data-asset-key="' + assetKey + '"]'
    );
    Array.prototype.forEach.call(toggles, function (button) {
      button.disabled = false;
      button.textContent =
        button.closest('.compact-audio-wrap') ? '▶' : '▶ 再生';
    });
  }

  function setAudioStatus(assetKey, message, isError) {
    var nodes = document.querySelectorAll(
      '.audio-status[data-asset-key="' + assetKey + '"]'
    );

    Array.prototype.forEach.call(nodes, function (node) {
      node.textContent = message;
      node.classList.toggle('media-error', !!isError);
      node.classList.toggle('hidden', !message);
    });

    var fallbacks = document.querySelectorAll(
      '.media-fallback[data-asset-key="' + assetKey + '"]'
    );
    Array.prototype.forEach.call(fallbacks, function (node) {
      if (node.closest('.compact-audio-wrap')) {
        node.classList.toggle('hidden', !isError);
      }
    });
  }

  function resetAudioAsset(
    assetKey
  ) {
    var audio =
      document.querySelector(
        'audio[data-asset-key="' +
        assetKey +
        '"]'
      );

    if (!audio) return;

    var skip =
      getAudioSkipSeconds(audio);

    try {
      audio.currentTime = skip;
    } catch (e) {
      // A freshly attached source will already start at zero.
    }
  }

  function playAudioAssetNow(
    assetKey,
    restart
  ) {
    if (!assetKey) return false;

    var audio = document.querySelector(
      'audio[data-asset-key="' + assetKey + '"]'
    );

    if (!audio || !audio.getAttribute('src')) {
      return false;
    }

    if (restart === true) {
      resetAudioAsset(
        assetKey
      );
    } else {
      prepareAudioStart(audio);
    }

    pauseOtherAudio(audio);

    var promise = audio.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(function () {
        // iOS may still reject playback if the media was not fully ready
        // within the same user gesture. In that case the visible play
        // button remains the fallback.
      });
    }

    return true;
  }

  function pauseOtherAudio(current) {
    Array.prototype.forEach.call(
      document.querySelectorAll('audio'),
      function (audio) {
        if (audio !== current && !audio.paused) {
          audio.pause();
        }
      }
    );
  }

  function buildMobileProgress(count) {
    var root = document.getElementById('mobile-progress');
    root.textContent = '';

    for (var i = 0; i < count; i += 1) {
      (function (index) {
        var button = el('button', 'progress-button');
        button.type = 'button';
        button.textContent = 'Q' + (index + 1);
        button.dataset.index = String(index);
        if (index === 0) button.classList.add('current');
        button.addEventListener('click', function () {
          setActiveIndex(index);
        });
        root.appendChild(button);
      })(i);
    }
  }

  function setActiveIndex(
    index,
    restartAudio
  ) {
    if (!app.payload || app.locked) return;

    var max =
      app.payload.questions.length - 1;

    pauseOtherAudio(null);

    app.activeIndex =
      Math.max(
        0,
        Math.min(max, index)
      );
    updateMobilePager();

    var activeAudioKey =
      audioKeyForIndex_(
        app.activeIndex
      );

    ensureAudioLoaded(
      activeAudioKey,
      { background: false }
    );

    if (
      restartAudio === true &&
      activeAudioKey
    ) {
      resetAudioAsset(
        activeAudioKey
      );
    }

    if (app.activeIndex < max) {
      window.setTimeout(function () {
        ensureAudioLoaded(
          audioKeyForIndex_(
            app.activeIndex + 1
          ),
          { background: true }
        );
      }, 350);
    }

    if (isMobileMode()) {
      var progress = document.getElementById('mobile-progress');
      if (progress && progress.scrollIntoView) {
        progress.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    }
  }

  function syncResponsiveState() {
    if (!app.payload) return;
    updateMobilePager();
  }

  function updateMobilePager() {
    var cards = document.querySelectorAll('.question-card');

    Array.prototype.forEach.call(cards, function (card, index) {
      card.classList.toggle('mobile-active', index === app.activeIndex);
    });

    var buttons = document.querySelectorAll('.progress-button');

    Array.prototype.forEach.call(buttons, function (button, index) {
      var section = sections[index];
      button.classList.toggle('current', index === app.activeIndex);
      button.classList.toggle(
        'answered',
        typeof app.answers[section] === 'number' && !app.uncertain[section]
      );
      button.classList.toggle(
        'uncertain-mark',
        typeof app.answers[section] === 'number' && !!app.uncertain[section]
      );
      button.setAttribute(
        'aria-current',
        index === app.activeIndex ? 'step' : 'false'
      );
    });

  }

  function updateLiveSummary() {
    updateMobilePager();
    updateWrittenGradeButton_();
  }

  function allAnswered() {
    return sections.every(function (section) {
      return typeof app.answers[section] === 'number';
    });
  }

  function submitAnswers() {
    if (!allAnswered() || app.locked || app.submitting) return;

    if (
      [
        'LISTENING',
        'SYSTEM_TEST',
        'WRITTEN'
      ].indexOf(
        app.payload && app.payload.mode
      ) < 0
    ) {
      showError(
        'この画面からは回答を送信できません。'
      );
      return;
    }

    app.submitting = true;
    setInteractiveDisabled(true);
    updateLiveSummary();

    var request = {
      schema: 'H3_WEB_SUBMIT_V1',
      mode: app.payload.mode,
      set_id: app.payload.set_id,
      txn_id:
        app.payload.txn_id || null,
      legacy_review_id:
        app.payload
          .legacy_review_id || null,
      answers: sections.map(function (section) {
        return {
          section: section,
          answer: app.answers[section],
          uncertain: !!app.uncertain[section]
        };
      })
    };

    google.script.run
      .withSuccessHandler(function (result) {
        app.submitting = false;
        app.locked = true;

        document.body.classList.add('graded');
        setInteractiveDisabled(true);
        pauseOtherAudio(null);

        document.getElementById('questions').classList.add('hidden');
        document.getElementById('mobile-progress').classList.add('hidden');

        renderResult(result);
        updateLiveSummary();

        if (isMobileMode()) {
          document.getElementById('result').scrollIntoView({
            block: 'start',
            behavior: 'smooth'
          });
        }
      })
      .withFailureHandler(function (err) {
        app.submitting = false;
        app.locked = false;
        setInteractiveDisabled(false);
        showError(
          '採点に失敗しました。回答は保持されています。\n' +
          errorText(err)
        );
        updateLiveSummary();
      })
      .submitListeningWebAnswers(request);
  }

  function setInteractiveDisabled(disabled) {
    Array.prototype.forEach.call(
      document.querySelectorAll('.choice, .uncertain, .written-reset-button, .written-grade-button'),
      function (node) {
        node.disabled = disabled;
      }
    );

  }

  function renderResult(result) {
    if (
      result.mode ===
        'REVIEW_REPLAY' &&
      result.after_replay &&
      (
        result.after_replay.schema ===
          'H3_PERSISTENT_REVIEW_PAYLOAD_V1' ||
        result.after_replay.schema ===
          'H3_LEGACY_PERSISTENT_REVIEW_PAYLOAD_V1'
      )
    ) {
      renderPersistentReview(
        result.after_replay
      );
      return;
    }

    if (
      result.mode === 'LISTENING' &&
      result.after_sync &&
      result.after_sync.schema ===
        'H3_PERSISTENT_REVIEW_PAYLOAD_V1'
    ) {
      renderPersistentReview(
        result.after_sync
      );
      return;
    }

    if (
      result.mode === 'WRITTEN' &&
      result.after_sync &&
      result.after_sync.schema ===
        'H3_PERSISTENT_WRITTEN_REVIEW_PAYLOAD_V1'
    ) {
      renderPersistentReview(
        result.after_sync
      );
      return;
    }

    var root =
      document.getElementById(
        'result'
      );
    root.textContent = '';
    root.classList.remove(
      'hidden'
    );

    var score =
      el('p', 'score');
    score.textContent =
      result.score +
      ' / ' +
      result.total;
    root.appendChild(score);

    var table =
      document.createElement(
        'table'
      );
    var thead =
      document.createElement(
        'thead'
      );
    var hr =
      document.createElement('tr');

    [
      '問題',
      '回答',
      '正答',
      '正誤'
    ].forEach(function (label) {
      var th =
        document.createElement('th');
      th.textContent = label;
      hr.appendChild(th);
    });

    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody =
      document.createElement(
        'tbody'
      );

    result.summary.forEach(
      function (row, index) {
        var tr =
          document.createElement('tr');

        var displayedAnswer =
          String(
            row.answer
          ) +
          (
            result.mode ===
              'WRITTEN' &&
            row.uncertain
              ? '?'
              : ''
          );

        [
          'Q' + (index + 1),
          displayedAnswer,
          String(
            row.correct_answer
          ),
          (
            row.result ||
            row.mark ||
            ''
          )
        ].forEach(
          function (value) {
            var td =
              document.createElement(
                'td'
              );
            td.textContent = value;
            tr.appendChild(td);
          }
        );

        tbody.appendChild(tr);
      }
    );

    table.appendChild(tbody);
    root.appendChild(table);

    if (
      result.mode ===
      'SYSTEM_TEST'
    ) {
      var note =
        el('p', 'poc-note');
      note.textContent =
        'SYSTEM_TESTのreceiptは専用test journalへ永続化済みです。学習runtime/historyにはWRITEしていません。';
      root.appendChild(note);
    }

    var pre =
      document.createElement('pre');
    pre.id = 'receipt';
    pre.textContent =
      result.receipt;
    root.appendChild(pre);

    var copy =
      el(
        'button',
        'copy-button'
      );
    copy.type = 'button';
    copy.textContent =
      '回答結果をコピー';
    copy.addEventListener(
      'click',
      function () {
        copyReceipt(
          result.receipt,
          copy
        );
      }
    );
    root.appendChild(copy);
  }

  function renderPersistentReview(
    review
  ) {
    resetForPayload();
    app.payload = review;
    app.locked = true;
    app.activeIndex = 0;

    document.body.classList.add(
      'graded'
    );

    var root =
      document.getElementById(
        'result'
      );
    root.textContent = '';
    root.classList.remove(
      'hidden'
    );

    var pager =
      el(
        'nav',
        'review-progress'
      );
    pager.setAttribute(
      'aria-label',
      '復習問題'
    );

    review.sections.forEach(
      function (part, index) {
        var button =
          el(
            'button',
            'review-progress-button'
          );

        button.type = 'button';
        button.dataset.index =
          String(index);
        button.textContent =
          'Q' +
          (index + 1) +
          ' ' +
          part.result;
        button.setAttribute(
          'aria-label',
          'Q' +
          (index + 1) +
          ' ' +
          part.result
        );

        button.addEventListener(
          'click',
          function () {
            setReviewPage(
              index,
              review
            );
          }
        );

        pager.appendChild(button);
      }
    );

    root.appendChild(pager);

    var cards =
      el(
        'div',
        'persistent-review-cards'
      );

    review.sections.forEach(
      function (part, index) {
        var card =
          buildPersistentReviewCard(
            part,
            index
          );
        card.dataset.reviewIndex =
          String(index);
        cards.appendChild(card);
      }
    );

    root.appendChild(cards);

    var technical =
      document.createElement(
        'details'
      );
    technical.className =
      'review-technical';

    var technicalSummary =
      document.createElement(
        'summary'
      );
    technicalSummary.textContent =
      '技術情報';
    technical.appendChild(
      technicalSummary
    );

    var ids =
      document.createElement('p');
    ids.textContent =
      'SET_ID=' +
      review.set_id +
      (
        review.kind ===
          'WRITTEN'
          ? '\nREVIEW_KIND=WRITTEN'
          : (
              review.legacy_review_id
                ? (
                    '\nLEGACY_REVIEW_ID=' +
                    review.legacy_review_id
                  )
                : (
                    '\nTXN_ID=' +
                    review.txn_id
                  )
            )
      );
    ids.className =
      'review-technical-ids';
    technical.appendChild(ids);

    if (
      review.technical &&
      review.technical.receipt
    ) {
      var pre =
        document.createElement(
          'pre'
        );
      pre.textContent =
        review.technical.receipt;
      technical.appendChild(pre);

      var copy =
        el(
          'button',
          'copy-button'
        );
      copy.type = 'button';
      copy.textContent =
        'receiptをコピー';
      copy.addEventListener(
        'click',
        function () {
          copyReceipt(
            review.technical
              .receipt,
            copy
          );
        }
      );
      technical.appendChild(copy);
    }

    root.appendChild(
      technical
    );

    var actions =
      el(
        'div',
        'review-footer-actions'
      );

    var back =
      el(
        'button',
        'secondary review-back-button'
      );
    back.type = 'button';
    back.textContent =
      'ホーム';
    back.addEventListener(
      'click',
      loadHome
    );
    actions.appendChild(back);

    root.appendChild(actions);

    setReviewPage(
      0,
      review
    );
  }

  function setReviewPage(
    index,
    review
  ) {
    var max =
      review.sections.length - 1;
    app.activeIndex =
      Math.max(
        0,
        Math.min(
          max,
          Number(index) || 0
        )
      );

    Array.prototype
      .forEach.call(
        document.querySelectorAll(
          '.persistent-review-card'
        ),
        function (card) {
          card.classList.toggle(
            'review-active',
            Number(
              card.dataset.reviewIndex
            ) === app.activeIndex
          );
        }
      );

    Array.prototype
      .forEach.call(
        document.querySelectorAll(
          '.review-progress-button'
        ),
        function (button) {
          var active =
            Number(
              button.dataset.index
            ) === app.activeIndex;

          button.classList.toggle(
            'current',
            active
          );

          button.setAttribute(
            'aria-current',
            active
              ? 'step'
              : 'false'
          );
        }
      );

    var section =
      review.sections[
        app.activeIndex
      ];

    if (
      section &&
      section.audio_asset_key
    ) {
      ensureAudioLoaded(
        section.audio_asset_key
      );
    }

    if (isMobileMode()) {
      var pager =
        document.querySelector(
          '.review-progress'
        );

      if (
        pager &&
        pager.scrollIntoView
      ) {
        pager.scrollIntoView({
          block: 'start',
          behavior: 'smooth'
        });
      }
    }
  }

  function buildPersistentReviewCard(
    part,
    index
  ) {
    var card =
      el(
        'section',
        'persistent-review-card'
      );
    card.dataset.result =
      part.result;

    var head =
      el(
        'div',
        'review-section-head'
      );
    var title =
      document.createElement('h3');
    title.textContent =
      'Q' +
      (index + 1) +
      ' ' +
      part.display +
      '　' +
      part.result;
    head.appendChild(title);

    if (part.audio_asset_key) {
      head.appendChild(
        buildAudioBlock(
          part.audio_asset_key,
          part.audio_fallback_url,
          '',
          true
        )
      );
    }

    card.appendChild(head);

    var answerRow =
      el(
        'div',
        'review-answer-row'
      );

    var user =
      document.createElement('p');
    var userAnswerText =
      part.user_answer_position
        ? circled[
            part.user_answer_position - 1
          ]
        : (
            typeof part.user_answer ===
              'number'
              ? circled[
                  part.user_answer - 1
                ]
              : String(
                  part.user_answer || ''
                )
          );
    user.textContent =
      'あなた　' +
      userAnswerText +
      (
        part.uncertain_known ===
          false
          ? ' ?—'
          : (
              part.uncertain
                ? ' ?'
                : ''
            )
      );
    answerRow.appendChild(user);

    var correct =
      document.createElement('p');
    var correctAnswerText =
      part.correct_answer_position
        ? circled[
            part.correct_answer_position - 1
          ]
        : (
            typeof part.correct_answer ===
              'number'
              ? circled[
                  part.correct_answer - 1
                ]
              : String(
                  part.correct_answer || ''
                )
          );
    correct.textContent =
      '正答　　' +
      correctAnswerText;
    answerRow.appendChild(
      correct
    );
    card.appendChild(
      answerRow
    );

    if (
      part.section === 'K1' &&
      part.question_surface &&
      part.question_surface
        .image_data_uri
    ) {
      var image =
        document.createElement('img');
      image.className =
        'k1-image review-k1-image';
      image.src =
        part.question_surface
          .image_data_uri;
      image.alt =
        'K1 問題画像';
      card.appendChild(image);
    }

    var scriptTitle =
      document.createElement('h4');
    scriptTitle.className =
      'review-block-title';
    scriptTitle.textContent =
      '問題・スクリプト';
    card.appendChild(
      scriptTitle
    );

    var script =
      document.createElement('pre');
    script.className =
      'review-section-script';
    script.textContent =
      part.script_text;
    card.appendChild(script);

    appendReviewTranslations(
      card,
      part.explanation
    );

    var details =
      document.createElement(
        'details'
      );
    details.className =
      'review-explanation';
    details.open =
      part.result !== '○';

    var summary =
      document.createElement(
        'summary'
      );
    summary.textContent =
      '解説';
    details.appendChild(
      summary
    );

    var body =
      el(
        'div',
        'review-explanation-body'
      );

    if (
      part.explanation &&
      part.explanation.reason
    ) {
      var reason =
        document.createElement('p');
      reason.className =
        'review-reason';
      reason.textContent =
        part.explanation.reason;
      body.appendChild(reason);
    } else if (
      part.explanation &&
      part.explanation.text &&
      part.explanation.text !==
        'UNKNOWN'
    ) {
      var writtenExplanation =
        document.createElement('p');
      writtenExplanation.className =
        'review-reason';
      writtenExplanation.textContent =
        part.explanation.text;
      body.appendChild(
        writtenExplanation
      );

      if (
        part.explanation
          .key_expression &&
        part.explanation
          .key_expression !==
          'UNKNOWN'
      ) {
        var keyExpression =
          document.createElement('p');
        keyExpression.className =
          'review-key-expression';
        keyExpression.textContent =
          part.explanation
            .key_expression;
        body.appendChild(
          keyExpression
        );
      }
    }

    (
      part.explanation &&
      part.explanation
        .learning_blocks ||
      []
    ).forEach(function (block) {
      body.appendChild(
        buildLearningBlock(
          block
        )
      );
    });

    details.appendChild(body);
    card.appendChild(details);

    return card;
  }

  function appendReviewTranslations(
    card,
    explanation
  ) {
    if (!explanation) return;

    var hasBody =
      !!explanation.body_ja;
    var choices =
      Array.isArray(
        explanation.choices
      )
        ? explanation.choices
        : [];
    var hasChoiceJa =
      choices.some(
        function (choice) {
          return !!choice.ja;
        }
      );

    if (
      !hasBody &&
      !hasChoiceJa
    ) {
      return;
    }

    var translation =
      el(
        'div',
        'review-translation'
      );

    if (hasBody) {
      var body =
        document.createElement('p');
      body.textContent =
        '→ ' +
        explanation.body_ja;
      translation.appendChild(body);
    }

    choices.forEach(
      function (choice, index) {
        if (!choice.ja) return;

        var row =
          document.createElement(
            'p'
          );
        var ko =
          choice.ko
            ? choice.ko + '　'
            : '';
        row.textContent =
          circled[index] +
          ' ' +
          ko +
          choice.ja;
        translation.appendChild(row);
      }
    );

    card.appendChild(
      translation
    );
  }

  function buildLearningBlock(
    block
  ) {
    var wrap =
      el(
        'div',
        'review-learning-block'
      );

    if (block.form) {
      var form =
        document.createElement('h5');
      form.textContent =
        block.form;
      wrap.appendChild(form);
    }

    if (block.usage) {
      var usage =
        document.createElement('p');
      usage.textContent =
        block.usage;
      wrap.appendChild(usage);
    }

    if (
      block.type ===
        'pronunciation' &&
      block.surface &&
      block.actual
    ) {
      var pronunciation =
        document.createElement('p');
      pronunciation.textContent =
        block.surface +
        ' → [' +
        block.actual +
        ']';
      wrap.appendChild(
        pronunciation
      );
    }

    if (
      Array.isArray(
        block.items
      )
    ) {
      block.items.forEach(
        function (item) {
          var line =
            document.createElement(
              'p'
            );
          var ko =
            item.ko || '';
          var hanja =
            item.hanja
              ? '（' +
                item.hanja +
                '）'
              : '';
          var ja =
            item.ja
              ? '　' + item.ja
              : '';
          line.textContent =
            ko + hanja + ja;
          wrap.appendChild(line);
        }
      );
    }

    if (block.note) {
      var note =
        document.createElement('p');
      note.textContent =
        block.note;
      wrap.appendChild(note);
    }

    if (block.example_ko) {
      var example =
        document.createElement('p');
      example.textContent =
        block.example_ko +
        (
          block.example_ja
            ? '　' +
              block.example_ja
            : ''
        );
      wrap.appendChild(example);
    }

    return wrap;
  }

  function copyReceipt(text, button) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () {
          button.textContent = 'コピー済み';
        })
        .catch(function () {
          legacyCopy(text, button);
        });
      return;
    }

    legacyCopy(text, button);
  }

  function legacyCopy(text, button) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';

    document.body.appendChild(area);
    area.select();

    try {
      document.execCommand('copy');
      button.textContent = 'コピー済み';
    } catch (e) {
      button.textContent = '上のreceiptを選択してください';
    }

    document.body.removeChild(area);
  }

  function el(tag, className) {
    var node = document.createElement(tag);
    node.className = className;
    return node;
  }

  function setLoading(on) {
    document.getElementById('loading').classList.toggle('hidden', !on);
  }

  function showError(message) {
    var node = document.getElementById('error');
    node.textContent = message;
    node.classList.remove('hidden');
  }

  function errorText(err) {
    if (!err) return 'UNKNOWN_ERROR';
    if (typeof err === 'string') return err;
    return err.message || String(err);
  }
})();
</script>
