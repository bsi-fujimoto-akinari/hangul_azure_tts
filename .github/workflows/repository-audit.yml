              'R3-10B normal schedule mismatch: ' +
              scheduled
            );
          }
          if (plan.supplemental !== null) {
            throw new Error('R3-10B unexpected supplemental');
          }
          if (plan.blocking_overflow.length !== 0) {
            throw new Error('R3-10B unexpected blocking overflow');
          }

          const preissue = fs.readFileSync(
            'WebAppPreissue.js',
            'utf8'
          );
          for (const needle of [
            'H3_LISTENING_OVERLOAD_PLAN_V3',
            'PREISSUE_OVERLOAD_PLAN_MISSING',
            'PREISSUE_OVERLOAD_PLAN_STALE',
            'PREISSUE_OVERLOAD_PLAN_BLOCKED'
          ]) {
            if (!preissue.includes(needle)) {
              throw new Error(
                'R3-10B preissue invariant missing: ' +
                needle
              );
            }
          }
          NODE

