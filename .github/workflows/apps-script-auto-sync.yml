name: Apps Script auto-sync

on:
  workflow_run:
    workflows: ["Repository audit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-auto-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout audited main source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 2

      - name: Verify checked-out source is main lineage
        shell: bash
        run: |
          git fetch origin main --depth=2
          if ! git merge-base --is-ancestor HEAD origin/main &&              ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Checked-out source is not on main lineage."
            exit 1
          fi

      - name: Detect Apps Script-impacting change
        id: impact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              *.js|*.gs|*.html|appsscript.json)
                changed=true
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r HEAD)

          if git log -1 --pretty=%B | grep -Fq '[review-audio-v2-pilot-regenerate]'; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check clasp credential availability
        if: steps.impact.outputs.changed == 'true'
        id: auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON is not configured. Apps Script sync is skipped safely."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize clasp credentials
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ.get('CLASPRC_JSON', '')
          if not value.strip():
              raise SystemExit('CLASPRC_JSON is empty')

          path = Path.home() / '.clasprc.json'
          path.write_text(value, encoding='utf-8')
          path.chmod(0o600)
          PY


      - name: Verify exact Apps Script target
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          data = json.loads(Path('.clasp.json').read_text(encoding='utf-8'))
          actual = data.get('scriptId')
          if actual != expected:
              raise SystemExit(f'Apps Script target mismatch: {actual!r}')
          PY

      - name: Show Apps Script file status
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 show-file-status --json

      - name: Push audited main to Apps Script HEAD
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          output="$(npx -y @google/clasp@3.4.0 push --force 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Skipping push'; then
            echo "::error::clasp skipped the push."
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Eq '^Pushed (one|[0-9]+) file|^Pushed no files|^Script is already up to date[.]$'; then
            echo "::error::clasp did not report a completed push."
            exit 1
          fi

      - name: Refresh API executable and regenerate v2 pilot
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          if ! git log -1 --pretty=%B | grep -Fq '[review-audio-v2-pilot-regenerate]'; then
            echo 'Review audio v2 pilot regeneration marker absent; skipped.'
            exit 0
          fi

          npx -y @google/clasp@3.4.0 update-deployment \
            AKfycbxmJnIPTKJY5beUVAU5d0RyKb0Nj-YarY8EkdyczgXHpJKVw4-0kdjv6cYEUXEDtw5D \
            --description "Review audio API executable v2 1200ms pilot 2026-09-22" \
            --json > /tmp/review-audio-v2-deploy.json

          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          script_id='1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          api_dep='AKfycbxmJnIPTKJY5beUVAU5d0RyKb0Nj-YarY8EkdyczgXHpJKVw4-0kdjv6cYEUXEDtw5D'
          web_dep='AKfycby8I309RUkfVIsnJks808KA713QLppfrGiAFUTV2tA'
          dep=json.loads(Path('/tmp/review-audio-v2-deploy.json').read_text(encoding='utf-8'))
          if dep.get('deploymentId') != api_dep:
              raise SystemExit(f'Existing API deployment ID not preserved: {dep.get("deploymentId")!r}')
          version=dep.get('versionNumber')
          if not version:
              raise SystemExit('API deployment update returned no versionNumber')

          rc=json.loads((Path.home()/'.clasprc.json').read_text(encoding='utf-8'))
          cred=(rc.get('tokens') or {}).get('default') or {}
          required=['client_id','client_secret','refresh_token']
          missing=[k for k in required if not cred.get(k)]
          if missing:
              raise SystemExit('Missing clasp credential fields: '+','.join(missing))

          body=urllib.parse.urlencode({
              'client_id':cred['client_id'],
              'client_secret':cred['client_secret'],
              'refresh_token':cred['refresh_token'],
              'grant_type':'refresh_token',
          }).encode('utf-8')
          req=urllib.request.Request(
              'https://oauth2.googleapis.com/token',
              data=body,
              headers={'Content-Type':'application/x-www-form-urlencoded'},
              method='POST',
          )
          with urllib.request.urlopen(req) as resp:
              token=json.loads(resp.read().decode('utf-8')).get('access_token')
          if not token:
              raise SystemExit('OAuth refresh did not return access_token')

          def get_json(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          base=f'https://script.googleapis.com/v1/projects/{script_id}/deployments'
          actual=None
          target=None
          for _ in range(12):
              target=get_json(f'{base}/{api_dep}')
              actual=(target.get('deploymentConfig') or {}).get('versionNumber')
              if actual is not None and int(actual)==int(version):
                  break
              time.sleep(5)
          if actual is None or int(actual)!=int(version):
              raise SystemExit(f'API deployment propagation mismatch: update={version!r}, readback={actual!r}')

          listing=get_json(base)
          ids={d.get('deploymentId') for d in (listing.get('deployments') or [])}
          if ids != {api_dep,web_dep}:
              raise SystemExit(f'Unexpected deployment inventory: {sorted(ids)}')

          eps=target.get('entryPoints') or []
          exec_eps=[ep for ep in eps if ep.get('entryPointType')=='EXECUTION_API']
          if not exec_eps:
              raise SystemExit('Updated API deployment has no EXECUTION_API entry point')
          access=((exec_eps[0].get('executionApi') or {}).get('entryPointConfig') or {}).get('access')
          if access!='MYSELF':
              raise SystemExit(f'Unexpected execution API access: {access!r}')

          web=get_json(f'{base}/{web_dep}')
          web_types=[ep.get('entryPointType') for ep in (web.get('entryPoints') or [])]
          if 'WEB_APP' not in web_types:
              raise SystemExit(f'Web deployment entry point changed unexpectedly: {web_types!r}')

          print(f'api_version_ready={actual}')
          print('deployment_id_preserved=true')
          print('deployment_inventory=PASS')
          print('execution_api_access=MYSELF')
          print('web_deployment_unchanged=true')
          print('duplicate_deployment_created=false')
          print('secret_values_printed=false')
          PY

          start_ts="$(date +%s)"
          npx -y @google/clasp@3.4.0 run-function \
            runReviewAudioPilotFamily1 \
            --nondev \
            --user default \
            --json > /tmp/review-audio-v2-pilot.json
          end_ts="$(date +%s)"

          python3 - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('/tmp/review-audio-v2-pilot.json').read_text(encoding='utf-8'))
          response=data.get('response')
          error=data.get('error')
          if error:
              raise SystemExit(f'v2 pilot returned error: {error!r}')
          if not isinstance(response,dict):
              raise SystemExit(f'Unexpected v2 pilot response type: {type(response).__name__}')

          sc=response.get('self_check') or {}
          if sc.get('ok') is not True:
              raise SystemExit(f'v2 self-check not ok: {sc!r}')
          if sc.get('set_count')!=24 or sc.get('asset_count')!=105:
              raise SystemExit(f'v2 self-check plan counts wrong: {sc!r}')
          if sc.get('counts')!={'5W':90,'2R':9,'2T':6}:
              raise SystemExit(f'v2 self-check family counts wrong: {sc!r}')
          if sc.get('d5_newline_count')!=18:
              raise SystemExit(f'v2 D5 newline count wrong: {sc!r}')
          if sc.get('break_ms')!=1200:
              raise SystemExit(f'v2 break_ms wrong: {sc!r}')
          if sc.get('generator_version')!='review-audio-v2-1200ms':
              raise SystemExit(f'v2 generator version wrong: {sc!r}')

          expected={'5W':5,'2R':3,'2T':2}
          seen={}
          replaced=0
          for fam in response.get('results') or []:
              family=fam.get('family')
              count=fam.get('asset_count')
              seen[family]=count
              if family not in expected or count!=expected[family]:
                  raise SystemExit(f'Unexpected v2 family count: {family!r}={count!r}')
              rows=fam.get('results') or []
              if len(rows)!=count:
                  raise SystemExit(f'Unexpected v2 result length for {family}: {len(rows)} != {count}')
              for row in rows:
                  if row.get('status')!='DONE':
                      raise SystemExit(f'Non-DONE v2 result: {row!r}')
                  if row.get('generator_version')!='review-audio-v2-1200ms':
                      raise SystemExit(f'Wrong v2 result generator: {row!r}')
                  if not row.get('file_id') or not row.get('audio_url') or not row.get('audio_text_sha256'):
                      raise SystemExit(f'Incomplete v2 result: {row!r}')
                  if not row.get('replaced_file_id'):
                      raise SystemExit(f'Missing replaced_file_id for v1 pilot migration: {row!r}')
                  replaced += 1

          if seen!=expected:
              raise SystemExit(f'v2 family counts mismatch: {seen!r}')
          if replaced!=10:
              raise SystemExit(f'Expected 10 replaced v1 assets, got {replaced}')

          print('review_audio_v2_pilot_regeneration=PASS')
          print('pilot_asset_count=10')
          print('family_5w_count=5')
          print('family_2r_count=3')
          print('family_2t_count=2')
          print('replaced_v1_count=10')
          print('break_ms=1200')
          print('generator_version=review-audio-v2-1200ms')
          print('all_status_done=true')
          print('secret_values_printed=false')
          PY

          echo "pilot_v2_wall_seconds=$((end_ts-start_ts))"

      - name: Read deployment inventory
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 list-deployments


      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apps Script auto-sync"
            echo ""
            echo "- source: $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "- Apps Script-impacting change: ${{ steps.impact.outputs.changed || 'unknown' }}"
            echo "- clasp credential ready: ${{ steps.auth.outputs.ready || 'not-needed' }}"
            echo "- target script ID: 1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-"
            echo '- manifest overwrite mode: audited CI only (clasp push --force)'
            echo '- versioned /exec deployment: not changed by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
