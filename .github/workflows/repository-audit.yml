      - name: Check 5L audio set fast path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          code = Path('Code.js').read_text(encoding='utf-8')

          start = code.index('function processListeningAudioSet_(')
          end = code.index('function snapshotListeningSet_(', start)
          process_set = code[start:end]
          if 'runListeningSetBatch_(' not in process_set:
              raise SystemExit('Normal 5L path does not enter the set batch runner.')
          if 'runListeningJob_(' in process_set:
              raise SystemExit('Normal 5L path still calls the serial member runner.')

          start = code.index('function runListeningSetBatch_(')
          end = code.index('function listeningPlanTextByRole_(', start)
          batch = code[start:end]
          for needle in [
              'UrlFetchApp.fetchAll(',
              'azureTtsFetchAllRequest_(',
              'azureTtsBlobFromResponse_(',
              'assertListeningBatchCurrent_(',
              'verifyDoneListeningItem_(',
          ]:
              if needle not in batch:
                  raise SystemExit(f'5L batch invariant missing: {needle}')
          if 'currentListeningRow_(' in batch:
              raise SystemExit('5L batch path reintroduced member-level row resolution.')
          if batch.count('SpreadsheetApp.flush();') != 2:
              raise SystemExit('5L happy path must contain exactly two explicit flushes.')
          for legacy in [
              'function combinedListeningSetSpec_(',
              'HQ_LISTENING_SET_AUDIO_VERSION',
          ]:
              if legacy in code:
                  raise SystemExit(f'Legacy combined-audio code remains: {legacy}')

          synth_start = code.index('function synthesize_(')
          synth_end = code.index('function azureTtsRequest_(', synth_start)
          synth = code[synth_start:synth_end]
          if 'azureTtsRequest_(' not in synth or 'azureTtsBlobFromResponse_(' not in synth:
              raise SystemExit('Serial and batch TTS do not share canonical request/response helpers.')
          PY

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const crypto = require('crypto');
          const source = fs.readFileSync('Code.js', 'utf8');
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          class MockBlob {
            constructor(bytes, mime) {
              this.bytes = bytes;
              this.mime = mime;
              this.name = '';
            }
            setName(name) { this.name = name; return this; }
          }

          let nextFileId = 1;
          class MockFile {
            constructor(name, description) {
              this.name = name;
              this.description = description || '';
              this.id = 'F' + nextFileId++;
              this.url = 'https://drive.test/' + this.id;
            }
            getId() { return this.id; }
            getUrl() { return this.url; }
            getName() { return this.name; }
            setName(name) { this.name = name; return this; }
            getDescription() { return this.description; }
            setDescription(value) { this.description = value; return this; }
            getSize() { return 256; }
            getMimeType() { return 'audio/mpeg'; }
            isTrashed() { return false; }
          }

          class MockFolder {
            constructor() {
              this.files = [];
              this.createCalls = 0;
              this.failOnCreateCall = null;
            }
            getFilesByName(name) {
              const matches = this.files.filter(file => file.getName() === name);
              let index = 0;
              return {
                hasNext: () => index < matches.length,
                next: () => matches[index++]
              };
            }
            createFile(blob) {
              this.createCalls++;
              if (this.failOnCreateCall === this.createCalls) {
                this.failOnCreateCall = null;
                throw new Error('simulated Drive interruption');
              }
              const file = new MockFile(blob.name, '');
              this.files.push(file);
              return file;
            }
          }

          class MockRange {
            constructor(sheet, row, column, rowCount, columnCount) {
              this.sheet = sheet;
              this.row = row;
              this.column = column;
              this.rowCount = rowCount || 1;
              this.columnCount = columnCount || 1;
            }
            matrix(sourceValue) {
              const out = [];
              for (let r = 0; r < this.rowCount; r++) {
                const row = [];
                for (let c = 0; c < this.columnCount; c++) {
                  row.push(sourceValue(this.row - 2 + r, this.column - 1 + c));
                }
                out.push(row);
              }
              return out;
            }
            getDisplayValues() {
              return this.matrix((r, c) => String(this.sheet.rows[r][c] || ''));
            }
            getFormulas() { return this.matrix(() => ''); }
            getNotes() {
              return this.matrix((r, c) => c === 0 ? (this.sheet.notes[r] || '') : '');
            }
            getNote() {
              return this.column === 1 ? (this.sheet.notes[this.row - 2] || '') : '';
            }
            setNote(note) {
              assert(this.column === 1, 'Only A-cell notes are supported.');
              this.sheet.notes[this.row - 2] = note;
              return this;
            }
            setValue(value) {
              this.sheet.rows[this.row - 2][this.column - 1] = String(value);
              return this;
            }
            clearContent() {
              for (let r = 0; r < this.rowCount; r++) {
                for (let c = 0; c < this.columnCount; c++) {
                  this.sheet.rows[this.row - 2 + r][this.column - 1 + c] = '';
                }
              }
              return this;
            }
            setValues(values) {
              for (let r = 0; r < this.rowCount; r++) {
                for (let c = 0; c < this.columnCount; c++) {
                  this.sheet.rows[this.row - 2 + r][this.column - 1 + c] = String(values[r][c]);
                }
              }
              return this;
            }
          }

          class MockSheet {
            constructor(rows) {
              this.rows = rows;
              this.notes = rows.map(() => '');
            }
            getLastRow() { return this.rows.length + 1; }
            getRange(row, column, rowCount, columnCount) {
              return new MockRange(this, row, column, rowCount, columnCount);
            }
          }

          const numberSegment = n => ({
            role: 'choice_number' + n,
            text: ['マルイチ','マルニ','マルサン','マルヨン'][n - 1],
            repeat: 1,
            pause_ms_after: 900
          });
          const choiceSegment = (n, repeat) => ({
            role: 'choice' + n,
            text: '선택 ' + n + '입니다.',
            repeat,
            pause_ms_after: 3200
          });

          function plans() {
            const k1 = [];
            for (let n = 1; n <= 4; n++) {
              k1.push(numberSegment(n), choiceSegment(n, 2));
            }
            const pair = [
              {role:'prompt', text:'질문입니다.', repeat:1, pause_ms_after:3200},
              {role:'prompt', text:'질문입니다.', repeat:1, pause_ms_after:5200}
            ];
            for (let n = 1; n <= 4; n++) {
              pair.push(numberSegment(n), choiceSegment(n, 1), choiceSegment(n, 1));
            }
            const passage = text => [
              {role:'passage', text, repeat:1, pause_ms_after:2200},
              {role:'replay_cue', text:'もう一度読みます', repeat:1, pause_ms_after:2200},
              {role:'passage', text, repeat:1, pause_ms_after:3200}
            ];
            return {
              K1:k1,
              K2:pair,
              K3:JSON.parse(JSON.stringify(pair)),
              K4:passage('네 번째 지문입니다.'),
              K5:passage('다섯 번째 지문입니다.')
            };
          }

          function makeRows(parentSetId) {
            const bySection = plans();
            return ['K1','K2','K3','K4','K5'].map((section, index) => [
              'H3-L-20260920-' + String(index + 1).padStart(3, '0'),
              'pending',
              '2026-09-20T00:00:00.000Z',
              parentSetId,
              '1',
              section,
              'H3-' + section + '-SK001',
              JSON.stringify(bySection[section]),
              '', '', '', '', '', '',
              'listening_audio_v1'
            ]);
          }

          function makeRuntime(parentSetId) {
            nextFileId = 1;
            const sheet = new MockSheet(makeRows(parentSetId));
            const folder = new MockFolder();
            const calls = {fetchAll:[], fetch:0, flush:0, script:0};
            let azureFailureIndex = null;
            let gateMode = 'ok';
            const bytes = Array(256).fill(0);
            bytes[0] = 73;
            bytes[1] = 68;
            bytes[2] = 51;

            const ctx = vm.createContext({
              console: {
                log: console.log,
                error: () => {}
              },
              JSON,
              String,
              Number,
              Array,
              Object,
              Date,
              Math,
              Set,
              RegExp,
              SpreadsheetApp: {flush: () => { calls.flush++; }},
              DriveApp: {
                getFolderById: () => folder,
                getFileById: id => {
                  const file = folder.files.find(item => item.getId() === id);
                  if (!file) throw new Error('missing file');
                  return file;
                }
              },
              UrlFetchApp: {
                fetch: () => {
                  calls.fetch++;
                  throw new Error('serial fetch forbidden');
                },
                fetchAll: requests => {
                  calls.fetchAll.push(requests);
                  return requests.map((_request, index) => ({
                    getResponseCode: () => index === azureFailureIndex ? 500 : 200,
                    getContentText: () => index === azureFailureIndex ? 'failed' : '',
                    getContent: () => bytes.slice()
                  }));
                }
              },
              Utilities: {
                DigestAlgorithm: {SHA_256:'SHA_256'},
                Charset: {UTF_8:'UTF_8'},
                computeDigest: (_algorithm, text) => Array.from(
                  crypto.createHash('sha256').update(String(text), 'utf8').digest()
                ),
                newBlob: (content, mime) => new MockBlob(content, mime)
              }
            });

            vm.runInContext(source, ctx, {filename:'Code.js'});
            ctx.shuffle_ = values => {
              const preferred = values.find(value => value.label === 'JiMin');
              return [preferred].concat(values.filter(value => value !== preferred));
            };
            ctx.assertBoundK1ReadyForSet_ = () => {
              if (gateMode === 'invalid') throw new Error('invalid K1_READY');
              if (gateMode === 'mutate') {
                sheet.rows[2][7] = JSON.stringify([
                  {role:'prompt',text:'변경입니다.',repeat:1,pause_ms_after:1000}
                ]);
              }
              return {};
            };
            ctx.assertListeningAudioSourceAttestation_ = () => ({
              object: {schema:'H3_LISTENING_AUDIO_SOURCE_ATTESTATION_V1'},
              sha256:'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            });
            ctx.persistListeningSetScript_ = (_setId, members) => {
              calls.script++;
              assert(
                members.length === 5 && members.every(member => member.values[1] === 'done'),
                'script persisted before all members were done'
              );
              return {file_id:'SCRIPT', url:'https://drive.test/SCRIPT'};
            };

            return {
              ctx,
              sheet,
              folder,
              calls,
              config: {
                AZURE_SPEECH_REGION:'test',
                AZURE_SPEECH_KEY:'secret',
                VOICE_FOLDER_ID:'legacy'
              },
              setAzureFailure: value => { azureFailureIndex = value; },
              setGateMode: value => { gateMode = value; }
            };
          }

          function runSet(runtime) {
            const parentSetId = runtime.sheet.rows[0][3];
            const members = runtime.ctx.snapshotListeningSet_(runtime.sheet, parentSetId);
            const seed = runtime.ctx.readListeningSnapshotJob_(members[0], true);
            return runtime.ctx.processListeningAudioSet_(runtime.sheet, seed, runtime.config);
          }

          function addReusable(runtime, count) {
            const parentSetId = runtime.sheet.rows[0][3];
            const members = runtime.ctx.snapshotListeningSet_(runtime.sheet, parentSetId);
            for (let i = 0; i < count; i++) {
              const job = runtime.ctx.readListeningSnapshotJob_(members[i], true);
              const state = {
                id:job.id,
                hash:job.hash,
                folderId:'1xeDF4AYNhykK1YPTh5rckyTmsGHvihaF',
                voice:'JiMin',
                audioVersion:vm.runInContext('HQ_LISTENING_AUDIO_VERSION', runtime.ctx),
                stage:'prepared',
                attempts:0
              };
              const spec = runtime.ctx.listeningAudioSpec_(job, state);
              runtime.folder.files.push(new MockFile(spec.tempName, spec.description));
            }
          }

          // CASE 1: five pending, five missing.
          {
            const rt = makeRuntime('H3-FASTPATH-CASE1');
            const result = runSet(rt);
            assert(result.status === 'done', 'CASE1 did not finish');
            assert(
              rt.calls.fetchAll.length === 1 && rt.calls.fetchAll[0].length === 5,
              'CASE1 did not use one five-request fetchAll'
            );
            assert(rt.calls.fetch === 0, 'CASE1 used serial fetch');
            assert(rt.sheet.rows.every(row => row[1] === 'done'), 'CASE1 has non-done rows');
            assert(rt.calls.flush === 2, 'CASE1 should use two happy-path flushes');
          }

          // CASE 2: two verified reusable + three missing.
          {
            const rt = makeRuntime('H3-FASTPATH-CASE2');
            addReusable(rt, 2);
            const reusedIds = rt.folder.files.map(file => file.getId());
            const result = runSet(rt);
            assert(result.status === 'done', 'CASE2 did not finish');
            assert(
              rt.calls.fetchAll.length === 1 && rt.calls.fetchAll[0].length === 3,
              'CASE2 fetchAll size mismatch'
            );
            assert(
              reusedIds.every(id => rt.folder.files.some(file => file.getId() === id)),
              'CASE2 replaced reusable audio'
            );
            assert(rt.folder.files.length === 5, 'CASE2 created duplicate audio');
          }

          // CASE 3: all five already done and verified.
          {
            const rt = makeRuntime('H3-FASTPATH-CASE3');
            assert(runSet(rt).status === 'done', 'CASE3 setup failed');
            const beforeFetch = rt.calls.fetchAll.length;
            const beforeFiles = rt.folder.files.length;
            const result = runSet(rt);
            assert(result.status === 'done', 'CASE3 verified rerun failed');
            assert(rt.calls.fetchAll.length === beforeFetch, 'CASE3 regenerated audio');
            assert(rt.folder.files.length === beforeFiles, 'CASE3 created files');
          }

          // CASE 4: invalid K1_READY fails before Azure and Drive mutation.
          {
            const rt = makeRuntime('H3-FASTPATH-CASE4');
            rt.setGateMode('invalid');
            let failed = false;
            try { runSet(rt); } catch (_error) { failed = true; }
            assert(failed, 'CASE4 accepted invalid K1_READY');
            assert(
              rt.calls.fetchAll.length === 0 && rt.folder.createCalls === 0,
              'CASE4 mutated Azure/Drive'
            );
          }

          // CASE 5: immutable mismatch fails before Azure.
          {
            const rt = makeRuntime('H3-FASTPATH-CASE5');
            rt.setGateMode('mutate');
            const result = runSet(rt);
            assert(result.status === 'error', 'CASE5 mismatch did not fail');
            assert(
              rt.calls.fetchAll.length === 0 && rt.folder.createCalls === 0,
              'CASE5 reached Azure/Drive'
            );
          }

          // CASE 6: one Azure response fails; no false done or Drive file.
          {
            const rt = makeRuntime('H3-FASTPATH-CASE6');
            const immutable = rt.sheet.rows.map(
              row => [row[0],row[2],row[3],row[4],row[5],row[6],row[7],row[14]]
            );
            rt.setAzureFailure(2);
            const result = runSet(rt);
            assert(result.status === 'error', 'CASE6 batch failure did not fail');
            assert(rt.sheet.rows.every(row => row[1] === 'error'), 'CASE6 published false done');
            assert(rt.folder.files.length === 0, 'CASE6 created files before validating responses');
            assert(
              JSON.stringify(immutable) === JSON.stringify(rt.sheet.rows.map(
                row => [row[0],row[2],row[3],row[4],row[5],row[6],row[7],row[14]]
              )),
              'CASE6 changed immutable evidence'
            );
          }

          // CASE 7: interruption after one file; rerun reuses it without duplication.
          {
            const rt = makeRuntime('H3-FASTPATH-CASE7');
            rt.folder.failOnCreateCall = 2;
            const interrupted = runSet(rt);
            assert(
              interrupted.status === 'error' && rt.folder.files.length === 1,
              'CASE7 interruption setup failed'
            );
            const firstId = rt.folder.files[0].getId();
            rt.sheet.rows.forEach(row => {
              if (row[1] === 'error') row[1] = 'pending';
            });
            const recovered = runSet(rt);
            assert(recovered.status === 'done', 'CASE7 recovery failed');
            assert(rt.folder.files.length === 5, 'CASE7 duplicate/conflicting output');
            assert(
              rt.folder.files.some(file => file.getId() === firstId),
              'CASE7 did not reuse first saved file'
            );
            assert(rt.calls.fetchAll[1].length === 4, 'CASE7 regenerated recovered audio');
          }

          // CASE 8: 5W dispatch remains on runJob_.
          {
            const start = source.indexOf('function processPendingAudioForSet(');
            const end = source.indexOf('function processLatestPendingAudioJob()', start);
