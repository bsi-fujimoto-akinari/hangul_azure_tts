          function installRunSequence(sequence) {
            let calls = 0;
            let successHandler = null;
            let failureHandler = null;
            const runner = {
              withSuccessHandler(fn) {
                successHandler = fn;
                return runner;
              },
              withFailureHandler(fn) {
                failureHandler = fn;
                return runner;
              },
              completeReviewSession(request) {
                calls += 1;
                const next = sequence.shift();
                if (!next) {
                  throw new Error(
                    'Missing fake RPC result.'
                  );
                }
                if (next.type === 'failure') {
                  failureHandler(
                    new Error('transport')
                  );
                } else {
                  successHandler(next.value);
                }
              }
            };
            context.google.script.run =
              runner;
            return () => calls;
          }

          const request = {
            schema:
              'H3_REVIEW_COMPLETE_REQUEST_V2',
            review_kind: 'LISTENING',
            surface_family: '5L',
            set_id: 'H3-L',
            review_source_id: 'TX-L',
