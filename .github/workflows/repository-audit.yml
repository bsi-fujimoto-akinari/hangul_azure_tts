              {role:'passage',text:'다시 한 번 들으세요.',repeat:1,pause_ms_after:2200},
              {role:'passage',text:'네 번째 지문입니다.',repeat:1,pause_ms_after:3200}
            ]],
            ['K5',[
              {role:'passage',text:'다섯 번째 지문입니다.',repeat:1,pause_ms_after:2200},
              {role:'passage',text:'다시 한 번 들으세요.',repeat:1,pause_ms_after:2200},
              {role:'passage',text:'다섯 번째 지문입니다.',repeat:1,pause_ms_after:3200}
            ]]
          ].map(([section,plan],i)=>({
            row:i+2,
            values:['ID'+i,'done','', 'H3-TEST', '1', section, 'H3-'+section+'-SK001', JSON.stringify(plan)]
          }));

          context.__scriptMembers = scriptMembers;
          const scriptText = run("buildListeningSetScript_('H3-TEST',__scriptMembers)");
          assert(scriptText.includes('[聞1/絵]'), '5L script missing K1 label.');
          assert(scriptText.includes('① 하나입니다.'), '5L script missing collapsed K1 choice.');
          assert(!scriptText.includes('マルイチ'), '5L script leaked Japanese number cue.');
          assert(scriptText.includes('[聞4/一致]\n네 번째 지문입니다.'), '5L script K4 passage mismatch.');
          assert(!scriptText.includes('다시 한 번 들으세요.'), '5L script leaked replay cue.');
          if ((scriptText.match(/네 번째 지문입니다\./g) || []).length !== 1) {
            throw new Error('5L script did not collapse repeated K4 passage.');
          }

          console.log('Audio semantic regression checks passed.');
