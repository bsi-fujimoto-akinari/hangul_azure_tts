name: Apps Script auto-sync

on:
  workflow_run:
    workflows: ["Repository audit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-auto-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout audited main source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 2

      - name: Verify checked-out source is main lineage
        shell: bash
        run: |
          git fetch origin main --depth=2
          if ! git merge-base --is-ancestor HEAD origin/main &&              ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Checked-out source is not on main lineage."
            exit 1
          fi

      - name: Detect Apps Script-impacting change
        id: impact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              *.js|*.gs|*.html|appsscript.json)
                changed=true
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r HEAD)

          if git log -1 --pretty=%B | grep -Fq '[e1-refresh-api-exec]'; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check clasp credential availability
        if: steps.impact.outputs.changed == 'true'
        id: auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLASPRC_JSON is not configured. Apps Script sync is skipped safely."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize clasp credentials
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          value = os.environ.get('CLASPRC_JSON', '')
          if not value.strip():
              raise SystemExit('CLASPRC_JSON is empty')

          path = Path.home() / '.clasprc.json'
          path.write_text(value, encoding='utf-8')
          path.chmod(0o600)
          PY


      - name: Verify exact Apps Script target
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          data = json.loads(Path('.clasp.json').read_text(encoding='utf-8'))
          actual = data.get('scriptId')
          if actual != expected:
              raise SystemExit(f'Apps Script target mismatch: {actual!r}')
          PY

      - name: Show Apps Script file status
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 show-file-status --json

      - name: Push audited main to Apps Script HEAD
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          output="$(npx -y @google/clasp@3.4.0 push --force 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'Skipping push'; then
            echo "::error::clasp skipped the push."
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Eq '^Pushed (one|[0-9]+) file|^Pushed no files|^Script is already up to date[.]$'; then
            echo "::error::clasp did not report a completed push."
            exit 1
          fi

      - name: Refresh and verify existing Review audio API executable
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          if ! git log -1 --pretty=%B | grep -Fq '[e1-refresh-api-exec]'; then
            echo 'E1 deployment refresh marker absent; skipped.'
            exit 0
          fi

          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          script_id = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          api_dep = 'AKfycbxmJnIPTKJY5beUVAU5d0RyKb0Nj-YarY8EkdyczgXHpJKVw4-0kdjv6cYEUXEDtw5D'
          web_dep = 'AKfycby8I309RUkfVIsnJks808KA713QLppfrGiAFUTV2tA'

          rc = json.loads((Path.home()/'.clasprc.json').read_text(encoding='utf-8'))
          cred = (rc.get('tokens') or {}).get('default') or {}
          required = ['client_id','client_secret','refresh_token']
          missing = [k for k in required if not cred.get(k)]
          if missing:
              raise SystemExit('Missing clasp credential fields: ' + ','.join(missing))

          body = urllib.parse.urlencode({
              'client_id': cred['client_id'],
              'client_secret': cred['client_secret'],
              'refresh_token': cred['refresh_token'],
              'grant_type': 'refresh_token',
          }).encode('utf-8')
          req = urllib.request.Request(
              'https://oauth2.googleapis.com/token',
              data=body,
              headers={'Content-Type':'application/x-www-form-urlencoded'},
              method='POST',
          )
          with urllib.request.urlopen(req) as resp:
              token = json.loads(resp.read().decode('utf-8')).get('access_token')
          if not token:
              raise SystemExit('OAuth refresh did not return access_token')

          def get_json(url):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          base = f'https://script.googleapis.com/v1/projects/{script_id}/deployments'
          listing = get_json(base)
          deps = listing.get('deployments') or []
          ids = {d.get('deploymentId') for d in deps}
          expected = {api_dep, web_dep}
          if ids != expected:
              raise SystemExit(f'Unexpected deployment inventory before update: {sorted(ids)}')

          target = get_json(f'{base}/{api_dep}')
          cfg = target.get('deploymentConfig') or {}
          version = cfg.get('versionNumber')
          eps = target.get('entryPoints') or []
          exec_eps = [ep for ep in eps if ep.get('entryPointType') == 'EXECUTION_API']
          if not exec_eps:
              raise SystemExit('Existing API deployment has no EXECUTION_API entry point')
          access = ((exec_eps[0].get('executionApi') or {}).get('entryPointConfig') or {}).get('access')
          if access != 'MYSELF':
              raise SystemExit(f'Unexpected execution API access before update: {access!r}')

          web = get_json(f'{base}/{web_dep}')
          web_types = [ep.get('entryPointType') for ep in (web.get('entryPoints') or [])]
          if 'WEB_APP' not in web_types:
              raise SystemExit(f'Expected web deployment entry point missing: {web_types!r}')

          Path('/tmp/e1-before.json').write_text(json.dumps({
              'api_version': version,
              'deployment_ids': sorted(ids),
              'execution_api_access': access,
              'web_entry_types': web_types,
          }), encoding='utf-8')

          print(f'api_version_before={version}')
          print('deployment_inventory_before=PASS')
          print('execution_api_access_before=MYSELF')
          print('web_deployment_before=PASS')
          print('secret_values_printed=false')
          PY

          npx -y @google/clasp@3.4.0 update-deployment \
            AKfycbxmJnIPTKJY5beUVAU5d0RyKb0Nj-YarY8EkdyczgXHpJKVw4-0kdjv6cYEUXEDtw5D \
            --description "Review audio API executable E1 refreshed 2026-09-22" \
            --json > /tmp/e1-update.json

          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          script_id = '1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-'
          api_dep = 'AKfycbxmJnIPTKJY5beUVAU5d0RyKb0Nj-YarY8EkdyczgXHpJKVw4-0kdjv6cYEUXEDtw5D'
          web_dep = 'AKfycby8I309RUkfVIsnJks808KA713QLppfrGiAFUTV2tA'

          before = json.loads(Path('/tmp/e1-before.json').read_text(encoding='utf-8'))
          update = json.loads(Path('/tmp/e1-update.json').read_text(encoding='utf-8'))

          if update.get('deploymentId') != api_dep:
              raise SystemExit(f'Existing deployment ID was not preserved: {update.get("deploymentId")!r}')
          new_version = update.get('versionNumber')
          if not new_version:
              raise SystemExit('Deployment update did not return a version number')
          old_version = before.get('api_version')
          if old_version is not None and int(new_version) <= int(old_version):
              raise SystemExit(f'API deployment version did not advance: {old_version!r} -> {new_version!r}')

          rc = json.loads((Path.home()/'.clasprc.json').read_text(encoding='utf-8'))
          cred = (rc.get('tokens') or {}).get('default') or {}
          body = urllib.parse.urlencode({
              'client_id': cred['client_id'],
              'client_secret': cred['client_secret'],
              'refresh_token': cred['refresh_token'],
              'grant_type': 'refresh_token',
          }).encode('utf-8')
          req = urllib.request.Request(
              'https://oauth2.googleapis.com/token',
              data=body,
              headers={'Content-Type':'application/x-www-form-urlencoded'},
              method='POST',
          )
          with urllib.request.urlopen(req) as resp:
              token = json.loads(resp.read().decode('utf-8')).get('access_token')

          def get_json(url):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          base = f'https://script.googleapis.com/v1/projects/{script_id}/deployments'
          listing = get_json(base)
          deps = listing.get('deployments') or []
          ids = {d.get('deploymentId') for d in deps}
          expected = {api_dep, web_dep}
          if ids != expected:
              raise SystemExit(f'Unexpected deployment inventory after update: {sorted(ids)}')

          target = get_json(f'{base}/{api_dep}')
          cfg = target.get('deploymentConfig') or {}
          actual_version = cfg.get('versionNumber')
          if int(actual_version) != int(new_version):
              raise SystemExit(f'API deployment version mismatch: update={new_version!r}, readback={actual_version!r}')

          eps = target.get('entryPoints') or []
          exec_eps = [ep for ep in eps if ep.get('entryPointType') == 'EXECUTION_API']
          if not exec_eps:
              raise SystemExit('Updated deployment has no EXECUTION_API entry point')
          access = ((exec_eps[0].get('executionApi') or {}).get('entryPointConfig') or {}).get('access')
          if access != 'MYSELF':
              raise SystemExit(f'Unexpected execution API access after update: {access!r}')

          web = get_json(f'{base}/{web_dep}')
          web_types = [ep.get('entryPointType') for ep in (web.get('entryPoints') or [])]
          if 'WEB_APP' not in web_types:
              raise SystemExit(f'Web deployment entry point changed unexpectedly: {web_types!r}')

          print('e1_api_deployment_refresh=PASS')
          print(f'api_version_after={actual_version}')
          print('deployment_id_preserved=true')
          print('deployment_inventory_after=PASS')
          print('execution_api_access_after=MYSELF')
          print('web_deployment_unchanged=true')
          print('duplicate_deployment_created=false')
          print('secret_values_printed=false')
          PY

      - name: Read deployment inventory
        if: steps.impact.outputs.changed == 'true' && steps.auth.outputs.ready == 'true'
        shell: bash
        run: npx -y @google/clasp@3.4.0 list-deployments


      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Apps Script auto-sync"
            echo ""
            echo "- source: $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "- Apps Script-impacting change: ${{ steps.impact.outputs.changed || 'unknown' }}"
            echo "- clasp credential ready: ${{ steps.auth.outputs.ready || 'not-needed' }}"
            echo "- target script ID: 1p_e1jKICTZXHpCrQ7rwU9HilloZdkFBpHry_lCq5YgXpaiU4FNEQlDa-"
            echo '- manifest overwrite mode: audited CI only (clasp push --force)'
            echo '- versioned /exec deployment: not changed by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
