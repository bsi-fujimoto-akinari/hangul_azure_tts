              screen: {
                width: 390,
                height: 844
              },
              matchMedia() {
                return {
                  matches: false,
                  addEventListener() {},
                  addListener() {}
                };
              },
              crypto: {
                getRandomValues(bytes) {
                  for (
                    let i = 0;
                    i < bytes.length;
                    i += 1
                  ) {
                    bytes[i] = i + 1;
                  }
                  return bytes;
                }
              },
              console
            },
            document: {
              addEventListener() {},
              body: {
                classList
              },
              documentElement: {
                style: {
                  setProperty() {}
                }
              }
