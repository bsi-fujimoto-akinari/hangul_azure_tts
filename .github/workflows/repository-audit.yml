              );
          assert.strictEqual(
            protectedText,
            '「この形です。」と説明する。\n→ これは例文訳です。'
          );

          function stripJapaneseQuotes(value) {
            let out = '';
            let depth = 0;
            for (const ch of String(value || '')) {
              if (ch === '「' || ch === '『') {
                depth++;
                continue;
              }
              if (ch === '」' || ch === '』') {
                depth = Math.max(
                  0,
                  depth - 1
                );
                continue;
              }
              if (depth === 0) {
                out += ch;
              }
            }
            return out;
          }

          const polite =
            /(?:です|ます|でした|ません|でしょう|ましょう|ください|ございます)(?=[。！？!?]|$|が[、,]|ので|から|ため|けれど|けれども|一方)/;

          function auditHardcodedMeta(
            source,
            label
          ) {
            const re =
              /(reason|usage|note)\s*:\s*'((?:\\'|[^'])*)'/g;
            let match;
            while (
              (match = re.exec(source)) !==
              null
            ) {
              const value =
                match[2]
                  .replace(/\\'/g, "'");
              const outside =
                stripJapaneseQuotes(
                  value
                )
                  .split(/\r?\n/)
                  .filter(
                    line =>
                      !/^\s*→/.test(line)
                  )
                  .join('\n');
              assert(
                !polite.test(outside),
                label +
                  ' contains polite meta-text: ' +
                  outside
              );
              polite.lastIndex = 0;

              const awkward =
