name: RS12 Prospective Evidence Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    name: rs12-prospective-evidence-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RS-12 prospective capture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          const source = fs.readFileSync('WebAppMultiSkillEvidence.js','utf8');
          const context = {console,JSON,Number,String,Object,Array,Math,Date};
          context.SpreadsheetApp = {flush() {}};
          context.globalThis = context;
          vm.createContext(context);
          vm.runInContext(source, context);

          assert.strictEqual(
            context.H3_MULTI_SKILL_CAPTURE_CONTRACT_ID_,
            'H3-RS12-PROSPECTIVE-CAPTURE-20260922-V1'
          );
          assert.strictEqual(
            context.H3_MULTI_SKILL_AUTHORING_CONTRACT_ID_,
            'H3-RS12-AUTHOR-VERIFIED-EXACT-V1'
          );

          const eh = context.H3_MULTI_SKILL_HEADERS_;
          const ch = context.H3_MULTI_SKILL_CONCEPT_HEADERS_;

          function row(headers,obj) {
            return headers.map(k =>
              Object.prototype.hasOwnProperty.call(obj,k) ? obj[k] : ''
            );
          }

          const concepts = [
            ch,
            row(ch,{
              CONCEPT_ID:'GRAM:-ㄹ_틈이_없다',
              LEVEL:'3級',
              CONCEPT_DOMAIN:'GRAMMAR',
              CONCEPT_LABEL:'-ㄹ 틈이 없다',
              SKILL_ID:'H3-P11-SK013',
              FAMILY:'TRANSLATION',
              SECTION_KEY:'H3-P11',
              APPLICATION_LABEL:'-ㄹ 틈이 없다',
              MAPPING_ROLE:'APPLICATION_SKILL',
              MATCH_TYPE:'EXACT_GRAMMAR_CONCEPT',
              CONFIDENCE:'HIGH',
              DIRECT_REUSE:'NO',
              STATE_TRANSFER:'NO',
              RETEST_CLOSURE:'NO',
              STABILITY_TRANSFER:'NO',
              SCHEDULER_USE:'DIAGNOSTIC_SELECTION_ONLY',
              STATUS:'ACTIVE_PILOT'
            })
          ];

          const event = {
            level:'3級',
            source_family:'WRITTEN',
            source_event_ref:'WRITTEN|H3TX-TEST|Q1',
            source_set_id:'H3-TEST',
            source_txn_id:'H3TX-TEST',
            source_q_no:1,
            source_surface_key:'WRITTEN|TEST|Q1',
            source_result:'×',
            direct_skill_id:'H3-P3-SK035'
          };
          const link = {
            link_role:'CONTRIBUTORY',
            target_skill_id:'H3-P11-SK013',
            concept_id:'GRAM:-ㄹ_틈이_없다',
            confidence:'HIGH',
            annotation_contract_id:'H3-RS12-AUTHOR-VERIFIED-EXACT-V1'
          };

          assert.deepStrictEqual(
            Array.from(context.h3MultiSkillNormalizeAuthoredLinks_(undefined)),
            []
          );

          assert.throws(
            () => context.h3MultiSkillNormalizeAuthoredLinks_([
              {...link, confidence:'MEDIUM'}
            ]),
            /CONFIDENCE_NOT_HIGH/
          );
          assert.throws(
            () => context.h3MultiSkillNormalizeAuthoredLinks_([
              {...link, link_role:'DIRECT'}
            ]),
            /LINK_ROLE_INVALID/
          );

          const built = context.h3MultiSkillBuildRowsFromValues_(
            event,[link],concepts,'2026-09-22T10:30:00+09:00'
          );
          assert.strictEqual(built.length,1);
          assert.strictEqual(built[0][3],'COMMITTED_LEARNING');
          assert.strictEqual(built[0][12],'CONTRIBUTORY');
          assert.strictEqual(built[0][16],'AUTHOR_VERIFIED_EXACT');
          assert.strictEqual(built[0][18],'NO');
          assert.strictEqual(built[0][19],'NO');
          assert.strictEqual(built[0][20],'NO');
          assert.strictEqual(built[0][21],'NO');
          assert.strictEqual(built[0][22],'DIAGNOSTIC_ONLY');
          assert.strictEqual(built[0][23],'ACTIVE_COMMITTED');

          assert.throws(
            () => context.h3MultiSkillBuildRowsFromValues_(
              {...event, source_family:'TRANSLATION'},
              [link],concepts,'2026-09-22T10:30:00+09:00'
            ),
            /TARGET_NOT_CROSS_FAMILY/
          );
          assert.throws(
            () => context.h3MultiSkillBuildRowsFromValues_(
              {...event, direct_skill_id:'H3-P11-SK013'},
              [link],concepts,'2026-09-22T10:30:00+09:00'
            ),
            /SECONDARY_EQUALS_DIRECT/
          );

          class FakeSheet {
            constructor(data) { this.data = data.map(r => r.slice()); }
            getLastRow() { return this.data.length; }
            getDataRange() {
              return {getDisplayValues: () => this.data.map(r => r.slice())};
            }
            getRange(r,c,rows,cols) {
              const self=this;
              return {
                getDisplayValues() {
                  const out=[];
                  for(let i=0;i<rows;i++) {
                    const src=self.data[r-1+i] || [];
                    out.push(Array.from({length:cols},(_,j)=>String(src[c-1+j] ?? '')));
                  }
                  return out;
                },
                setValues(values) {
                  for(let i=0;i<values.length;i++) {
                    while(self.data.length < r-1+i) self.data.push([]);
                    const target=self.data[r-1+i] || [];
                    for(let j=0;j<values[i].length;j++) {
                      target[c-1+j]=values[i][j];
                    }
                    self.data[r-1+i]=target;
                  }
                }
              };
            }
          }
          class FakeSpreadsheet {
            constructor() {
              this.sheets = {
                skill_concept_map_v1:new FakeSheet(concepts),
                multi_skill_evidence_v1:new FakeSheet([eh])
              };
            }
            getSheetByName(name) { return this.sheets[name] || null; }
          }

          const ss = new FakeSpreadsheet();
          const first = context.h3MultiSkillPersistCommitted_(
            ss,event,[link],'2026-09-22T10:30:00+09:00'
          );
          assert.strictEqual(first.status,'PASS');
          assert.strictEqual(first.written,1);

          const second = context.h3MultiSkillPersistCommitted_(
            ss,event,[link],'2026-09-22T10:30:00+09:00'
          );
          assert.strictEqual(second.status,'NO_OP');
          assert.strictEqual(second.no_op,1);

          assert.throws(
            () => context.h3MultiSkillPersistCommitted_(
              ss,{...event,source_result:'△'},[link],
              '2026-09-22T10:30:00+09:00'
            ),
            /LINK_ID_CONFLICT/
          );

          const noLinks = context.h3MultiSkillPersistCommitted_(
            ss,event,[],'2026-09-22T10:30:00+09:00'
          );
          assert.strictEqual(noLinks.status,'NO_LINKS');

          const files = {
            written:fs.readFileSync('WebAppWrittenProduction.js','utf8'),
            listening:fs.readFileSync('WebAppProduction.js','utf8'),
            reading:fs.readFileSync('WebAppReadingPilot.js','utf8'),
            readingProd:fs.readFileSync('WebAppReadingProduction.js','utf8'),
            translation:fs.readFileSync('WebAppTranslationV2.js','utf8'),
            translationProd:fs.readFileSync('WebAppTranslationV2Production.js','utf8')
          };

          assert(files.written.includes('h3MultiSkillWrittenPreflight_'));
          assert(files.written.includes('h3MultiSkillWrittenCapture_'));
          assert(files.listening.includes('h3MultiSkillListeningStoredPreflight_'));
          assert(files.listening.includes('h3MultiSkillListeningStoredCapture_'));
          assert(files.reading.includes('secondary_evidence_links'));
          assert(files.readingProd.includes('h3MultiSkillReadingPreflight_'));
          assert(files.readingProd.includes('h3MultiSkillReadingCapture_'));
          assert(files.translation.includes('secondary_evidence_links'));
          assert(files.translationProd.includes('h3MultiSkillTranslationV2Preflight_'));
          assert(files.translationProd.includes('h3MultiSkillTranslationV2Capture_'));

          console.log('RS-12 prospective secondary-evidence audit passed.');
          NODE
