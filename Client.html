<script>
(function () {
  'use strict';

  var sections = ['K1', 'K2', 'K3', 'K4', 'K5'];
  var circled = ['①', '②', '③', '④'];
  var mobileQuery = window.matchMedia('(max-width: 619px)');

  var app = {
    payload: null,
    answers: {},
    uncertain: {},
    locked: false,
    submitting: false,
    activeIndex: 0,
    mediaCache: {},
    mediaTrimMs: {},
    mediaLoading: {},
    reviewFilter: 'NEEDS_REVIEW'
  };

  document.addEventListener('DOMContentLoaded', function () {
    applyDeviceProfile();

    if (mobileQuery.addEventListener) {
      mobileQuery.addEventListener('change', syncResponsiveState);
    } else if (mobileQuery.addListener) {
      mobileQuery.addListener(syncResponsiveState);
    }

    loadSet();
  });

  function applyDeviceProfile() {
    var ua = navigator.userAgent || '';
    var screenWidth = Math.min(
      Number(window.screen && window.screen.width || 9999),
      Number(window.screen && window.screen.height || 9999)
    );
    var touch = Number(navigator.maxTouchPoints || 0) > 0;
    var iphoneLike =
      /iPhone|iPod/i.test(ua) ||
      (touch && screenWidth <= 500);

    if (!iphoneLike) return;

    document.body.classList.add('mobile-device');

    var layoutWidth = Number(window.innerWidth || 0);
    if (layoutWidth > 0 && screenWidth > 0 && layoutWidth > screenWidth * 1.35) {
      var zoom = Math.min(layoutWidth / screenWidth, 3);
      document.documentElement.style.setProperty('--h3-mobile-target-width', screenWidth + 'px');
      document.documentElement.style.setProperty('--h3-mobile-zoom', String(zoom));
      document.body.classList.add('mobile-viewport-emulated');
    }
  }

  function isMobileMode() {
    return document.body.classList.contains('mobile-device') || mobileQuery.matches;
  }

  function resetForPayload() {
    pauseOtherAudio(null);

    app.answers = {};
    app.uncertain = {};
    app.locked = false;
    app.submitting = false;
    app.activeIndex = 0;
    app.mediaCache = {};
    app.mediaTrimMs = {};
    app.mediaLoading = {};
    app.reviewFilter = 'NEEDS_REVIEW';

    document.body.classList.remove(
      'graded'
    );

    ['home', 'questions', 'result']
      .forEach(function (id) {
        var node =
          document.getElementById(id);
        node.textContent = '';
        node.classList.add('hidden');
      });

    document
      .getElementById(
        'mobile-progress'
      )
      .classList.add('hidden');

    var error =
      document.getElementById(
        'error'
      );
    error.textContent = '';
    error.classList.add('hidden');
  }

  function loadSet(request) {
    setLoading(true);
    resetForPayload();

    var webRequest =
      request ||
      window.H3_BOOT;

    google.script.run
      .withSuccessHandler(function (payload) {
        setLoading(false);
        app.payload = payload;

        if (payload.mode === 'HOME') {
          app.locked = true;
          renderHome(payload);
          return;
        }

        if (payload.mode === 'REVIEW') {
          app.locked = true;
          renderPersistentReview(
            payload
          );
          return;
        }

        renderQuestions(
          payload.questions
        );
        buildMobileProgress(
          payload.questions.length
        );

        document
          .getElementById(
            'questions'
          )
          .classList.remove('hidden');
        document
          .getElementById(
            'mobile-progress'
          )
          .classList.remove('hidden');

        app.activeIndex = 0;
        updateMobilePager();
        updateLiveSummary();
        scheduleInitialAudioPrefetch();
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        showError(
          errorText(err)
        );
      })
      .getListeningWebSet(
        webRequest
      );
  }

  function loadHome() {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'HOME',
      set_id: null,
      txn_id: null
    });
  }

  function loadReviewTxn(txnId) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'REVIEW',
      set_id: null,
      txn_id:
        String(txnId)
    });
  }

  function loadReplayTxn(txnId) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode:
        'REVIEW_REPLAY',
      set_id: null,
      txn_id:
        String(txnId)
    });
  }

  function loadLearningSet(setId) {
    loadSet({
      schema:
        'H3_WEB_RENDER_REQUEST_V1',
      mode: 'LISTENING',
      set_id:
        String(setId),
      txn_id: null
    });
  }

  function renderHome(payload) {
    var root =
      document.getElementById(
        'home'
      );
    root.textContent = '';
    root.classList.remove(
      'hidden'
    );

    var header =
      el('section', 'home-hero');
    var title =
      document.createElement('h2');
    title.textContent = 'H3 5L';
    var lead =
      document.createElement('p');
    lead.textContent =
      '出題と復習をここから開けます。';
    header.appendChild(title);
    header.appendChild(lead);
    root.appendChild(header);

    var current =
      el(
        'section',
        'home-card'
      );
    var currentTitle =
      document.createElement('h3');
    currentTitle.textContent =
      '現在の5L';
    current.appendChild(
      currentTitle
    );

    if (
      payload.current_learning
    ) {
      var currentInfo =
        document.createElement('p');
      currentInfo.textContent =
        '5L #' +
        payload.current_learning
          .listening_set_no;
      current.appendChild(
        currentInfo
      );

      var openCurrent =
        el(
          'button',
          'primary home-action'
        );
      openCurrent.type = 'button';
      openCurrent.textContent =
        '問題を開く';
      openCurrent.addEventListener(
        'click',
        function () {
          loadLearningSet(
            payload.current_learning
              .set_id
          );
        }
      );
      current.appendChild(
        openCurrent
      );
    } else {
      var none =
        document.createElement('p');
      none.textContent =
        '現在回答待ちの5Lはありません。';
      current.appendChild(none);
    }

    root.appendChild(current);

    var review =
      el(
        'section',
        'home-card review-library'
      );
    var reviewHead =
      el(
        'div',
        'home-card-head'
      );
    var reviewTitle =
      document.createElement('h3');
    reviewTitle.textContent =
      '復習';
    reviewHead.appendChild(
      reviewTitle
    );

    var filters =
      el(
        'div',
        'review-history-filters'
      );
    [
      {
        key: 'ALL',
        label: 'すべて'
      },
      {
        key: 'NEEDS_REVIEW',
        label: '要復習あり'
      }
    ].forEach(function (spec) {
      var button =
        el(
          'button',
          'review-filter-button'
        );
      button.type = 'button';
      button.dataset.filter =
        spec.key;
      button.textContent =
        spec.label;
      button.classList.toggle(
        'active',
        spec.key === 'ALL'
      );
      button.addEventListener(
        'click',
        function () {
          Array.prototype
            .forEach.call(
              filters.querySelectorAll(
                '.review-filter-button'
              ),
              function (node) {
                node.classList.toggle(
                  'active',
                  node === button
                );
              }
            );

          Array.prototype
            .forEach.call(
              review.querySelectorAll(
                '.review-history-item'
              ),
              function (node) {
                var show =
                  spec.key === 'ALL' ||
                  node.dataset
                    .needsReview ===
                    'true';
                node.classList.toggle(
                  'hidden',
                  !show
                );
              }
            );
        }
      );
      filters.appendChild(button);
    });

    reviewHead.appendChild(
      filters
    );
    review.appendChild(
      reviewHead
    );

    var history =
      el(
        'div',
        'review-history-list'
      );

    if (
      !payload.review_history ||
      !payload.review_history.length
    ) {
      var empty =
        document.createElement('p');
      empty.textContent =
        '復習できる履歴はまだありません。';
      history.appendChild(empty);
    } else {
      payload.review_history
        .forEach(function (entry) {
          var item =
            el(
              'article',
              'review-history-item'
            );
          item.dataset.needsReview =
            String(
              !!entry.needs_review
            );

          var meta =
            el(
              'div',
              'review-history-meta'
            );

          var heading =
            document.createElement('h4');
          heading.textContent =
            '5L #' +
            entry.listening_set_no;
          meta.appendChild(
            heading
          );

          var date =
            document.createElement('p');
          date.textContent =
            formatHistoryDate(
              entry.committed_at
            );
          meta.appendChild(date);

          var summary =
            document.createElement('p');
          summary.textContent =
            entry.score +
            ' / ' +
            entry.total +
            '　×' +
            entry.wrong_count +
            '　?' +
            entry.uncertain_count;
          meta.appendChild(
            summary
          );

          item.appendChild(meta);

          var actions =
            el(
              'div',
              'review-history-actions'
            );

          var open =
            el(
              'button',
              'secondary review-open-button'
            );
          open.type = 'button';
          open.textContent =
            '復習する';
          open.addEventListener(
            'click',
            function () {
              loadReviewTxn(
                entry.txn_id
              );
            }
          );
          actions.appendChild(open);

          var replay =
            el(
              'button',
              'secondary review-replay-open-button'
            );
          replay.type = 'button';
          replay.textContent =
            '再挑戦';
          replay.addEventListener(
            'click',
            function () {
              loadReplayTxn(
                entry.txn_id
              );
            }
          );
          actions.appendChild(replay);

          item.appendChild(
            actions
          );

          history.appendChild(
            item
          );
        });
    }

    review.appendChild(history);
    root.appendChild(review);
  }

  function formatHistoryDate(value) {
    var text =
      String(value || '');
    if (!text) return '';

    return text
      .replace('T', ' ')
      .replace(
        /:\d{2}\+09:00$/,
        ''
      )
      .replace(/-/g, '/');
  }

  function renderQuestions(questions) {
    var root = document.getElementById('questions');
    root.textContent = '';

    if (
      app.payload &&
      app.payload.mode ===
        'REVIEW_REPLAY'
    ) {
      var replayNotice =
        el(
          'section',
          'replay-notice'
        );
      var replayTitle =
        document.createElement('h2');
      replayTitle.textContent =
        '再挑戦';
      replayNotice.appendChild(
        replayTitle
      );

      var replayText =
        document.createElement('p');
      replayText.textContent =
        'この回答は学習成績・復習スケジュールには反映されません。';
      replayNotice.appendChild(
        replayText
      );

      root.appendChild(
        replayNotice
      );
    }

    questions.forEach(function (q, index) {
      var qNo = index + 1;
      var card = el('section', 'question-card');
      card.dataset.section = q.section;
      card.dataset.index = String(index);
      card.dataset.audioKey = q.audio_asset_key;
      if (index === 0) card.classList.add('mobile-active');

      var head = el('div', 'question-head');
      var title = el('h2', 'question-title');
      title.textContent = 'Q' + qNo + ' ' + q.display;

      var uncertain = el('button', 'uncertain');
      uncertain.type = 'button';
      uncertain.textContent = '?';
      uncertain.setAttribute('aria-label', 'Q' + qNo + ' 不確か');
      uncertain.setAttribute('aria-pressed', 'false');
      uncertain.addEventListener('click', function () {
        if (app.locked) return;

        app.uncertain[q.section] = !app.uncertain[q.section];
        uncertain.classList.toggle('active', !!app.uncertain[q.section]);
        uncertain.setAttribute('aria-pressed', String(!!app.uncertain[q.section]));
        updateLiveSummary();
      });

      head.appendChild(title);
      head.appendChild(
        buildAudioBlock(q.audio_asset_key, q.audio_fallback_url, '', true)
      );
      head.appendChild(uncertain);
      card.appendChild(head);

      if (q.section === 'K1') {
        var img = document.createElement('img');
        img.className = 'k1-image';
        img.src = q.image_data_uri;
        img.alt = 'K1 問題画像';
        img.decoding = 'async';
        img.loading = 'eager';
        card.appendChild(img);
      }

      var choices = el('div', 'choices' + (q.visible_choices ? '' : ' textless'));

      q.choice_ids.forEach(function (choiceId, choiceIndex) {
        var button = el('button', 'choice');
        button.type = 'button';
        button.dataset.answer = String(choiceId);
        button.textContent =
          circled[choiceIndex] +
          (q.visible_choices ? ' ' + q.visible_choices[choiceIndex] : '');

        button.addEventListener('click', function () {
          if (app.locked) return;

          app.answers[q.section] = choiceId;
          Array.prototype.forEach.call(
            choices.querySelectorAll('.choice'),
            function (node) {
              node.classList.toggle('selected', node === button);
            }
          );

          updateLiveSummary();

          if (!app.payload) return;

          if (index < app.payload.questions.length - 1) {
            var nextIndex = index + 1;
            var nextSection = sections[nextIndex];

            setActiveIndex(nextIndex);
            playAudioAssetNow(nextSection);
            return;
          }

          if (allAnswered()) {
            window.setTimeout(function () {
              submitAnswers();
            }, 80);
          } else {
            var firstMissing = sections.findIndex(function (section) {
              return typeof app.answers[section] !== 'number';
            });
            if (firstMissing >= 0) {
              setActiveIndex(firstMissing);
              playAudioAssetNow(sections[firstMissing]);
            }
          }
        });

        choices.appendChild(button);
      });

      card.appendChild(choices);
      root.appendChild(card);
    });
  }

  function buildAudioBlock(assetKey, fallbackUrl, label, compact) {
    var wrap = el('div', 'audio-wrap' + (compact ? ' compact-audio-wrap' : ''));

    if (label) {
      var title = el('p', 'audio-label');
      title.textContent = label;
      wrap.appendChild(title);
    }

    var controls = el('div', 'custom-audio-controls');

    var toggle = el('button', 'audio-toggle');
    toggle.type = 'button';
    toggle.dataset.assetKey = assetKey;
    toggle.disabled = true;
    toggle.textContent = compact ? '…' : '準備中…';
    controls.appendChild(toggle);

    var time = el('span', 'audio-time');
    time.dataset.assetKey = assetKey;
    time.textContent = '0:00 / --:--';
    controls.appendChild(time);

    wrap.appendChild(controls);

    var audio = document.createElement('audio');
    audio.className = 'audio-engine';
    audio.preload = 'none';
    audio.dataset.assetKey = assetKey;
    audio.setAttribute('playsinline', '');

    toggle.addEventListener('click', function () {
      if (!audio.getAttribute('src')) return;

      if (audio.paused) {
        prepareAudioStart(audio);
        pauseOtherAudio(audio);
        var promise = audio.play();
        if (promise && typeof promise.catch === 'function') {
          promise.catch(function () {
            setAudioStatus(
              assetKey,
              '再生を開始できませんでした。Driveリンクを使用してください。',
              true
            );
          });
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', function () {
      toggle.textContent = compact ? 'Ⅱ' : '❚❚ 一時停止';
      pauseOtherAudio(audio);
    });
    audio.addEventListener('pause', function () {
      if (!audio.ended) toggle.textContent = compact ? '▶' : '▶ 再生';
    });
    audio.addEventListener('ended', function () {
      toggle.textContent = compact ? '▶' : '▶ 再生';
      updateAudioTime(audio, time);
    });
    audio.addEventListener('loadedmetadata', function () {
      prepareAudioStart(audio);
      updateAudioTime(audio, time);
    });
    audio.addEventListener('timeupdate', function () {
      updateAudioTime(audio, time);
    });

    wrap.appendChild(audio);

    var status = el('p', 'audio-status');
    status.dataset.assetKey = assetKey;
    status.textContent = '';
    status.classList.add('hidden');
    wrap.appendChild(status);

    var fallback = document.createElement('a');
    fallback.className = 'media-fallback' + (compact ? ' hidden' : '');
    fallback.dataset.assetKey = assetKey;
    fallback.href = fallbackUrl;
    fallback.target = '_blank';
    fallback.rel = 'noopener';
    fallback.textContent = '再生できない場合はDriveで開く';
    wrap.appendChild(fallback);

    return wrap;
  }

  function getAudioSkipSeconds(audio) {
    return Math.max(0, Number(audio.dataset.skipMs || 0) / 1000);
  }

  function prepareAudioStart(audio) {
    var skip = getAudioSkipSeconds(audio);
    if (!isFinite(audio.duration)) return;
    if (audio.ended || audio.currentTime < skip - 0.05) {
      try {
        audio.currentTime = Math.min(skip, Math.max(0, audio.duration - 0.05));
      } catch (e) {
        // Metadata may not be fully seekable yet; timeupdate will correct display.
      }
    }
  }

  function updateAudioTime(audio, node) {
    var skip = getAudioSkipSeconds(audio);
    var rawCurrent = isFinite(audio.currentTime) ? audio.currentTime : skip;
    var rawDuration = isFinite(audio.duration) ? audio.duration : null;
    var current = Math.max(0, rawCurrent - skip);
    var duration = rawDuration === null ? null : Math.max(0, rawDuration - skip);

    node.textContent =
      formatAudioTime(current) + ' / ' +
      (duration === null ? '--:--' : formatAudioTime(duration));
  }

  function formatAudioTime(seconds) {
    var value = Math.max(0, Math.floor(Number(seconds) || 0));
    var minutes = Math.floor(value / 60);
    var remain = value % 60;
    return minutes + ':' + (remain < 10 ? '0' : '') + remain;
  }

  function scheduleInitialAudioPrefetch() {
    if (isMobileMode()) {
      ensureAudioLoaded(sections[0]);
      window.setTimeout(function () {
        ensureAudioLoaded(sections[1]);
      }, 500);
      return;
    }

    sections.forEach(function (section, index) {
      window.setTimeout(function () {
        ensureAudioLoaded(section);
      }, index * 350);
    });
  }

  function ensureAudioLoaded(assetKey) {
    if (!assetKey) return;

    if (app.mediaCache[assetKey]) {
      attachAudioData(
        assetKey,
        app.mediaCache[assetKey],
        app.mediaTrimMs[assetKey] || 0
      );
      return;
    }

    if (app.mediaLoading[assetKey]) return;
    app.mediaLoading[assetKey] = true;

    setAudioStatus(assetKey, '音声を準備中…', false);

    google.script.run
      .withSuccessHandler(function (media) {
        app.mediaLoading[assetKey] = false;
        app.mediaCache[assetKey] = media.data_uri;
        app.mediaTrimMs[assetKey] = Number(media.trim_start_ms || 0);
        attachAudioData(assetKey, media.data_uri, app.mediaTrimMs[assetKey]);
        setAudioStatus(assetKey, '', false);
      })
      .withFailureHandler(function (err) {
        app.mediaLoading[assetKey] = false;
        setAudioStatus(
          assetKey,
          'ページ内音声を準備できませんでした。Driveリンクを使用してください。',
          true
        );
        showError('音声準備エラー: ' + errorText(err));
      })
      .getListeningWebMedia({
        schema: 'H3_WEB_MEDIA_REQUEST_V1',
        mode: app.payload.mode,
        set_id: app.payload.set_id,
        txn_id:
          app.payload.txn_id || null,
        asset_key: assetKey
      });
  }

  function attachAudioData(assetKey, dataUri, trimStartMs) {
    var nodes = document.querySelectorAll(
      'audio[data-asset-key="' + assetKey + '"]'
    );

    Array.prototype.forEach.call(nodes, function (audio) {
      audio.dataset.skipMs = String(Math.max(0, Number(trimStartMs || 0)));
      if (!audio.getAttribute('src')) {
        audio.src = dataUri;
        audio.load();
      }
    });

    var toggles = document.querySelectorAll(
      '.audio-toggle[data-asset-key="' + assetKey + '"]'
    );
    Array.prototype.forEach.call(toggles, function (button) {
      button.disabled = false;
      button.textContent =
        button.closest('.compact-audio-wrap') ? '▶' : '▶ 再生';
    });
  }

  function setAudioStatus(assetKey, message, isError) {
    var nodes = document.querySelectorAll(
      '.audio-status[data-asset-key="' + assetKey + '"]'
    );

    Array.prototype.forEach.call(nodes, function (node) {
      node.textContent = message;
      node.classList.toggle('media-error', !!isError);
      node.classList.toggle('hidden', !message);
    });

    var fallbacks = document.querySelectorAll(
      '.media-fallback[data-asset-key="' + assetKey + '"]'
    );
    Array.prototype.forEach.call(fallbacks, function (node) {
      if (node.closest('.compact-audio-wrap')) {
        node.classList.toggle('hidden', !isError);
      }
    });
  }

  function playAudioAssetNow(assetKey) {
    if (!assetKey) return false;

    var audio = document.querySelector(
      'audio[data-asset-key="' + assetKey + '"]'
    );

    if (!audio || !audio.getAttribute('src')) {
      return false;
    }

    prepareAudioStart(audio);
    pauseOtherAudio(audio);

    var promise = audio.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(function () {
        // iOS may still reject playback if the media was not fully ready
        // within the same user gesture. In that case the visible play
        // button remains the fallback.
      });
    }

    return true;
  }

  function pauseOtherAudio(current) {
    Array.prototype.forEach.call(
      document.querySelectorAll('audio'),
      function (audio) {
        if (audio !== current && !audio.paused) {
          audio.pause();
        }
      }
    );
  }

  function buildMobileProgress(count) {
    var root = document.getElementById('mobile-progress');
    root.textContent = '';

    for (var i = 0; i < count; i += 1) {
      (function (index) {
        var button = el('button', 'progress-button');
        button.type = 'button';
        button.textContent = 'Q' + (index + 1);
        button.dataset.index = String(index);
        if (index === 0) button.classList.add('current');
        button.addEventListener('click', function () {
          setActiveIndex(index);
        });
        root.appendChild(button);
      })(i);
    }
  }

  function setActiveIndex(index) {
    if (!app.payload || app.locked) return;

    var max = app.payload.questions.length - 1;
    app.activeIndex = Math.max(0, Math.min(max, index));
    updateMobilePager();

    ensureAudioLoaded(sections[app.activeIndex]);
    if (app.activeIndex < max) {
      window.setTimeout(function () {
        ensureAudioLoaded(sections[app.activeIndex + 1]);
      }, 350);
    }

    if (isMobileMode()) {
      var progress = document.getElementById('mobile-progress');
      if (progress && progress.scrollIntoView) {
        progress.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    }
  }

  function syncResponsiveState() {
    if (!app.payload) return;
    updateMobilePager();
  }

  function updateMobilePager() {
    var cards = document.querySelectorAll('.question-card');

    Array.prototype.forEach.call(cards, function (card, index) {
      card.classList.toggle('mobile-active', index === app.activeIndex);
    });

    var buttons = document.querySelectorAll('.progress-button');

    Array.prototype.forEach.call(buttons, function (button, index) {
      var section = sections[index];
      button.classList.toggle('current', index === app.activeIndex);
      button.classList.toggle(
        'answered',
        typeof app.answers[section] === 'number' && !app.uncertain[section]
      );
      button.classList.toggle(
        'uncertain-mark',
        typeof app.answers[section] === 'number' && !!app.uncertain[section]
      );
      button.setAttribute(
        'aria-current',
        index === app.activeIndex ? 'step' : 'false'
      );
    });

  }

  function updateLiveSummary() {
    updateMobilePager();
  }

  function allAnswered() {
    return sections.every(function (section) {
      return typeof app.answers[section] === 'number';
    });
  }

  function submitAnswers() {
    if (!allAnswered() || app.locked || app.submitting) return;

    app.submitting = true;
    setInteractiveDisabled(true);
    updateLiveSummary();

    var request = {
      schema: 'H3_WEB_SUBMIT_V1',
      mode: app.payload.mode,
      set_id: app.payload.set_id,
      txn_id:
        app.payload.txn_id || null,
      answers: sections.map(function (section) {
        return {
          section: section,
          answer: app.answers[section],
          uncertain: !!app.uncertain[section]
        };
      })
    };

    google.script.run
      .withSuccessHandler(function (result) {
        app.submitting = false;
        app.locked = true;

        document.body.classList.add('graded');
        setInteractiveDisabled(true);
        pauseOtherAudio(null);

        document.getElementById('questions').classList.add('hidden');
        document.getElementById('mobile-progress').classList.add('hidden');

        renderResult(result);
        updateLiveSummary();

        if (isMobileMode()) {
          document.getElementById('result').scrollIntoView({
            block: 'start',
            behavior: 'smooth'
          });
        }
      })
      .withFailureHandler(function (err) {
        app.submitting = false;
        app.locked = false;
        setInteractiveDisabled(false);
        showError(
          '採点に失敗しました。回答は保持されています。\n' +
          errorText(err)
        );
        updateLiveSummary();
      })
      .submitListeningWebAnswers(request);
  }

  function setInteractiveDisabled(disabled) {
    Array.prototype.forEach.call(
      document.querySelectorAll('.choice, .uncertain'),
      function (node) {
        node.disabled = disabled;
      }
    );

  }

  function renderResult(result) {
    if (
      result.mode ===
        'REVIEW_REPLAY' &&
      result.after_replay &&
      result.after_replay.schema ===
        'H3_PERSISTENT_REVIEW_PAYLOAD_V1'
    ) {
      result.after_replay
        .replay_comparison = {
          replay_score:
            Number(
              result.score
            ),
          original_score:
            Number(
              result.original_score
            ),
          total:
            Number(
              result.total
            )
        };

      renderPersistentReview(
        result.after_replay
      );
      return;
    }

    if (
      result.mode === 'LISTENING' &&
      result.after_sync &&
      result.after_sync.schema ===
        'H3_PERSISTENT_REVIEW_PAYLOAD_V1'
    ) {
      renderPersistentReview(
        result.after_sync
      );
      return;
    }

    var root =
      document.getElementById(
        'result'
      );
    root.textContent = '';
    root.classList.remove(
      'hidden'
    );

    var score =
      el('p', 'score');
    score.textContent =
      result.score +
      ' / ' +
      result.total;
    root.appendChild(score);

    var table =
      document.createElement(
        'table'
      );
    var thead =
      document.createElement(
        'thead'
      );
    var hr =
      document.createElement('tr');

    [
      '問題',
      '回答',
      '正答',
      '正誤'
    ].forEach(function (label) {
      var th =
        document.createElement('th');
      th.textContent = label;
      hr.appendChild(th);
    });

    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody =
      document.createElement(
        'tbody'
      );

    result.summary.forEach(
      function (row, index) {
        var tr =
          document.createElement('tr');

        [
          'Q' + (index + 1),
          row.answer,
          String(
            row.correct_answer
          ),
          row.result
        ].forEach(
          function (value) {
            var td =
              document.createElement(
                'td'
              );
            td.textContent = value;
            tr.appendChild(td);
          }
        );

        tbody.appendChild(tr);
      }
    );

    table.appendChild(tbody);
    root.appendChild(table);

    if (
      result.mode ===
      'SYSTEM_TEST'
    ) {
      var note =
        el('p', 'poc-note');
      note.textContent =
        'SYSTEM_TESTのreceiptは専用test journalへ永続化済みです。学習runtime/historyにはWRITEしていません。';
      root.appendChild(note);
    }

    var pre =
      document.createElement('pre');
    pre.id = 'receipt';
    pre.textContent =
      result.receipt;
    root.appendChild(pre);

    var copy =
      el(
        'button',
        'copy-button'
      );
    copy.type = 'button';
    copy.textContent =
      '回答結果をコピー';
    copy.addEventListener(
      'click',
      function () {
        copyReceipt(
          result.receipt,
          copy
        );
      }
    );
    root.appendChild(copy);
  }

  function renderPersistentReview(
    review
  ) {
    resetForPayload();
    app.payload = review;
    app.locked = true;
    app.reviewFilter =
      review.default_filter ||
      'NEEDS_REVIEW';

    document.body.classList.add(
      'graded'
    );

    var root =
      document.getElementById(
        'result'
      );
    root.textContent = '';
    root.classList.remove(
      'hidden'
    );

    var header =
      el(
        'section',
        'persistent-review-header'
      );

    var eyebrow =
      el(
        'p',
        'review-eyebrow'
      );
    eyebrow.textContent =
      '5L #' +
      review.listening_set_no +
      ' 復習';
    header.appendChild(
      eyebrow
    );

    var score =
      el(
        'p',
        'persistent-review-score'
      );
    score.textContent =
      review.score +
      ' / ' +
      review.total;
    header.appendChild(score);

    var wrongCount = 0;
    var uncertainCount = 0;

    review.sections.forEach(
      function (part) {
        if (
          part.result === '×'
        ) {
          wrongCount += 1;
        }
        if (part.uncertain) {
          uncertainCount += 1;
        }
      }
    );

    var counts =
      el(
        'p',
        'review-counts'
      );
    counts.textContent =
      '× ' +
      wrongCount +
      '　? ' +
      uncertainCount;
    header.appendChild(counts);

    var strip =
      el(
        'div',
        'review-result-strip'
      );
    review.sections.forEach(
      function (part, index) {
        var chip =
          el(
            'span',
            'review-result-chip'
          );
        chip.textContent =
          'Q' +
          (index + 1) +
          ' ' +
          part.result;
        strip.appendChild(chip);
      }
    );
    header.appendChild(strip);

    var filters =
      el(
        'div',
        'review-filter-row'
      );

    [
      {
        key: 'NEEDS_REVIEW',
        label: '要復習'
      },
      {
        key: 'ALL',
        label: '全問'
      }
    ].forEach(function (spec) {
      var button =
        el(
          'button',
          'review-filter-button'
        );
      button.type = 'button';
      button.dataset.filter =
        spec.key;
      button.textContent =
        spec.label;
      button.classList.toggle(
        'active',
        spec.key ===
          app.reviewFilter
      );
      button.addEventListener(
        'click',
        function () {
          app.reviewFilter =
            spec.key;

          Array.prototype
            .forEach.call(
              filters.querySelectorAll(
                '.review-filter-button'
              ),
              function (node) {
                node.classList.toggle(
                  'active',
                  node === button
                );
              }
            );

          applyReviewFilter(
            root
          );
        }
      );
      filters.appendChild(button);
    });
    header.appendChild(filters);

    root.appendChild(header);

    if (
      review.replay_comparison
    ) {
      var comparison =
        el(
          'section',
          'replay-comparison'
        );
      comparison.textContent =
        '今回 ' +
        review.replay_comparison
          .replay_score +
        ' / ' +
        review.replay_comparison
          .total +
        '　元回答 ' +
        review.replay_comparison
          .original_score +
        ' / ' +
        review.replay_comparison
          .total;
      root.appendChild(
        comparison
      );
    }

    var cards =
      el(
        'div',
        'persistent-review-cards'
      );

    review.sections.forEach(
      function (part, index) {
        cards.appendChild(
          buildPersistentReviewCard(
            part,
            index
          )
        );
      }
    );

    root.appendChild(cards);

    var technical =
      document.createElement(
        'details'
      );
    technical.className =
      'review-technical';

    var technicalSummary =
      document.createElement(
        'summary'
      );
    technicalSummary.textContent =
      '技術情報';
    technical.appendChild(
      technicalSummary
    );

    var ids =
      document.createElement('p');
    ids.textContent =
      'SET_ID=' +
      review.set_id +
      '\nTXN_ID=' +
      review.txn_id;
    ids.className =
      'review-technical-ids';
    technical.appendChild(ids);

    if (
      review.technical &&
      review.technical.receipt
    ) {
      var pre =
        document.createElement(
          'pre'
        );
      pre.textContent =
        review.technical.receipt;
      technical.appendChild(pre);

      var copy =
        el(
          'button',
          'copy-button'
        );
      copy.type = 'button';
      copy.textContent =
        'receiptをコピー';
      copy.addEventListener(
        'click',
        function () {
          copyReceipt(
            review.technical
              .receipt,
            copy
          );
        }
      );
      technical.appendChild(copy);
    }

    root.appendChild(
      technical
    );

    var replay =
      el(
        'button',
        'primary review-replay-button'
      );
    replay.type = 'button';
    replay.textContent =
      'もう一度この5問を解く';
    replay.addEventListener(
      'click',
      function () {
        loadReplayTxn(
          review.txn_id
        );
      }
    );
    root.appendChild(
      replay
    );

    var back =
      el(
        'button',
        'secondary review-back-button'
      );
    back.type = 'button';
    back.textContent =
      '復習一覧へ戻る';
    back.addEventListener(
      'click',
      loadHome
    );
    root.appendChild(back);

    applyReviewFilter(root);

    review.sections.forEach(
      function (part, index) {
        window.setTimeout(
          function () {
            ensureAudioLoaded(
              part.audio_asset_key
            );
          },
          100 + index * 100
        );
      }
    );
  }

  function applyReviewFilter(root) {
    Array.prototype.forEach.call(
      root.querySelectorAll(
        '.persistent-review-card'
      ),
      function (card) {
        var show =
          app.reviewFilter ===
            'ALL' ||
          card.dataset.result !==
            '○';

        card.classList.toggle(
          'hidden',
          !show
        );
      }
    );
  }

  function buildPersistentReviewCard(
    part,
    index
  ) {
    var card =
      el(
        'section',
        'persistent-review-card'
      );
    card.dataset.result =
      part.result;

    var head =
      el(
        'div',
        'review-section-head'
      );
    var title =
      document.createElement('h3');
    title.textContent =
      'Q' +
      (index + 1) +
      ' ' +
      part.display +
      '　' +
      part.result;
    head.appendChild(title);

    head.appendChild(
      buildAudioBlock(
        part.audio_asset_key,
        part.audio_fallback_url,
        '',
        true
      )
    );

    card.appendChild(head);

    var answerRow =
      el(
        'div',
        'review-answer-row'
      );

    var user =
      document.createElement('p');
    user.textContent =
      'あなた　' +
      circled[
        part.user_answer - 1
      ] +
      (
        part.uncertain
          ? ' ?'
          : ''
      );
    answerRow.appendChild(user);

    var correct =
      document.createElement('p');
    correct.textContent =
      '正答　　' +
      circled[
        part.correct_answer - 1
      ];
    answerRow.appendChild(
      correct
    );
    card.appendChild(
      answerRow
    );

    if (
      part.section === 'K1' &&
      part.question_surface &&
      part.question_surface
        .image_data_uri
    ) {
      var image =
        document.createElement('img');
      image.className =
        'k1-image review-k1-image';
      image.src =
        part.question_surface
          .image_data_uri;
      image.alt =
        'K1 問題画像';
      card.appendChild(image);
    }

    var scriptTitle =
      document.createElement('h4');
    scriptTitle.className =
      'review-block-title';
    scriptTitle.textContent =
      '問題・スクリプト';
    card.appendChild(
      scriptTitle
    );

    var script =
      document.createElement('pre');
    script.className =
      'review-section-script';
    script.textContent =
      part.script_text;
    card.appendChild(script);

    appendReviewTranslations(
      card,
      part.explanation
    );

    var details =
      document.createElement(
        'details'
      );
    details.className =
      'review-explanation';
    details.open =
      part.result !== '○';

    var summary =
      document.createElement(
        'summary'
      );
    summary.textContent =
      '解説';
    details.appendChild(
      summary
    );

    var body =
      el(
        'div',
        'review-explanation-body'
      );

    if (
      part.explanation &&
      part.explanation.reason
    ) {
      var reason =
        document.createElement('p');
      reason.className =
        'review-reason';
      reason.textContent =
        part.explanation.reason;
      body.appendChild(reason);
    }

    (
      part.explanation &&
      part.explanation
        .learning_blocks ||
      []
    ).forEach(function (block) {
      body.appendChild(
        buildLearningBlock(
          block
        )
      );
    });

    details.appendChild(body);
    card.appendChild(details);

    return card;
  }

  function appendReviewTranslations(
    card,
    explanation
  ) {
    if (!explanation) return;

    var hasBody =
      !!explanation.body_ja;
    var choices =
      Array.isArray(
        explanation.choices
      )
        ? explanation.choices
        : [];
    var hasChoiceJa =
      choices.some(
        function (choice) {
          return !!choice.ja;
        }
      );

    if (
      !hasBody &&
      !hasChoiceJa
    ) {
      return;
    }

    var translation =
      el(
        'div',
        'review-translation'
      );

    if (hasBody) {
      var body =
        document.createElement('p');
      body.textContent =
        '→ ' +
        explanation.body_ja;
      translation.appendChild(body);
    }

    choices.forEach(
      function (choice, index) {
        if (!choice.ja) return;

        var row =
          document.createElement(
            'p'
          );
        var ko =
          choice.ko
            ? choice.ko + '　'
            : '';
        row.textContent =
          circled[index] +
          ' ' +
          ko +
          choice.ja;
        translation.appendChild(row);
      }
    );

    card.appendChild(
      translation
    );
  }

  function buildLearningBlock(
    block
  ) {
    var wrap =
      el(
        'div',
        'review-learning-block'
      );

    if (block.form) {
      var form =
        document.createElement('h5');
      form.textContent =
        block.form;
      wrap.appendChild(form);
    }

    if (block.usage) {
      var usage =
        document.createElement('p');
      usage.textContent =
        block.usage;
      wrap.appendChild(usage);
    }

    if (
      block.type ===
        'pronunciation' &&
      block.surface &&
      block.actual
    ) {
      var pronunciation =
        document.createElement('p');
      pronunciation.textContent =
        block.surface +
        ' → [' +
        block.actual +
        ']';
      wrap.appendChild(
        pronunciation
      );
    }

    if (
      Array.isArray(
        block.items
      )
    ) {
      block.items.forEach(
        function (item) {
          var line =
            document.createElement(
              'p'
            );
          var ko =
            item.ko || '';
          var hanja =
            item.hanja
              ? '（' +
                item.hanja +
                '）'
              : '';
          var ja =
            item.ja
              ? '　' + item.ja
              : '';
          line.textContent =
            ko + hanja + ja;
          wrap.appendChild(line);
        }
      );
    }

    if (block.note) {
      var note =
        document.createElement('p');
      note.textContent =
        block.note;
      wrap.appendChild(note);
    }

    if (block.example_ko) {
      var example =
        document.createElement('p');
      example.textContent =
        block.example_ko +
        (
          block.example_ja
            ? '　' +
              block.example_ja
            : ''
        );
      wrap.appendChild(example);
    }

    return wrap;
  }

  function copyReceipt(text, button) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () {
          button.textContent = 'コピー済み';
        })
        .catch(function () {
          legacyCopy(text, button);
        });
      return;
    }

    legacyCopy(text, button);
  }

  function legacyCopy(text, button) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';

    document.body.appendChild(area);
    area.select();

    try {
      document.execCommand('copy');
      button.textContent = 'コピー済み';
    } catch (e) {
      button.textContent = '上のreceiptを選択してください';
    }

    document.body.removeChild(area);
  }

  function el(tag, className) {
    var node = document.createElement(tag);
    node.className = className;
    return node;
  }

  function setLoading(on) {
    document.getElementById('loading').classList.toggle('hidden', !on);
  }

  function showError(message) {
    var node = document.getElementById('error');
    node.textContent = message;
    node.classList.remove('hidden');
  }

  function errorText(err) {
    if (!err) return 'UNKNOWN_ERROR';
    if (typeof err === 'string') return err;
    return err.message || String(err);
  }
})();
</script>
